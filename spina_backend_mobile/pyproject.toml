[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spina-mobile-collections"
version = "0.1.0"
description = "FastAPI and PostgreSQL idempotency boundary for Gilbic mobile collections."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]ntestpaths = ["tests"]
addopts = "-ra"
