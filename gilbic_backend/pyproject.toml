[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gilbic-backend"
version = "0.1.0"
description = "FastAPI backend for Gilbic mobile, SPINA desktop, and web portals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
]

[project.scripts]
gilbic-bootstrap-management = "gilbic_backend.bootstrap_management:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
