name: Temporary CIF CI Patch Runner

on:
  push:
    branches:
      - feat/cif-restricted-evidence

permissions:
  contents: write

concurrency:
  group: temp-cif-ci-patch
  cancel-in-progress: false

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: correct CIF PostgreSQL verification' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cif-restricted-evidence
          fetch-depth: 0

      - name: Apply two exact verified replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repository_path = Path(
              "gilbic_backend/src/gilbic_backend/cif_repository.py"
          )
          repository_text = repository_path.read_text(encoding="utf-8")
          uuid_aggregate = (
              "max(id) filter (where lifecycle_state = 'active') "
              "as active_cif_id"
          )
          if repository_text.count(uuid_aggregate) != 1:
              raise SystemExit(
                  "Expected exactly one UUID aggregate in cif_repository.py."
              )
          repository_text = repository_text.replace(
              uuid_aggregate,
              """(
                            select active.id
                            from lending.client_information_forms active
                            where active.client_id = %s
                              and active.lifecycle_state = 'active'
                            order by active.form_version desc, active.id desc
                            limit 1
                        ) as active_cif_id""",
          )
          anchor_start = repository_text.index(
              "select active.id",
          )
          anchor_end = repository_text.index(
              "version_row = cursor.fetchone()",
              anchor_start,
          )
          query_segment = repository_text[anchor_start:anchor_end]
          if query_segment.count("(client_id,),") != 1:
              raise SystemExit(
                  "Expected exactly one create-draft client parameter tuple."
              )
          query_segment = query_segment.replace(
              "(client_id,),",
              "(client_id, client_id),",
          )
          repository_text = (
              repository_text[:anchor_start]
              + query_segment
              + repository_text[anchor_end:]
          )
          repository_path.write_text(repository_text, encoding="utf-8")

          test_path = Path(
              "gilbic_backend/tests/test_cif_restricted_evidence_postgres.py"
          )
          test_text = test_path.read_text(encoding="utf-8")
          old_effective = "    effective_v2 = effective_v1 + timedelta(seconds=1)\n"
          if test_text.count(old_effective) != 1:
              raise SystemExit(
                  "Expected exactly one future-effective CIF test assignment."
              )
          test_path.write_text(
              test_text.replace(old_effective, "    effective_v2 = effective_v1\n"),
              encoding="utf-8",
          )
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'gilbic_backend/src/gilbic_backend/cif_repository.py'
          git diff --name-only | grep -Fx 'gilbic_backend/tests/test_cif_restricted_evidence_postgres.py'
          ! grep -F "max(id) filter (where lifecycle_state = 'active')" gilbic_backend/src/gilbic_backend/cif_repository.py
          grep -F "select active.id" gilbic_backend/src/gilbic_backend/cif_repository.py
          grep -F "(client_id, client_id)" gilbic_backend/src/gilbic_backend/cif_repository.py
          ! grep -F "effective_v1 + timedelta(seconds=1)" gilbic_backend/tests/test_cif_restricted_evidence_postgres.py
          grep -F "effective_v2 = effective_v1" gilbic_backend/tests/test_cif_restricted_evidence_postgres.py

      - name: Commit narrow correction
        shell: bash
        run: |
          git config user.name "SPINA CI"
          git config user.email "actions@users.noreply.github.com"
          git add gilbic_backend/src/gilbic_backend/cif_repository.py gilbic_backend/tests/test_cif_restricted_evidence_postgres.py
          git commit -m "fix: correct CIF PostgreSQL verification"
          git push origin HEAD:feat/cif-restricted-evidence
