name: Collector Route card batch 13

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile app, module, and tests
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/ui_cards.py \
            tools/extract_pure_helper_batch.py \
            tools/test_collector_route_card_batch_13.py

      - name: Verify exact extracted state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/collector_route_card_batch_13_manifest.json

      - name: Verify preserved Collector Route card behavior
        run: |
          PYTHONPATH=. python tools/test_collector_route_card_batch_13.py \
            --manifest tools/fixtures/collector_route_card_batch_13_manifest.json \
            --fixture tools/fixtures/collector_route_card_batch_13_behavior.json

# Final Wave 13 verification after the modularization map update.
