name: V1 tax accounting live schema verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0082_add_v1_tax_evidence_readiness.sql'
      - 'gilbic_backend/sql/0083_add_protected_v1_tax_liability_posting.sql'
      - 'gilbic_backend/sql/0084_harden_v1_tax_liability_preparation.sql'
      - 'gilbic_backend/sql/0085_add_protected_v1_tax_settlement.sql'
      - 'gilbic_backend/sql/0086_add_protected_v1_tax_adjustment_reversal.sql'
      - 'gilbic_backend/sql/0087_add_protected_v1_tax_additional_amendment.sql'
      - 'gilbic_backend/sql/0088_add_protected_v1_tax_additional_settlement.sql'
      - 'gilbic_backend/sql/0089_add_protected_v1_tax_recoverable_refund.sql'
      - 'gilbic_backend/sql/0090_add_protected_v1_tax_recoverable_credit_application.sql'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_evidence_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_evidence_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_liability_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_liability_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_settlement_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_settlement_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_adjustment_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_adjustment_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_additional_amendment_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_additional_amendment_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_refund_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_refund_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_credit_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_credit_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - 'docs/accounting/v1-tax-accounting-policy.md'
      - 'tools/apply_v1_tax_accounting_migrations.py'
      - 'gilbic_backend/tests/test_v1_tax_live_verifier_contract.py'
      - '.github/workflows/v1-tax-accounting-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0082_add_v1_tax_evidence_readiness.sql'
      - 'gilbic_backend/sql/0083_add_protected_v1_tax_liability_posting.sql'
      - 'gilbic_backend/sql/0084_harden_v1_tax_liability_preparation.sql'
      - 'gilbic_backend/sql/0085_add_protected_v1_tax_settlement.sql'
      - 'gilbic_backend/sql/0086_add_protected_v1_tax_adjustment_reversal.sql'
      - 'gilbic_backend/sql/0087_add_protected_v1_tax_additional_amendment.sql'
      - 'gilbic_backend/sql/0088_add_protected_v1_tax_additional_settlement.sql'
      - 'gilbic_backend/sql/0089_add_protected_v1_tax_recoverable_refund.sql'
      - 'gilbic_backend/sql/0090_add_protected_v1_tax_recoverable_credit_application.sql'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_evidence_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_evidence_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_liability_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_liability_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_settlement_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_settlement_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_adjustment_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_adjustment_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_additional_amendment_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_additional_amendment_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_refund_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_refund_api.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_credit_repository.py'
      - 'gilbic_backend/src/gilbic_backend/v1_tax_recoverable_credit_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - 'docs/accounting/v1-tax-accounting-policy.md'
      - 'tools/apply_v1_tax_accounting_migrations.py'
      - 'gilbic_backend/tests/test_v1_tax_live_verifier_contract.py'
      - '.github/workflows/v1-tax-accounting-live-verifier.yml'

permissions:
  contents: read

concurrency:
  group: v1-tax-accounting-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-v1-tax-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-v1-tax-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-v1-tax-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_v1_tax_accounting_migrations.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_evidence_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_evidence_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_liability_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_liability_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_settlement_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_settlement_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_adjustment_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_adjustment_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_additional_amendment_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_additional_amendment_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_recoverable_refund_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_recoverable_refund_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_recoverable_credit_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\v1_tax_recoverable_credit_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\main.py || exit /b 1

      - name: Verify PR live-verifier contract is schema-control only
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-v1-tax-live-venv"
          "%VENV%\Scripts\python.exe" -m pytest -q gilbic_backend\tests\test_v1_tax_live_verifier_contract.py || exit /b 1

      - name: Require approved live database runner
        if: github.event_name == 'push'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SPINA-WINDOWS') {
            throw "Live A6.2 tax migration requires SPINA-WINDOWS because approved database env files are local to that runner; current runner is $env:RUNNER_NAME."
          }

      - name: Install and verify A6.2 tax controls on live database
        if: github.event_name == 'push'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-v1-tax-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_v1_tax_accounting_migrations.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree when Git metadata is available
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git -and (Test-Path '.git')) {
            & $git.Source diff --check
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
            & $git.Source diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Working tree changed during verification.' }
            & $git.Source diff --cached --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Index changed during verification.' }
          }
          else {
            Write-Host 'Git metadata unavailable; exact actions/checkout revision was used.'
          }
