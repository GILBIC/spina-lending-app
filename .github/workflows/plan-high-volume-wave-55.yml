name: Extract Clients tab presentation Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/plan-high-volume-wave-55.yml"
      - "tools/extract_clients_tab_wave55_tmp.py"
      - "tools/fix_clients_tab_wave55_hash_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-clients-tab-wave-55-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55-clean'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-55-clean
          fetch-depth: 0
          show-progress: false
      - name: Correct dedented source hash guard
        shell: cmd
        run: python tools\fix_clients_tab_wave55_hash_tmp.py
      - name: Extract guarded Clients-tab boundary
        shell: cmd
        run: python tools\extract_clients_tab_wave55_tmp.py
      - name: Compile extracted code and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\clients_tab_presentation.py
          python -m py_compile tools\test_clients_tab_presentation_wave_55.py
          python -m py_compile tools\test_clients_tab_widget_smoke_wave_55.py
      - name: Run exact extraction regression
        shell: cmd
        run: python -m tools.test_clients_tab_presentation_wave_55
      - name: Run real Tkinter construction test
        shell: cmd
        run: python -m tools.test_clients_tab_widget_smoke_wave_55
      - name: Run protected client regressions
        shell: cmd
        run: |
          python -m tools.test_clients_read_presentation_wave_30
          python -m tools.test_client_read_queries_wave_31
          python -m tools.test_client_form_presentation_wave_38
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48
      - name: Regenerate and validate architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Finalize clean branch
        shell: cmd
        run: |
          if exist tools\extract_clients_tab_wave55_tmp.py del /f /q tools\extract_clients_tab_wave55_tmp.py
          if exist tools\fix_clients_tab_wave55_hash_tmp.py del /f /q tools\fix_clients_tab_wave55_hash_tmp.py
          if exist .github\workflows\plan-high-volume-wave-55.yml del /f /q .github\workflows\plan-high-volume-wave-55.yml
          if exist docs\wave-55-candidate-report.md del /f /q docs\wave-55-candidate-report.md
          if exist artifacts\wave-55-candidates.json del /f /q artifacts\wave-55-candidates.json
          if exist artifacts\wave-55-extraction.json del /f /q artifacts\wave-55-extraction.json
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Clients tab presentation Wave 55"
          git push origin HEAD:agent/high-volume-wave-55-clean
