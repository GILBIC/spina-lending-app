name: Extract Clients tab presentation Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/plan-high-volume-wave-55.yml"
      - "tools/extract_clients_tab_wave55_tmp.py"
      - "tools/fix_clients_tab_wave55_hash_tmp.py"
      - "tools/finalize_clients_tab_wave55_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-clients-tab-wave-55-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55-clean'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-55-clean
          fetch-depth: 0
          show-progress: false
      - name: Correct dedented source hash guard
        shell: cmd
        run: python tools\fix_clients_tab_wave55_hash_tmp.py
      - name: Extract guarded Clients-tab boundary
        shell: cmd
        run: python tools\extract_clients_tab_wave55_tmp.py >nul
      - name: Compile extracted code and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\clients_tab_presentation.py
          python -m py_compile tools\test_clients_tab_presentation_wave_55.py
          python -m py_compile tools\test_clients_tab_widget_smoke_wave_55.py
      - name: Run exact extraction regression
        shell: cmd
        run: python -m tools.test_clients_tab_presentation_wave_55 >nul
      - name: Run real Tkinter construction test
        shell: cmd
        run: python -m tools.test_clients_tab_widget_smoke_wave_55 >nul
      - name: Run protected client regressions
        shell: cmd
        run: |
          python -m tools.test_clients_read_presentation_wave_30 >nul
          python -m tools.test_client_read_queries_wave_31 >nul
          python -m tools.test_client_form_presentation_wave_38 >nul
          python -m tools.test_navigation_and_databank_shell_wave_29 >nul
          python -m tools.test_side_navigation_presentation_wave_48 >nul
          python -m tools.test_side_navigation_widget_smoke_wave_48 >nul
      - name: Regenerate and validate architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map >nul
          python -m tools.test_architecture_map >nul
      - name: Finalize clean branch
        shell: cmd
        run: python tools\finalize_clients_tab_wave55_tmp.py
