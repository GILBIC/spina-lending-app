name: Apply Clients read presentation Wave 30

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/clients-read-presentation-wave-30'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Check out Wave 30 branch
        uses: actions/checkout@v4
        with:
          ref: agent/clients-read-presentation-wave-30
          fetch-depth: 0

      - name: Verify Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Apply guarded 601-line extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools/patch_wave30_test_blob.py > artifacts\wave-30-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-30-apply.log & exit /b 1
          python -m tools.patch_wave30_test_blob >> artifacts\wave-30-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-30-apply.log & exit /b 1
          python -m py_compile tools/apply_clients_read_presentation_wave_30.py >> artifacts\wave-30-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-30-apply.log & exit /b 1
          python -m tools.apply_clients_read_presentation_wave_30 >> artifacts\wave-30-apply.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\wave-30-apply.log
          exit /b %CODE%

      - name: Upload Wave 30 apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-read-presentation-wave-30-apply-diagnostic
          path: artifacts/wave-30-apply.log
          if-no-files-found: warn

      - name: Install permanent Wave 30 workflow
        shell: cmd
        run: copy /Y tools\clients-read-presentation-wave-30.yml.txt .github\workflows\clients-read-presentation-wave-30.yml

      - name: Compile extracted application and modules
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/tabs/clients.py
          python -m py_compile spina_app/tabs/client_info_logs.py
          python -m py_compile tools/test_clients_read_presentation_wave_30.py
          python -m compileall -q spina_app

      - name: Run focused Wave 30 regression
        shell: cmd
        run: |
          python -m tools.test_clients_read_presentation_wave_30 > artifacts\wave-30-regression.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\wave-30-regression.log
          exit /b %CODE%

      - name: Upload Wave 30 regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-read-presentation-wave-30-regression-diagnostic
          path: artifacts/wave-30-regression.log
          if-no-files-found: warn

      - name: Run redundancy audit
        shell: cmd
        run: python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-30-redundancy.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-30-quality.json

      - name: Remove temporary Wave 30 tooling
        shell: cmd
        run: |
          del tools\inventory_clients_read_presentation_wave_30.py
          del tools\apply_clients_read_presentation_wave_30.py
          del tools\patch_wave30_test_blob.py
          del tools\clients-read-presentation-wave-30.yml.txt
          del .github\workflows\clients-read-presentation-wave-30-inventory.yml
          del .github\workflows\apply-clients-read-presentation-wave-30.yml
          rmdir /S /Q artifacts

      - name: Commit Wave 30 extraction locally
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Modularize Clients read presentation Wave 30"

      - name: Refresh permanent architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs/architecture
          git diff --cached --check
          git commit -m "Refresh architecture map after Wave 30"

      - name: Push completed Wave 30 branch
        shell: cmd
        run: git push origin HEAD:agent/clients-read-presentation-wave-30
