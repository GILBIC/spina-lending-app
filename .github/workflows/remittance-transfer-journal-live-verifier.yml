name: Remittance transfer journal live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0058_add_protected_remittance_transfer_journal_lifecycle.sql'
      - 'gilbic_backend/sql/0059_harden_remittance_transfer_journal_status.sql'
      - 'tools/apply_remittance_transfer_journal_lifecycle_migration.py'
      - 'tools/apply_remittance_transfer_journal_status_hardening.py'
      - 'tools/remittance-transfer-journal-live-migration.once'
      - '.github/workflows/remittance-transfer-journal-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0058_add_protected_remittance_transfer_journal_lifecycle.sql'
      - 'gilbic_backend/sql/0059_harden_remittance_transfer_journal_status.sql'
      - 'tools/apply_remittance_transfer_journal_lifecycle_migration.py'
      - 'tools/apply_remittance_transfer_journal_status_hardening.py'
      - 'tools/remittance-transfer-journal-live-migration.once'
      - '.github/workflows/remittance-transfer-journal-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remittance-transfer-journal-live-migration
  cancel-in-progress: true

jobs:
  verify-remittance-transfer-journal-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-remittance-transfer-journal-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" || exit /b 1

      - name: Compile protected live verifiers
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-remittance-transfer-journal-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_remittance_transfer_journal_lifecycle_migration.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_remittance_transfer_journal_status_hardening.py || exit /b 1

      - name: Verify PR is install-only
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0058_add_protected_remittance_transfer_journal_lifecycle.sql').read_text(encoding='utf-8'); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); p=s.split('CREATE OR REPLACE FUNCTION accounting.create_remittance_transfer_journal_draft',1)[0]; assert 'INSERT INTO accounting.journal_entries' not in p; assert 'INSERT INTO accounting.journal_lines' not in p; assert 'automatic_source_posting' in s; assert 'explicit_management_posting' in s; assert 'income_recognition' in s" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0059_harden_remittance_transfer_journal_status.sql').read_text(encoding='utf-8'); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'INSERT INTO accounting.journal_entries' not in s; assert 'INSERT INTO accounting.journal_lines' not in s; assert 'transfer_coordinate_ready' in s; assert 'automatic_source_posting' in s" || exit /b 1

      - name: Install and verify remittance transfer journal controls on live database
        if: github.event_name == 'push' && hashFiles('tools/remittance-transfer-journal-live-migration.once') != ''
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-remittance-transfer-journal-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_remittance_transfer_journal_lifecycle_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1
          "%VENV%\Scripts\python.exe" tools\apply_remittance_transfer_journal_status_hardening.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
