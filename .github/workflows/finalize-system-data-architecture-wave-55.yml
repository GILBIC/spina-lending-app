name: Finalize clean System Data architecture Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-system-data-architecture-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 55 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-55
          fetch-depth: 0
          show-progress: false

      - name: Remove this temporary workflow before map generation
        shell: cmd
        run: del .github\workflows\finalize-system-data-architecture-wave-55.yml

      - name: Regenerate architecture from the clean tree
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Re-run focused System Data and protected regressions
        shell: cmd
        run: |
          python -m tools.test_system_data_presentation_wave_55
          python -m tools.test_system_data_widget_smoke_wave_55
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Commit clean architecture files
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Refresh clean System Data architecture Wave 55"
          git push origin HEAD:agent/high-volume-wave-55
