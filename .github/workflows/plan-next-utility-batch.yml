name: Plan next utility batch

on:
  push:
    branches:
      - agent/next-utility-extraction

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate current module-separation plan
        run: |
          python tools/plan_module_separation.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json tools/fixtures/current_module_separation_plan.json

      - name: Commit plan when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/current_module_separation_plan.json
          if git diff --cached --quiet; then
            echo "Planner report unchanged."
            exit 0
          fi
          git commit -m "Generate current utility extraction plan"
          git push origin HEAD:${GITHUB_REF_NAME}
