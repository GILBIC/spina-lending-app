name: Stage 5D.26 live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0052_add_greenfield_regular_renewal_rollforward_targets.sql'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_eir_rollforward.py'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_renewal_rollforward_repository.py'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_renewal_rollforward_api.py'
      - 'gilbic_backend/tests/test_greenfield_regular_renewal_rollforward_postgres.py'
      - 'gilbic_backend/tests/test_greenfield_regular_renewal_rollforward_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - 'tools/apply_accounting_greenfield_regular_renewal_rollforward_migration.py'
      - 'tools/accounting-greenfield-regular-renewal-rollforward-live-migration.once'
      - '.github/workflows/stage5d26-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0052_add_greenfield_regular_renewal_rollforward_targets.sql'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_eir_rollforward.py'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_renewal_rollforward_repository.py'
      - 'gilbic_backend/src/gilbic_backend/greenfield_regular_renewal_rollforward_api.py'
      - 'gilbic_backend/tests/test_greenfield_regular_renewal_rollforward_postgres.py'
      - 'gilbic_backend/tests/test_greenfield_regular_renewal_rollforward_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - 'tools/apply_accounting_greenfield_regular_renewal_rollforward_migration.py'
      - 'tools/accounting-greenfield-regular-renewal-rollforward-live-migration.once'
      - '.github/workflows/stage5d26-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5d26-live-migration
  cancel-in-progress: true

jobs:
  verify-stage5d26-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d26-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d26-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_accounting_greenfield_regular_renewal_rollforward_migration.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\greenfield_regular_eir_rollforward.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\greenfield_regular_renewal_rollforward_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\greenfield_regular_renewal_rollforward_api.py || exit /b 1

      - name: Verify PR is read-only and install-only
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0052_add_greenfield_regular_renewal_rollforward_targets.sql').read_text(encoding='utf-8'); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'INSERT INTO accounting.journal_entries' not in s; assert 'INSERT INTO accounting.journal_lines' not in s; assert 'INSERT INTO lending.loan_renewal_execution_events' not in s; assert 'INSERT INTO lending.collection_transactions' not in s; assert 'INSERT INTO accounting.opening_balance_workbooks' not in s; assert 'true AS accounting_carrying_amount_ready' not in s; assert 'true AS journal_lines_enabled' not in s; assert 'true AS automatic_source_posting' not in s" || exit /b 1

      - name: Install and verify renewal roll-forward target view on live database
        if: github.event_name == 'push' && hashFiles('tools/accounting-greenfield-regular-renewal-rollforward-live-migration.once') != ''
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d26-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_accounting_greenfield_regular_renewal_rollforward_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
