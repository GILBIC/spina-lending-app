name: PostgreSQL read storage Wave 35 bootstrap
on: [pull_request]
permissions:
  contents: read
jobs:
  inventory:
    if: github.head_ref == 'agent/postgres-read-storage-wave-35'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Check out Wave 35 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify Python
        shell: cmd
        run: |
          where python
          python --version
      - name: Generate exact PostgreSQL helper inventory
        shell: cmd
        run: python tools\apply_postgres_read_storage_wave_35.py
      - name: Upload PostgreSQL helper inventory
        uses: actions/upload-artifact@v4
        with:
          name: wave-35-postgres-helper-inventory
          path: |
            artifacts/wave35-inventory.json
            artifacts/wave35-inventory.md
          if-no-files-found: error
