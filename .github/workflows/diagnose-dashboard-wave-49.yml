name: Diagnose Dashboard compatibility Wave 49
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/extract_databank_presentation_wave_49.py"
      - "tools/diagnose_dashboard_regression_wave_49.py"
      - ".github/workflows/diagnose-dashboard-wave-49.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'agent/databank-dashboard-presentation-wave-49'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile diagnostic and extractor
        shell: cmd
        run: |
          python -m py_compile tools/extract_databank_presentation_wave_49.py
          python -m py_compile tools/diagnose_dashboard_regression_wave_49.py
      - name: Apply extraction in diagnostic workspace
        shell: cmd
        run: python tools/extract_databank_presentation_wave_49.py
      - name: Diagnose Dashboard Wave 28 invariants
        shell: cmd
        run: python tools/diagnose_dashboard_regression_wave_49.py
      - name: Upload Dashboard diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-49-dashboard-diagnostic
          path: artifacts/wave-49-dashboard-diagnostic.json
