name: Inspect UI button factories Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/ui_controls.py"
      - "spina_app/collector_tab_presentation.py"
      - "spina_app/login_dialog_presentation.py"
      - "tools/inspect_ui_button_factories_wave_50.py"
      - ".github/workflows/inspect-ui-button-factories-wave-50.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/presentation-batch-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_ui_button_factories_wave_50.py
      - name: Inspect UI button factory boundary
        shell: cmd
        run: python tools/inspect_ui_button_factories_wave_50.py
      - name: Upload Wave 50 button boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-ui-button-factories-boundary
          path: artifacts/wave-50-ui-button-factories-boundary.json
