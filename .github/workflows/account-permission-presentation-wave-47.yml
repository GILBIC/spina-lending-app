name: Account permission presentation Wave 47
on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/account_permission_presentation.py"
      - "tools/test_account_permission_presentation_wave_47.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/account-permission-presentation-wave-47.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/account_permission_presentation.py
          python -m py_compile tools/test_account_permission_presentation_wave_47.py
          python -m compileall -q spina_app
      - name: Run exact account-permission regression
        shell: cmd
        run: python tools/test_account_permission_presentation_wave_47.py
      - name: Run protected login dialog regressions
        shell: cmd
        run: |
          python tools/test_login_dialog_presentation_wave_45.py
          python tools/test_login_dialog_widget_smoke_wave_45.py
      - name: Run protected account-header regressions
        shell: cmd
        run: |
          python tools/test_account_header_presentation_wave_46.py
          python tools/test_account_header_widget_smoke_wave_46.py
          python tools/test_tk_shutdown_wave_46.py
          python tools/test_login_cancel_startup_wave_46.py
      - name: Validate permanent architecture map
        shell: cmd
        run: python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-47-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-47-quality.json
      - name: Upload Wave 47 reports
        uses: actions/upload-artifact@v4
        with:
          name: wave-47-reports
          path: artifacts/wave-47-*.json
