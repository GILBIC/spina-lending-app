name: Extract Audit presentation Wave 54

on:
  push:
    branches:
      - agent/high-volume-wave-54
    paths:
      - "tools/extract_audit_presentation_wave_54.py"
      - ".github/workflows/extract-audit-presentation-wave-54.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-audit-presentation-wave-54
  cancel-in-progress: true

jobs:
  extract:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 54 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-54
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded Audit extraction
        shell: cmd
        run: |
          python -m py_compile tools\extract_audit_presentation_wave_54.py
          python tools\extract_audit_presentation_wave_54.py

      - name: Compile extracted application and regression
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\audit_presentation.py
          python -m py_compile tools\test_audit_presentation_wave_54.py
          python -m compileall -q spina_app

      - name: Run exact Audit extraction regression
        shell: cmd
        run: python -m tools.test_audit_presentation_wave_54

      - name: Refresh and validate architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Commit extracted Audit presentation
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\audit_presentation.py tools\test_audit_presentation_wave_54.py architecture-map.json docs\architecture
          git diff --cached --quiet && exit /b 0
          git commit -m "Extract Audit presentation Wave 54"
          git push origin HEAD:agent/high-volume-wave-54
