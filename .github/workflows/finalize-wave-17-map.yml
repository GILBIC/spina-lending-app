name: Finalize Wave 17 modularization map

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update map idempotently
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/modularization-map.md')
          text = path.read_text(encoding='utf-8')

          def replace_or_verify(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'Missing map marker for {label}: {old!r}')
              text = text.replace(old, new, 1)

          replace_or_verify(
              '> **Tracked main state:** after merged PR #117  ',
              '> **Tracked main state:** after merged PR #118  ',
              'tracked main state',
          )
          replace_or_verify(
              '| Focused helper functions extracted from the large desktop source | **60** |',
              '| Functions extracted from the large desktop source | **65** |',
              'function count',
          )
          replace_or_verify(
              '| Focused helper modules receiving extracted functions | **13** |\n| Hierarchical Area production modules | **3** |',
              '| Focused helper modules receiving extracted functions | **13** |\n| Feature-level tab modules | **1** |\n| Hierarchical Area production modules | **3** |',
              'feature module status row',
          )
          replace_or_verify(
              '| Accelerated modularization waves completed | **16** |',
              '| Accelerated modularization waves completed | **17** |',
              'wave count',
          )
          replace_or_verify(
              '| Latest completed extraction | **Wave 16 / PR #117** |',
              '| Latest completed extraction | **Wave 17 / PR #118** |',
              'latest extraction',
          )
          replace_or_verify(
              '| Next step | **Wave 17 read-only inspection** |',
              '| Next step | **Wave 18 feature inventory** |',
              'next step',
          )

          if 'APP --> TABDASH[tabs/dashboard.py]' not in text:
              marker = '    APP --> UICTL[ui_controls.py]\n'
              if marker not in text:
                  raise RuntimeError('Missing architecture insertion marker')
              text = text.replace(marker, marker + '    APP --> TABDASH[tabs/dashboard.py]\n', 1)

          replace_or_verify(
              '| **Total** |  | **60** |',
              '| **Helper total** |  | **60** |',
              'helper total label',
          )

          feature_inventory = '''### Feature-level tab modules

| Module | Extracted ownership | Function count | Moved source lines |
|---|---|---:|---:|
| `spina_app/tabs/dashboard.py` | Legacy Dashboard construction, filtering, charts, table population, and refresh orchestration | 5 | 462 |

'''
          if feature_inventory not in text:
              marker = '### Hierarchical Area modules\n'
              if marker not in text:
                  raise RuntimeError('Missing feature inventory insertion marker')
              text = text.replace(marker, feature_inventory + marker, 1)

          ownership = '''### `spina_app/tabs/dashboard.py`

- `_spina_v17_visible_dashboard_rows` — PR #118
- `_spina_v17_build_dashboard_tab` — PR #118
- `_spina_v17_draw_dashboard_charts` — PR #118
- `_spina_v17_populate_dashboard_tree` — PR #118
- `_spina_v17_refresh_dashboard` — PR #118

'''
          if ownership not in text:
              marker = '## Modularization timeline\n'
              if marker not in text:
                  raise RuntimeError('Missing ownership insertion marker')
              text = text.replace(marker, ownership + marker, 1)

          replace_or_verify(
              '| 17 | Not started | — | — | Candidate must be selected by a fresh read-only inspection | ⏭ Next |',
              '| 17 | #118 inventory and working PR | #118 | `tabs/dashboard.py` | Complete legacy Dashboard presentation/orchestration group: 5 functions, 462 lines | ✅ Passed and merged |',
              'Wave 17 timeline row',
          )

          new_process = '''Every new extraction must follow this sequence:

1. Start from the latest `main` commit.
2. Begin with a read-only inventory of exact source, signatures, dependencies, callers, risk areas, and occurrences.
3. A narrow helper wave may use separate inspection and extraction PRs; a cohesive feature-level wave may use one working PR whose first commit is inventory-only.
4. Select one cohesive group and capture original behavior before moving code.
5. Replace original definitions with same-name imports and preserve callers.
6. Keep protected database, calculation, authentication, and filesystem services in their existing owners unless focused tests justify moving them.
7. Compile the application and destination modules and compare preserved behavior.
8. Run Python, redundancy, feature regression, and SPINA quality audits.
9. Remove all temporary write-enabled workflows.
10. Add permanent read-only regression CI.
11. Perform a Windows desktop smoke test.
12. Merge only after the desktop test passes.
13. Update this map in the same wave.'''
          if new_process not in text:
              pattern = re.compile(
                  r'Every new extraction must follow this sequence:\n\n.*?\n\n## Protected and deferred areas',
                  re.S,
              )
              text, count = pattern.subn(new_process + '\n\n## Protected and deferred areas', text, count=1)
              if count != 1:
                  raise RuntimeError(f'Expected one safety-process block, found {count}')

          replace_or_verify(
              '| 17 | Pending | Pending | Pending | Pending | ⬜ | ⬜ | ⬜ | Start with current-main inspection |',
              '| 17 | #118 | #118 | `tabs/dashboard.py` | 5 Dashboard feature functions; 462 lines moved | ✅ | ✅ | ✅ | Passed Windows smoke test |',
              'Wave 17 tracker row',
          )

          required = [
              '**65**',
              '**Wave 17 / PR #118**',
              '**Wave 18 feature inventory**',
              'APP --> TABDASH[tabs/dashboard.py]',
              '`spina_app/tabs/dashboard.py`',
              '_spina_v17_refresh_dashboard` — PR #118',
              '| 17 | #118 inventory and working PR | #118 |',
              '| 17 | #118 | #118 | `tabs/dashboard.py` |',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise RuntimeError(f'Missing final map markers: {missing}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit map and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-wave-17-map.yml
          git add docs/modularization-map.md
          git commit -m "Document modularization Wave 17"
          git push origin HEAD:main
