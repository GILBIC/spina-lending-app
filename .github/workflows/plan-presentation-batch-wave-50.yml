name: Plan presentation batch Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/plan_presentation_batch_wave_50.py"
      - ".github/workflows/plan-presentation-batch-wave-50.yml"
permissions:
  contents: read
jobs:
  plan:
    if: github.head_ref == 'agent/presentation-batch-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile planner
        shell: cmd
        run: python -m py_compile tools/plan_presentation_batch_wave_50.py
      - name: Rank safe presentation batches
        shell: cmd
        run: python tools/plan_presentation_batch_wave_50.py
      - name: Upload Wave 50 plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-presentation-batch-plan
          path: artifacts/wave-50-presentation-batch-plan.json
