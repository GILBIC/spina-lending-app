name: Wave 64 Candidate Planner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_wave64_candidates.py"
      - ".github/workflows/wave64-candidate-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-64'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile and run candidate planner
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools\plan_wave64_candidates.py
          python tools\plan_wave64_candidates.py > artifacts\wave64-planner-output.txt 2>&1
          type artifacts\wave64-planner-output.txt

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave64-candidate-report
          path: |
            artifacts/wave64-candidates.json
            artifacts/wave64-planner-output.txt
          if-no-files-found: error
