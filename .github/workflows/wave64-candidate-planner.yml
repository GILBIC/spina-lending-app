name: Wave 64 Candidate Planner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_wave64_candidates.py"
      - ".github/workflows/wave64-candidate-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-64'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Compile and run candidate planner
        run: |
          python -m py_compile tools/plan_wave64_candidates.py
          python -m tools.plan_wave64_candidates

      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: wave64-candidate-report
          path: artifacts/wave64-candidates.json
          if-no-files-found: error
