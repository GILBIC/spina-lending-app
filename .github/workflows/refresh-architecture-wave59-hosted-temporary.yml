name: Hosted fallback Wave 59 architecture refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/refresh-architecture-wave59-hosted-temporary.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-architecture-wave59-hosted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-59'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Wave 59 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-59
          fetch-depth: 0
          show-progress: false
      - name: Regenerate and validate architecture maps
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh clean Wave 59 architecture maps"
          git push origin HEAD:agent/high-volume-wave-59
