name: Gilbic mobile validation

on:
  pull_request:
    paths:
      - "gilbic_mobile/**"
      - "docs/gilbic-mobile-foundation.md"
      - "docs/gilbic-mobile-auth-route.md"
      - ".github/workflows/gilbic-mobile-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flutter 3.44.7
        shell: cmd
        run: |
          set "FLUTTER_ROOT=%RUNNER_TEMP%\flutter-3.44.7"
          if exist "%FLUTTER_ROOT%" rmdir /s /q "%FLUTTER_ROOT%"
          git clone --depth 1 --branch 3.44.7 https://github.com/flutter/flutter.git "%FLUTTER_ROOT%" || exit /b 1
          echo %FLUTTER_ROOT%\bin>>"%GITHUB_PATH%"

      - name: Show Flutter version
        shell: cmd
        run: flutter --version

      - name: Resolve pinned packages
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter pub get || exit /b 1

      - name: Analyze authenticated mobile boundaries
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter analyze --fatal-infos || exit /b 1

      - name: Test authentication and collector route
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter test || exit /b 1

      - name: Require clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
