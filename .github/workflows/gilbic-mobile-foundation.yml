name: Gilbic mobile foundation

on:
  pull_request:
    paths:
      - "gilbic_mobile/**"
      - "docs/gilbic-mobile-foundation.md"
      - ".github/workflows/gilbic-mobile-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Flutter 3.44.7
        shell: powershell
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TEMP "flutter-3.44.7"
          if (Test-Path $flutterRoot) {
            Remove-Item -Recurse -Force $flutterRoot
          }
          git clone --depth 1 --branch 3.44.7 https://github.com/flutter/flutter.git $flutterRoot
          "$flutterRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show Flutter version
        shell: cmd
        run: flutter --version

      - name: Resolve packages
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter pub get

      - name: Analyze Gilbic
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter analyze --fatal-infos

      - name: Test Gilbic
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter test

      - name: Require clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
