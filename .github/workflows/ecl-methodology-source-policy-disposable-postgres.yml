name: ECL methodology source policy disposable PostgreSQL validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0069_add_ecl_methodology_source_policy.sql'
      - 'gilbic_backend/tests/test_ecl_methodology_source_policy_postgres.py'
      - 'tools/run_ecl_methodology_source_policy_disposable_postgres_validation.py'
      - '.github/workflows/ecl-methodology-source-policy-disposable-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0069_add_ecl_methodology_source_policy.sql'
      - 'gilbic_backend/tests/test_ecl_methodology_source_policy_postgres.py'
      - 'tools/run_ecl_methodology_source_policy_disposable_postgres_validation.py'
      - '.github/workflows/ecl-methodology-source-policy-disposable-postgres.yml'

permissions:
  contents: read

concurrency:
  group: ecl-methodology-source-policy-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-ecl-methodology-source-policy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      ECLPOL_PG_PORT: '55454'
      ECLPOL_PG_USER: eclpol

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Define isolated runner paths
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $clusterBase = [System.IO.Path]::GetFullPath(
            (Join-Path $env:RUNNER_TEMP '..\spina-ecl-methodology-clusters')
          ).TrimEnd('\')
          $runRoot = Join-Path $clusterBase (
            'run-{0}-attempt-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $dockerName = 'spina-eclpol-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          @(
            "ECLPOL_CLUSTER_BASE=$clusterBase",
            "ECLPOL_RUN_ROOT=$runRoot",
            "ECLPOL_PG_DATA=$(Join-Path $runRoot 'pgdata')",
            "ECLPOL_PG_LOG=$(Join-Path $runRoot 'postgres.log')",
            "ECLPOL_OWNERSHIP_MARKER=$(Join-Path $runRoot 'cluster-owned.marker')",
            "ECLPOL_READY_MARKER=$(Join-Path $runRoot 'cluster-ready.marker')",
            "ECLPOL_VENV=$(Join-Path $runRoot 'venv')",
            "ECLPOL_DOCKER_NAME=$dockerName"
          ) | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Select isolated PostgreSQL runtime
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgBin = $null
          $initdb = Get-Command initdb.exe -ErrorAction SilentlyContinue
          if ($initdb) { $pgBin = Split-Path -Parent $initdb.Source }
          if (-not $pgBin) {
            foreach ($root in @('C:\Program Files\PostgreSQL', 'C:\Program Files (x86)\PostgreSQL')) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem $root -Directory |
                ForEach-Object { Join-Path $_.FullName 'bin' } |
                Where-Object {
                  (Test-Path (Join-Path $_ 'initdb.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_isready.exe'))
                } | Select-Object -First 1
              if ($candidate) { $pgBin = $candidate; break }
            }
          }

          if ($pgBin) {
            "ECLPOL_MODE=local" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ECLPOL_PG_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ECLPOL_DATABASE_URL=postgresql://eclpol@127.0.0.1:$env:ECLPOL_PG_PORT/postgres?sslmode=disable" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Using local PostgreSQL binaries at $pgBin."
            exit 0
          }

          $docker = Get-Command docker.exe -ErrorAction SilentlyContinue
          if (-not $docker) { $docker = Get-Command docker -ErrorAction SilentlyContinue }
          if (-not $docker) {
            throw 'This self-hosted runner has neither local PostgreSQL binaries nor Docker. Refusing to use any remote database.'
          }
          & $docker.Source version --format '{{.Server.Version}}'
          if ($LASTEXITCODE -ne 0) {
            throw 'Docker CLI exists but the Docker engine is not available.'
          }
          "ECLPOL_MODE=docker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECLPOL_DOCKER_EXE=$($docker.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ECLPOL_DATABASE_URL=postgresql://eclpol:eclpol_test_only@127.0.0.1:$env:ECLPOL_PG_PORT/postgres?sslmode=disable" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Using a temporary PostgreSQL 18 Docker container on loopback only.'

      - name: Initialize isolated temporary PostgreSQL
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = New-Object System.Net.Sockets.TcpClient
          try {
            $probe.Connect('127.0.0.1', [int]$env:ECLPOL_PG_PORT)
            throw "Reserved test port $env:ECLPOL_PG_PORT is already in use."
          }
          catch [System.Net.Sockets.SocketException] { }
          finally { $probe.Dispose() }

          if ($env:ECLPOL_MODE -eq 'local') {
            $pgCtl = Join-Path $env:ECLPOL_PG_BIN 'pg_ctl.exe'
            New-Item -ItemType Directory -Force -Path $env:ECLPOL_CLUSTER_BASE | Out-Null
            Get-ChildItem $env:ECLPOL_CLUSTER_BASE -Directory -Filter 'run-*-attempt-*' -ErrorAction SilentlyContinue |
              ForEach-Object {
                if ($_.FullName -eq $env:ECLPOL_RUN_ROOT) { return }
                $marker = Join-Path $_.FullName 'cluster-owned.marker'
                $pgData = Join-Path $_.FullName 'pgdata'
                if (-not (Test-Path $marker) -or -not (Test-Path $pgData)) { return }
                & $pgCtl -D $pgData status 2>$null
                if ($LASTEXITCODE -eq 0) {
                  & $pgCtl -D $pgData -m immediate -w stop
                  if ($LASTEXITCODE -ne 0) { throw "Failed to stop owned orphan $($_.FullName)." }
                }
                elseif ($LASTEXITCODE -ne 3) { throw "Could not verify owned orphan state at $($_.FullName)." }
                Remove-Item -Recurse -Force $_.FullName
              }
            if (Test-Path $env:ECLPOL_RUN_ROOT) { Remove-Item -Recurse -Force $env:ECLPOL_RUN_ROOT }
            New-Item -ItemType Directory -Force -Path $env:ECLPOL_RUN_ROOT | Out-Null
            $initdb = Join-Path $env:ECLPOL_PG_BIN 'initdb.exe'
            $pgReady = Join-Path $env:ECLPOL_PG_BIN 'pg_isready.exe'
            & $initdb -D $env:ECLPOL_PG_DATA -U $env:ECLPOL_PG_USER --auth=trust --encoding=UTF8 --no-locale
            if ($LASTEXITCODE -ne 0) { throw 'initdb failed.' }
            "run_id=$env:GITHUB_RUN_ID`npgdata=$env:ECLPOL_PG_DATA" |
              Set-Content -Path $env:ECLPOL_OWNERSHIP_MARKER -Encoding ascii
            & $pgCtl -D $env:ECLPOL_PG_DATA -l $env:ECLPOL_PG_LOG -o "-p $env:ECLPOL_PG_PORT -h 127.0.0.1" -w start
            if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster failed to start.' }
            & $pgReady -h 127.0.0.1 -p $env:ECLPOL_PG_PORT -U $env:ECLPOL_PG_USER -d postgres
            if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster is not ready.' }
          }
          elseif ($env:ECLPOL_MODE -eq 'docker') {
            & $env:ECLPOL_DOCKER_EXE rm -f $env:ECLPOL_DOCKER_NAME 2>$null | Out-Null
            & $env:ECLPOL_DOCKER_EXE run --detach --name $env:ECLPOL_DOCKER_NAME `
              -e POSTGRES_USER=eclpol `
              -e POSTGRES_PASSWORD=eclpol_test_only `
              -e POSTGRES_DB=postgres `
              -p "127.0.0.1:$env:ECLPOL_PG_PORT`:5432" postgres:18 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL Docker container failed to start.' }
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              & $env:ECLPOL_DOCKER_EXE exec $env:ECLPOL_DOCKER_NAME pg_isready -U eclpol -d postgres *> $null
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Temporary PostgreSQL Docker container did not become ready.' }
          }
          else {
            throw 'No isolated PostgreSQL runtime mode was selected.'
          }
          'ready=true' | Set-Content -Path $env:ECLPOL_READY_MARKER -Encoding ascii

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          if not exist "%ECLPOL_READY_MARKER%" exit /b 1
          python -m venv "%ECLPOL_VENV%" || exit /b 1
          "%ECLPOL_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%ECLPOL_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9" || exit /b 1

      - name: Compile ECL methodology verifier
        shell: cmd
        run: |
          "%ECLPOL_VENV%\Scripts\python.exe" -m py_compile tools\run_ecl_methodology_source_policy_disposable_postgres_validation.py || exit /b 1
          "%ECLPOL_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_ecl_methodology_source_policy_postgres.py || exit /b 1

      - name: Execute ECL methodology source policy proof
        shell: cmd
        run: |
          "%ECLPOL_VENV%\Scripts\python.exe" tools\run_ecl_methodology_source_policy_disposable_postgres_validation.py --database-url-env ECLPOL_DATABASE_URL || exit /b 1

      - name: Stop and delete temporary PostgreSQL
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:ECLPOL_MODE -eq 'local' -and $env:ECLPOL_PG_BIN -and (Test-Path $env:ECLPOL_PG_DATA)) {
            $pgCtl = Join-Path $env:ECLPOL_PG_BIN 'pg_ctl.exe'
            & $pgCtl -D $env:ECLPOL_PG_DATA status 2>$null
            if ($LASTEXITCODE -eq 0) {
              & $pgCtl -D $env:ECLPOL_PG_DATA -m fast -w stop
              if ($LASTEXITCODE -ne 0) { & $pgCtl -D $env:ECLPOL_PG_DATA -m immediate -w stop }
            }
            if (Test-Path $env:ECLPOL_RUN_ROOT) { Remove-Item -Recurse -Force $env:ECLPOL_RUN_ROOT }
          }
          elseif ($env:ECLPOL_MODE -eq 'docker' -and $env:ECLPOL_DOCKER_EXE) {
            & $env:ECLPOL_DOCKER_EXE rm -f $env:ECLPOL_DOCKER_NAME 2>$null | Out-Null
          }

      - name: Require a clean committed tree when Git metadata is available
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git -and (Test-Path '.git')) {
            & $git.Source diff --check
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
            & $git.Source diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Working tree changed during verification.' }
            & $git.Source diff --cached --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Index changed during verification.' }
          }
          else {
            Write-Host 'Git metadata is unavailable on this secondary self-hosted runner; actions/checkout exact-revision archive was used.'
          }
