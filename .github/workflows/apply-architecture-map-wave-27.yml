name: Apply Architecture Map Wave 27

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/architecture-map-wave-27'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out architecture branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-map-wave-27
          fetch-depth: 0

      - name: Verify Python and compile mapper
        shell: cmd
        run: |
          python --version > architecture-map-compile.log 2>&1
          python -m py_compile tools\generate_architecture_map.py >> architecture-map-compile.log 2>&1
          python -m py_compile tools\test_architecture_map.py >> architecture-map-compile.log 2>&1
          type architecture-map-compile.log

      - name: Generate complete SPINA architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map > architecture-map-generation.log 2>&1
          type architecture-map-generation.log

      - name: Validate generated map and documents
        shell: cmd
        run: |
          python -m tools.test_architecture_map > architecture-map-validation.log 2>&1
          type architecture-map-validation.log

      - name: Show architecture summary
        shell: cmd
        run: |
          python -c "import json; d=json.load(open('architecture-map.json', encoding='utf-8')); print(json.dumps(d['summary'], indent=2)); print('Suggested batches:', len(d['indexes']['modularization_suggestions']))" > architecture-map-summary.log 2>&1
          type architecture-map-summary.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-map-wave-27-diagnostics
          path: |
            architecture-map-compile.log
            architecture-map-generation.log
            architecture-map-validation.log
            architecture-map-summary.log
            architecture-map.json
            docs/architecture
          if-no-files-found: ignore

      - name: Commit permanent maps and remove temporary workflow
        shell: cmd
        run: |
          del .github\workflows\apply-architecture-map-wave-27.yml
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add architecture-map.json docs\architecture .github\workflows\apply-architecture-map-wave-27.yml
          git diff --cached --quiet && exit /b 0
          git commit -m "Generate complete SPINA architecture maps Wave 27"
          git push origin HEAD:agent/architecture-map-wave-27
