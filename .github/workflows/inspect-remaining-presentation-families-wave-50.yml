name: Inspect remaining presentation families Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_remaining_presentation_families_wave_50.py"
      - ".github/workflows/inspect-remaining-presentation-families-wave-50.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/high-volume-presentation-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_remaining_presentation_families_wave_50.py
      - name: Inspect remaining presentation families
        shell: cmd
        run: python tools/inspect_remaining_presentation_families_wave_50.py
      - name: Upload Wave 50 family inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-remaining-presentation-families
          path: artifacts/wave-50-remaining-presentation-families.json
