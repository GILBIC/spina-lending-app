name: Spina Delivery

on:
  workflow_dispatch:
    inputs:
      portal_url:
        description: HTTPS portal address for this exact candidate
        required: true
        type: string
      api_url:
        description: HTTPS API address for this exact candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spina-artifact-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  SPINA_PORTAL_URL: ${{ inputs.portal_url }}
  SPINA_API_URL: ${{ inputs.api_url }}
  FLUTTER_VERSION: 3.44.7

jobs:
  web-package:
    name: Web package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build Web
        run: |
          python -c "import os; from tools.prepare_android_host import validate_api_url; validate_api_url(os.environ['SPINA_PORTAL_URL']); validate_api_url(os.environ['SPINA_API_URL'])"
          npm run build
      - name: Record Web address
        run: printf '%s\n' "$SPINA_PORTAL_URL" > dist/SPINA-WEB-ADDRESS.txt
      - name: Upload Web package
        uses: actions/upload-artifact@v4
        with:
          name: Spina-Web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create Windows installer package
        shell: pwsh
        run: |
          python -c "import os; from tools.prepare_android_host import validate_api_url; validate_api_url(os.environ['SPINA_PORTAL_URL'])"
          if ($LASTEXITCODE -ne 0) { throw "Invalid candidate portal URL" }
          $Output = Join-Path $PWD "delivery/Spina-Windows"
          New-Item -ItemType Directory -Path $Output -Force | Out-Null
          Copy-Item "spina_pc/install_spina_pc.ps1" $Output
          Copy-Item "spina_pc/uninstall_spina_pc.ps1" $Output
          Copy-Item "spina_pc/README.md" $Output
          @"
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0install_spina_pc.ps1" -PortalUrl "$env:SPINA_PORTAL_URL" -StartAfterInstall
          "@ | Set-Content -LiteralPath (Join-Path $Output "Install Spina.cmd") -Encoding ascii
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $Output "install_spina_pc.ps1")).Hash.ToLowerInvariant()
          "install_spina_pc.ps1  $Hash" | Set-Content -LiteralPath (Join-Path $Output "SHA256.txt") -Encoding ascii
          Compress-Archive -Path "$Output/*" -DestinationPath "delivery/Spina-Windows.zip" -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Spina-Windows-${{ github.sha }}
          path: delivery/Spina-Windows.zip
          if-no-files-found: error
          retention-days: 14

  android-package:
    name: Android signed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    env:
      SPINA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPINA_ANDROID_KEYSTORE_BASE64 }}
      SPINA_ANDROID_KEY_ALIAS: ${{ secrets.SPINA_ANDROID_KEY_ALIAS }}
      SPINA_ANDROID_STORE_PASSWORD: ${{ secrets.SPINA_ANDROID_STORE_PASSWORD }}
      SPINA_ANDROID_KEY_PASSWORD: ${{ secrets.SPINA_ANDROID_KEY_PASSWORD }}
      SPINA_ANDROID_CERT_SHA256: ${{ vars.SPINA_ANDROID_CERT_SHA256 }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require and privately stage owner signing inputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/prepare_android_host.py stage-signing \
            --directory "$RUNNER_TEMP/spina-android-signing"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Verify Flutter
        run: flutter --version
      - name: Validate Spina Flutter source
        working-directory: gilbic_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test
      - name: Generate isolated Android host
        shell: bash
        run: |
          set -euo pipefail
          HOST="$RUNNER_TEMP/spina-android-host"
          flutter create --platforms=android --org com.spinalending --project-name gilbic_mobile --no-pub "$HOST"
          python tools/prepare_android_host.py prepare --host "$HOST" \
            --source-sha "$GITHUB_SHA" --mode release --api-url "$SPINA_API_URL"
      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spina-android-host"
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64,android-x64 --no-pub \
            --dart-define=GILBIC_API_URL="$SPINA_API_URL"
      - name: Prepare and verify Android delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/Spina-Android
          cp "$RUNNER_TEMP/spina-android-host/build/app/outputs/flutter-apk/app-release.apk" delivery/Spina-Android/Spina.apk
          python tools/verify_android_artifact.py \
            --apk delivery/Spina-Android/Spina.apk --source-sha "$GITHUB_SHA" \
            --mode release --api-url "$SPINA_API_URL" \
            --output delivery/Spina-Android/android-verification.json
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/spina-android-signing"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Spina-Android-signed-${{ github.sha }}
          path: delivery/Spina-Android/
          if-no-files-found: error
          retention-days: 14
