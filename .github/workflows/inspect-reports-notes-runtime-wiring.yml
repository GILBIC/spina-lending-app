name: Inspect Reports notes runtime wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reports-notes-panel-visible
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect existing note dialog
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          app = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = app.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)

          definitions = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == '_open_note_dialog':
                  definitions.append({
                      'line': node.lineno,
                      'end_line': node.end_lineno,
                      'args': ast.unparse(node.args),
                      'source': '\n'.join(lines[node.lineno - 1:node.end_lineno]),
                  })

          references = []
          for lineno, line in enumerate(lines, 1):
              if '_open_note_dialog' in line:
                  references.append({'line': lineno, 'text': line})

          report = {
              'definition_count': len(definitions),
              'definitions': definitions,
              'references': references,
          }
          out = Path('tools/fixtures/report_note_dialog_inspection.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/report_note_dialog_inspection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect report note dialog implementation"
          git push origin HEAD:agent/fix-reports-notes-panel-visible
