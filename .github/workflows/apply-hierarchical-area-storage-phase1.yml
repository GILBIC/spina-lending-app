name: Apply hierarchical Area storage Phase 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-storage-phase-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and storage module
        run: |
          python -m py_compile \
            spina_app/area_hierarchy.py \
            tools/test_hierarchical_area_storage_phase1.py \
            tools/apply_hierarchical_area_storage_phase1.py
          python tools/apply_hierarchical_area_storage_phase1.py
          python tools/test_hierarchical_area_storage_phase1.py
      - name: Apply guarded app wiring
        run: python tools/apply_hierarchical_area_storage_phase1.py --apply
      - name: Compile and retest
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/area_hierarchy.py \
            tools/test_hierarchical_area_storage_phase1.py \
            tools/apply_hierarchical_area_storage_phase1.py
          python tools/apply_hierarchical_area_storage_phase1.py
          python tools/test_hierarchical_area_storage_phase1.py
      - name: Commit Phase 1 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire hierarchical Area storage migration"
          git push origin HEAD:agent/hierarchical-area-storage-phase-1
