name: Stage 5D.21 live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0047_add_protected_new_loan_disbursement_journal_drafts.sql'
      - 'tools/apply_accounting_new_loan_disbursement_journal_draft_migration.py'
      - 'tools/accounting-new-loan-disbursement-draft-live-migration.once'
      - '.github/workflows/stage5d21-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0047_add_protected_new_loan_disbursement_journal_drafts.sql'
      - 'tools/apply_accounting_new_loan_disbursement_journal_draft_migration.py'
      - 'tools/accounting-new-loan-disbursement-draft-live-migration.once'
      - '.github/workflows/stage5d21-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5d21-live-migration
  cancel-in-progress: true

jobs:
  verify-stage5d21-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d21-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d21-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_accounting_new_loan_disbursement_journal_draft_migration.py || exit /b 1

      - name: Verify PR installs capability only
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0047_add_protected_new_loan_disbursement_journal_drafts.sql').read_text(encoding='utf-8'); lo=s.lower(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert lo.count('create_new_loan_disbursement_journal_draft(') == 1; assert 'false as posting_enabled' in lo; assert 'false as automatic_source_posting' in lo; assert 'do $$' not in lo" || exit /b 1

      - name: Install and verify protected draft controls on live database
        if: github.event_name == 'push' && hashFiles('tools/accounting-new-loan-disbursement-draft-live-migration.once') != ''
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-stage5d21-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_accounting_new_loan_disbursement_journal_draft_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
