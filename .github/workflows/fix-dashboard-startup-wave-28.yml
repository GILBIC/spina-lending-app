name: Fix Dashboard startup Wave 28

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/dashboard-presentation-wave-28'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40

    steps:
      - name: Check out Wave 28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-presentation-wave-28
          fetch-depth: 0

      - name: Verify Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Apply guarded Dashboard startup repair
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools/fix_dashboard_startup_wave_28.py > artifacts\dashboard-startup-repair.log 2>&1
          if errorlevel 1 type artifacts\dashboard-startup-repair.log & exit /b 1
          python -m tools.fix_dashboard_startup_wave_28 >> artifacts\dashboard-startup-repair.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\dashboard-startup-repair.log
          exit /b %CODE%

      - name: Upload Dashboard repair diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-startup-wave-28-diagnostic
          path: artifacts/dashboard-startup-repair.log
          if-no-files-found: warn

      - name: Compile repaired application and focused test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/tabs/dashboard.py
          python -m py_compile tools/test_dashboard_presentation_wave_28.py
          python -m compileall -q spina_app

      - name: Run Dashboard startup regression
        shell: cmd
        run: python -m tools.test_dashboard_presentation_wave_28

      - name: Run redundancy audit
        shell: cmd
        run: python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json redundancy-report.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json quality-report.json

      - name: Remove temporary repair files
        shell: cmd
        run: |
          del tools\fix_dashboard_startup_wave_28.py
          del .github\workflows\fix-dashboard-startup-wave-28.yml

      - name: Commit Dashboard startup repair locally
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add tools/test_dashboard_presentation_wave_28.py
          git add -u tools .github/workflows
          git diff --cached --check
          git commit -m "Fix Dashboard startup wiring in Wave 28"

      - name: Refresh permanent architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs/architecture
          git diff --cached --check
          git commit -m "Refresh architecture map after Dashboard startup repair"

      - name: Push repaired Wave 28 branch
        shell: cmd
        run: git push origin HEAD:agent/dashboard-presentation-wave-28
