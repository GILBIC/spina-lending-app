name: Finalize long task presentation Wave 42
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'agent/presentation-wave-42'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate extraction and refresh architecture
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/long_task_presentation.py
          python -m py_compile tools/test_long_task_presentation_wave_42.py
          python tools/test_long_task_presentation_wave_42.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        shell: cmd
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh architecture after Wave 42 cleanup"
      - name: Configure runner GitHub authentication
        shell: cmd
        run: gh auth setup-git
      - name: Push refreshed architecture maps
        shell: cmd
        run: git push origin HEAD:refs/heads/${{ github.head_ref }}
