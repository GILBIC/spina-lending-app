name: Legacy Area Manager Cleanup Wave 71

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/legacy-area-manager-cleanup-wave-71.yml"
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/area_hierarchy_ui.py"
      - "spina_app/area_picker_presentation.py"
      - "tools/test_legacy_area_manager_cleanup_wave_71.py"
      - "tools/test_area_picker_presentation_wave_37.py"
      - "architecture-map.json"
      - "docs/architecture/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-area-manager-cleanup-wave-71-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-71'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, area modules, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\area_hierarchy_ui.py
          python -m py_compile spina_app\area_picker_presentation.py
          python -m py_compile tools\test_legacy_area_manager_cleanup_wave_71.py
          python -m py_compile tools\test_area_picker_presentation_wave_37.py
          python -m compileall -q spina_app

      - name: Run Wave 71 exact cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_area_manager_cleanup_wave_71

      - name: Run protected area picker regression
        shell: cmd
        run: python -m tools.test_area_picker_presentation_wave_37

      - name: Validate permanent architecture map
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git diff --exit-code -- architecture-map.json docs\architecture

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-71-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-71-quality.json

      - name: Upload Wave 71 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave71-legacy-area-manager-reports
          path: artifacts/wave-71-*.json
          if-no-files-found: warn
