name: Cash Control inventory Wave 21

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/cash-control-feature-wave-21'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out Wave 21 branch
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile inventory tool
        shell: cmd
        run: python -m py_compile tools\inventory_cash_control_feature_wave_21.py

      - name: Generate exact inventory
        shell: cmd
        run: python tools\inventory_cash_control_feature_wave_21.py

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cash-control-feature-wave-21
          path: artifacts/cash-control-feature-wave-21.json
