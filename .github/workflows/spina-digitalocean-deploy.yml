name: Spina DigitalOcean Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spina-digitalocean-production-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Deploy exact revision
        shell: bash
        env:
          SPINA_DEPLOY_TARGET_JSON: ${{ vars.SPINA_DEPLOY_TARGET_JSON }}
          SPINA_RUNTIME_SECRETS_JSON: ${{ secrets.SPINA_RUNTIME_SECRETS_JSON }}
          SPINA_DEPLOY_SSH_KEY: ${{ secrets.SPINA_DEPLOY_SSH_KEY }}
          SPINA_DEPLOY_KNOWN_HOSTS: ${{ secrets.SPINA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          trap 'rm -f /tmp/spina-do-key /tmp/spina-target.json /tmp/spina-secrets.json /tmp/spina.env /tmp/spina-release.tar.gz /tmp/spina-git-sha /tmp/spina-public-checks.json /tmp/spina-known-hosts' EXIT
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_RUN_DIR="/var/lib/spina-deploy/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly REMOTE_RUN_DIR GITHUB_SHA

          python ops/digitalocean/workflow_helper.py prepare-inputs --directory /tmp
          [[ -n "$SPINA_DEPLOY_SSH_KEY" && -n "$SPINA_DEPLOY_KNOWN_HOSTS" ]] || { echo "Protected SSH credentials and host pin are required." >&2; exit 1; }
          printf '%s\n' "$SPINA_DEPLOY_SSH_KEY" > /tmp/spina-do-key
          printf '%s\n' "$SPINA_DEPLOY_KNOWN_HOSTS" > /tmp/spina-known-hosts
          chmod 600 /tmp/spina-do-key
          HOST="$(jq -er '.host' /tmp/spina-target.json)"
          HOSTNAME="$(jq -er '.hostname' /tmp/spina-target.json)"
          ssh-keygen -F "$HOST" -f /tmp/spina-known-hosts >/dev/null || { echo "Independent host pin does not cover the deployment target." >&2; exit 1; }

          python tools/test_digitalocean_deployment_contract.py
          bash -n ops/digitalocean/bootstrap.sh
          npm run build

          printf '%s\n' "$GITHUB_SHA" > /tmp/spina-git-sha
          tar -czf /tmp/spina-release.tar.gz \
            dist \
            gilbic_backend \
            spina_backend_mobile \
            requirements.txt \
            requirements-runtime.lock \
            ops/digitalocean/bootstrap.sh \
            ops/digitalocean/workflow_helper.py \
            -C /tmp spina-git-sha spina-target.json
          ARCHIVE_SHA256="$(sha256sum /tmp/spina-release.tar.gz | cut -d ' ' -f 1)"
          readonly ARCHIVE_SHA256

          SSH_OPTIONS=(
            -i /tmp/spina-do-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/tmp/spina-known-hosts
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          ssh_with_retry() {
            local attempt
            for attempt in $(seq 1 8); do
              if ssh "${SSH_OPTIONS[@]}" root@"$HOST" "$@"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          scp_with_retry() {
            local source="$1"
            local destination="$2"
            local attempt
            for attempt in $(seq 1 8); do
              if scp "${SSH_OPTIONS[@]}" "$source" root@"$HOST":"$destination"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          start_remote_bootstrap() {
            ssh_with_retry "set -Eeuo pipefail; if mkdir '$REMOTE_RUN_DIR/launched' 2>/dev/null; then nohup bash '$REMOTE_RUN_DIR/bootstrap.sh' '$GITHUB_SHA' '$HOSTNAME' '$REMOTE_RUN_DIR' '$ARCHIVE_SHA256' > '$REMOTE_RUN_DIR/bootstrap.log' 2>&1 < /dev/null & elif [[ ! -d '$REMOTE_RUN_DIR/launched' ]]; then exit 1; fi"
          }

          poll_remote_bootstrap() {
            local status
            local attempt
            for attempt in $(seq 1 180); do
              status="$(ssh "${SSH_OPTIONS[@]}" root@"$HOST" "cat '$REMOTE_RUN_DIR/exit-code' 2>/dev/null || true" 2>/dev/null | tr -d '\r\n' || true)"
              if [[ "$status" == "0" ]]; then
                return 0
              fi
              if [[ "$status" =~ ^[1-9][0-9]*$ ]]; then
                ssh_with_retry "tail -n 200 '$REMOTE_RUN_DIR/bootstrap.log' >&2 || true" || true
                return 1
              fi
              sleep 10
            done
            ssh_with_retry "tail -n 200 '$REMOTE_RUN_DIR/bootstrap.log' >&2 || true" || true
            return 1
          }

          ssh_with_retry "set -Eeuo pipefail; test ! -e '$REMOTE_RUN_DIR/launched'; install -d -m 0700 /var/lib/spina-deploy '$REMOTE_RUN_DIR'"
          scp_with_retry /tmp/spina-release.tar.gz "$REMOTE_RUN_DIR/release.tar.gz"
          scp_with_retry /tmp/spina.env "$REMOTE_RUN_DIR/runtime.env"
          scp_with_retry ops/digitalocean/bootstrap.sh "$REMOTE_RUN_DIR/bootstrap.sh"
          start_remote_bootstrap
          poll_remote_bootstrap

          public_ready=false
          public_deadline=$((SECONDS + 600))
          while (( SECONDS < public_deadline )); do
            if timeout 90s python ops/digitalocean/workflow_helper.py verify-public \
              --target /tmp/spina-target.json --output /tmp/spina-public-checks.json; then
              public_ready=true
              break
            fi
            sleep 5
          done
          [[ "$public_ready" == true ]] || { echo "Public HTTPS verification failed." >&2; exit 1; }

          ACTIVE_SHA="$(ssh_with_retry "bash '$REMOTE_RUN_DIR/bootstrap.sh' --verify-active '$GITHUB_SHA'")"
          [[ "$ACTIVE_SHA" == "$GITHUB_SHA" ]] || { echo "Active revision verification failed." >&2; exit 1; }

          python ops/digitalocean/workflow_helper.py write-evidence \
            --target /tmp/spina-target.json \
            --output /tmp/spina-deployment-evidence.json \
            --git-sha "$GITHUB_SHA" \
            --verified-active-sha "$ACTIVE_SHA" \
            --public-checks /tmp/spina-public-checks.json

      - name: Upload non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: spina-digitalocean-deployment-${{ github.sha }}
          path: /tmp/spina-deployment-evidence.json
          if-no-files-found: ignore
          retention-days: 30
