name: TEMP local 7x7 host probe

on:
  push:
    branches:
      - ops/local-7x7-test-gate-20260817

permissions:
  contents: read

jobs:
  probe:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 5
    steps:
      - name: Show runner and backend listener
        shell: powershell
        run: |
          Write-Host "Runner machine: $env:COMPUTERNAME"
          $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($listener) {
            Write-Host "Port 8000 listener PID: $($listener.OwningProcess)"
          } else {
            Write-Host 'No port 8000 listener on this runner.'
          }
