name: TEMP enable local 7x7 test gate

on:
  push:
    branches:
      - ops/local-7x7-test-gate-20260817

permissions:
  contents: read

jobs:
  enable:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 10
    steps:
      - name: Check out temporary ops branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enable guarded local 7x7 test gate
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\zz_tmp_enable_local_7x7_test_gate.ps1
