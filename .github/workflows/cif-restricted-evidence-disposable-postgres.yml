name: SPINA CIF Restricted Evidence Database

on:
  pull_request:
    paths:
      - '.github/workflows/cif-restricted-evidence-disposable-postgres.yml'
      - 'gilbic_backend/sql/0110_add_client_information_forms_and_restricted_evidence.sql'
      - 'gilbic_backend/src/gilbic_backend/cif_*.py'
      - 'gilbic_backend/src/gilbic_backend/restricted_identity_*.py'
      - 'gilbic_backend/tests/test_cif_*.py'
      - 'gilbic_backend/tests/test_restricted_identity_*.py'
      - 'tools/prepare_cif_restricted_evidence_test_database.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cif-restricted-evidence-disposable-postgres.yml'
      - 'gilbic_backend/sql/0110_add_client_information_forms_and_restricted_evidence.sql'
      - 'gilbic_backend/src/gilbic_backend/cif_*.py'
      - 'gilbic_backend/src/gilbic_backend/restricted_identity_*.py'
      - 'gilbic_backend/tests/test_cif_*.py'
      - 'gilbic_backend/tests/test_restricted_identity_*.py'
      - 'tools/prepare_cif_restricted_evidence_test_database.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spina-cif-restricted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cif-restricted-database:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create isolated Python environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-cif-restricted-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          echo CIF_VENV=%VENV%>>"%GITHUB_ENV%"
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\gilbic_backend[test]" || exit /b 1

      - name: Run CIF migration and constraints on disposable PostgreSQL
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:CIF_VENV 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
            throw "CIF verifier Python was not found at $python"
          }

          $pgBin = $null
          $initdbCommand = Get-Command initdb.exe -ErrorAction SilentlyContinue
          if ($initdbCommand) {
            $pgBin = Split-Path -Parent $initdbCommand.Source
          }
          if (-not $pgBin) {
            foreach ($root in @('C:\Program Files\PostgreSQL', 'C:\Program Files (x86)\PostgreSQL')) {
              if (-not (Test-Path -LiteralPath $root)) { continue }
              $candidate = Get-ChildItem $root -Directory |
                ForEach-Object { Join-Path $_.FullName 'bin' } |
                Where-Object {
                  (Test-Path (Join-Path $_ 'initdb.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_isready.exe'))
                } | Select-Object -First 1
              if ($candidate) { $pgBin = $candidate; break }
            }
          }
          if (-not $pgBin) {
            throw 'No local PostgreSQL binaries were found. Refusing to use any remote database.'
          }

          $initdb = Join-Path $pgBin 'initdb.exe'
          $pgCtl = Join-Path $pgBin 'pg_ctl.exe'
          $pgReady = Join-Path $pgBin 'pg_isready.exe'
          $port = 55510
          $runRoot = Join-Path $env:RUNNER_TEMP ("spina-cif-restricted-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $pgData = Join-Path $runRoot 'pgdata'
          $pgLog = Join-Path $runRoot 'postgres.log'
          $started = $false

          try {
            if (Test-Path -LiteralPath $runRoot) {
              Remove-Item -LiteralPath $runRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $runRoot | Out-Null

            $probe = New-Object System.Net.Sockets.TcpClient
            try {
              $probe.Connect('127.0.0.1', $port)
              throw "Reserved disposable test port $port is already in use."
            }
            catch [System.Net.Sockets.SocketException] { }
            finally { $probe.Dispose() }

            & $initdb -D $pgData -U cifrestricted --auth=trust --encoding=UTF8 --no-locale
            if ($LASTEXITCODE -ne 0) { throw 'initdb failed for CIF validation.' }

            & $pgCtl -D $pgData -l $pgLog -o "-p $port -h 127.0.0.1" -w start
            if ($LASTEXITCODE -ne 0) { throw 'Disposable PostgreSQL failed to start.' }
            $started = $true

            & $pgReady -h 127.0.0.1 -p $port -U cifrestricted -d postgres
            if ($LASTEXITCODE -ne 0) { throw 'Disposable PostgreSQL is not ready.' }

            $env:GILBIC_TEST_DATABASE_URL = "postgresql://cifrestricted@127.0.0.1:$port/postgres?sslmode=disable"
            & $python tools\prepare_cif_restricted_evidence_test_database.py
            if ($LASTEXITCODE -ne 0) {
              throw "CIF prerequisite replay failed with exit code $LASTEXITCODE."
            }
            & $python -m pytest -q `
              gilbic_backend\tests\test_cif_domain.py `
              gilbic_backend\tests\test_cif_restricted_evidence_migration.py `
              gilbic_backend\tests\test_cif_restricted_evidence_postgres.py
            if ($LASTEXITCODE -ne 0) {
              throw "CIF disposable PostgreSQL validation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item Env:GILBIC_TEST_DATABASE_URL -ErrorAction SilentlyContinue
            if ($started -and (Test-Path -LiteralPath $pgData)) {
              & $pgCtl -D $pgData -m immediate -w stop
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Disposable PostgreSQL cleanup returned exit code $LASTEXITCODE."
              }
            }
            if (Test-Path -LiteralPath $runRoot) {
              Remove-Item -LiteralPath $runRoot -Recurse -Force -ErrorAction Continue
            }
          }

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
