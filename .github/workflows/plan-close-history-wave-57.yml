name: Plan Close History presentation Wave 57

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_close_history_wave57_tmp.py"
      - ".github/workflows/plan-close-history-wave-57.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-close-history-wave-57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-57'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Compile boundary analyzer
        shell: cmd
        run: python -m py_compile tools\plan_close_history_wave57_tmp.py
      - name: Analyze active Close History boundary
        shell: cmd
        run: python tools\plan_close_history_wave57_tmp.py
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: close-history-wave-57-candidate
          path: |
            artifacts/wave-57-close-history-candidate.json
            artifacts/wave-57-close-history-source.py
          if-no-files-found: error
