name: Python audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            tools/redundancy_audit.py \
            tools/quality_audit.py \
            tools/test_quality_fixes.py

      - name: Run redundancy audit
        run: |
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json redundancy-report.json

      - name: Run quality audit
        run: |
          python tools/quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json quality-report.json \
            --fail-critical

      - name: Run quality fix regression checks
        run: |
          python tools/test_quality_fixes.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: spina-audit-reports
          path: |
            redundancy-report.json
            quality-report.json
