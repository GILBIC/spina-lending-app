name: Apply client Area UID sync Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and sync behavior
        run: |
          python -m py_compile \
            spina_app/area_hierarchy_ops.py \
            tools/apply_client_area_uid_sync_phase2.py \
            tools/test_client_area_uid_sync_phase2.py
          python tools/apply_client_area_uid_sync_phase2.py
      - name: Apply guarded synchronization patch
        run: python tools/apply_client_area_uid_sync_phase2.py --apply
      - name: Compile and test patched state
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/area_hierarchy_ops.py \
            tools/apply_client_area_uid_sync_phase2.py \
            tools/test_client_area_uid_sync_phase2.py
          python tools/apply_client_area_uid_sync_phase2.py
          PYTHONPATH=. python tools/test_client_area_uid_sync_phase2.py
          PYTHONPATH=. python tools/test_hierarchical_area_ui_phase2.py
          PYTHONPATH=tools:. python tools/test_hierarchical_area_ui_phase2_source.py
      - name: Commit synchronized app and module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/area_hierarchy_ops.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize client Area IDs immediately"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
