name: Temporary No Collection mobile integration

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - 'tools/tmp_patch_no_collection_mobile_integration.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch and run Management No Collection integration helper
        shell: cmd
        run: |
          curl.exe -L -H "Authorization: Bearer %GH_TOKEN%" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/GILBIC/spina-lending-app/contents/tools/tmp_patch_no_collection_mobile_integration.py?ref=mobile%2Fca4-collector-ui" -o "%RUNNER_TEMP%\spina_no_collection_patch.py"
          python "%RUNNER_TEMP%\spina_no_collection_patch.py"
