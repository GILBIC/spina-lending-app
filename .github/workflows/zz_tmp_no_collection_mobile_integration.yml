name: Temporary No Collection mobile integration

on:
  push:
    branches:
      - mobile/ca4-collector-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Integrate Management No Collection UI
        shell: cmd
        run: python tools\tmp_patch_no_collection_mobile_integration.py
