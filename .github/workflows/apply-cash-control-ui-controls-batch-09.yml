name: Apply Cash Control UI controls batch 09

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/cash-control-ui-controls-batch-09'
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guarded extraction inputs
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_controls.py \
            tools/extract_pure_helper_batch.py \
            tools/test_cash_control_ui_controls_batch_09.py

      - name: Verify exact original source state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cash_control_ui_controls_batch_09_manifest.json \
            --json cash-control-ui-controls-before.json
          python - <<'PY'
          import json
          report = json.load(open('cash-control-ui-controls-before.json', encoding='utf-8'))
          if report.get('state') != 'source':
              raise SystemExit(f"Expected source state, got {report.get('state')!r}")
          print('Verified original source state for', report.get('helper_count'), 'helpers')
          PY

      - name: Capture original behavior
        run: |
          PYTHONPATH=. python tools/test_cash_control_ui_controls_batch_09.py \
            --manifest tools/fixtures/cash_control_ui_controls_batch_09_manifest.json \
            --fixture tools/fixtures/cash_control_ui_controls_batch_09_behavior.json \
            --write-fixture

      - name: Apply guarded extraction
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cash_control_ui_controls_batch_09_manifest.json \
            --apply \
            --json cash-control-ui-controls-after.json

      - name: Verify extracted behavior and compilation
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_controls.py \
            tools/test_cash_control_ui_controls_batch_09.py
          PYTHONPATH=. python tools/test_cash_control_ui_controls_batch_09.py \
            --manifest tools/fixtures/cash_control_ui_controls_batch_09_manifest.json \
            --fixture tools/fixtures/cash_control_ui_controls_batch_09_behavior.json

      - name: Run focused audits
        run: |
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json redundancy-report.json
          python tools/spina_quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json quality-report.json

      - name: Commit verified extraction and remove write workflow
        run: |
          rm -f \
            cash-control-ui-controls-before.json \
            cash-control-ui-controls-after.json \
            redundancy-report.json \
            quality-report.json
          rm .github/workflows/apply-cash-control-ui-controls-batch-09.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/ui_controls.py \
            tools/fixtures/cash_control_ui_controls_batch_09_manifest.json \
            tools/fixtures/cash_control_ui_controls_batch_09_behavior.json \
            tools/test_cash_control_ui_controls_batch_09.py
          git add -u .github/workflows/apply-cash-control-ui-controls-batch-09.yml
          git commit -m "Extract Cash Control UI control helpers"
          git push origin HEAD:${{ github.head_ref }}
