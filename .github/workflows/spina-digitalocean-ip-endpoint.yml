name: Spina DigitalOcean Direct IP Endpoint

on:
  push:
    branches:
      - ops/digitalocean-production
    paths:
      - .github/workflows/spina-digitalocean-ip-endpoint.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect available recovery secret names
        shell: bash
        env:
          RECOVERY_BROKER_URL: https://lnixxnckhitbzqtjvked.supabase.co/functions/v1/spina-github-recovery-secrets
        run: |
          set -Eeuo pipefail
          trap 'rm -f /tmp/spina-oidc.json /tmp/spina-recovery.json' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=spina-digitalocean-ip-endpoint" \
            > /tmp/spina-oidc.json
          OIDC_TOKEN="$(jq -er '.value' /tmp/spina-oidc.json)"
          echo "::add-mask::$OIDC_TOKEN"
          STATUS="$(curl --silent --show-error \
            --output /tmp/spina-recovery.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$RECOVERY_BROKER_URL")"
          echo "broker_status=$STATUS"
          jq '{error, missing, available_env_names}' /tmp/spina-recovery.json
          [[ "$STATUS" == "200" ]]
