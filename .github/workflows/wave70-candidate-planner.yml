name: Wave 70 Candidate Planner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/plan_wave70_candidates.py"
      - ".github/workflows/wave70-candidate-planner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave70-candidate-planner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-70'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 70 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile planner and desktop source
        shell: cmd
        run: |
          python -m py_compile tools\plan_wave70_candidates.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Rank remaining safe candidates
        shell: cmd
        run: python -m tools.plan_wave70_candidates

      - name: Commit candidate report
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave70-candidates.json
          git diff --cached --quiet && exit /b 0
          git commit -m "Add Wave 70 candidate report"
          git push origin HEAD:${{ github.head_ref }}
