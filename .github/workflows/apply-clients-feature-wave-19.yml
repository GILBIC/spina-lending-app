name: Apply Clients feature Wave 19

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/clients-feature-module-wave-19'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out Wave 19 branch
        uses: actions/checkout@v4
        with:
          ref: agent/clients-feature-module-wave-19
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Apply guarded Clients extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\apply_clients_feature_wave_19.py > artifacts\clients-wave-19-apply.log 2>&1

      - name: Upload apply traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-wave-19-apply-log
          path: artifacts/clients-wave-19-apply.log
          if-no-files-found: ignore

      - name: Compile extracted state
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\tabs\clients.py
          python -m py_compile tools\test_clients_feature_wave_19.py

      - name: Run Clients regression
        shell: cmd
        run: python -m tools.test_clients_feature_wave_19 > artifacts\clients-wave-19-regression.log 2>&1

      - name: Upload regression traceback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clients-wave-19-regression-log
          path: artifacts/clients-wave-19-regression.log
          if-no-files-found: ignore

      - name: Run redundancy audit
        shell: cmd
        run: python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json redundancy-report.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json quality-report.json

      - name: Commit verified application files
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\tabs\clients.py tools\fixtures\clients_feature_wave_19_manifest.json tools\test_clients_feature_wave_19.py
          git diff --cached --quiet && exit /b 0
          git commit -m "Extract Clients presentation module [skip ci]"
          git push origin HEAD:agent/clients-feature-module-wave-19

# Normal-user trigger after the verified Clients palette bridge correction.
