name: Temporary receipt route UI integration

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - .github/workflows/zz_tmp_apply_receipt_route_ui_cloud.yml
      - tools/tmp_apply_receipt_route_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
          fetch-depth: 0
      - name: Apply receipt route UI integration
        run: python tools/tmp_apply_receipt_route_ui.py
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Expose receipt allocation status on Collector route"
          git push origin HEAD:mobile/ca4-collector-ui
