name: Temporary 7x7 same-day receipt parity integration

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - .github/workflows/zz_tmp_apply_receipt_route_ui_cloud.yml
      - tools/tmp_apply_receipt_route_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
          fetch-depth: 0

      - name: Apply same-day receipt parity fixes
        shell: pwsh
        run: python tools/tmp_apply_receipt_route_ui.py

      - name: Compile touched Python sources
        shell: pwsh
        run: |
          python -m py_compile spina_app/calculation_rules.py
          python -m py_compile gilbic_backend/tests/test_seven_by_seven_desktop_server_parity_matrix.py
          python -m py_compile gilbic_backend/tests/test_seven_by_seven_desktop_server_postgres_parity.py
          python -m py_compile gilbic_backend/tests/test_seven_by_seven_mobile_collection_postgres.py
          python -m py_compile gilbic_backend/tests/test_contract_collection_posting.py

      - name: Commit parity fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spina_app/calculation_rules.py `
            gilbic_backend/tests/test_seven_by_seven_desktop_server_parity_matrix.py `
            gilbic_backend/tests/test_seven_by_seven_desktop_server_postgres_parity.py `
            gilbic_backend/tests/test_seven_by_seven_mobile_collection_postgres.py `
            gilbic_backend/tests/test_contract_collection_posting.py
          $changes = git diff --cached --name-only
          if ([string]::IsNullOrWhiteSpace(($changes | Out-String))) {
            Write-Host 'No parity changes to commit.'
            exit 0
          }
          git commit -m 'Align 7x7 same-day receipt parity with receipt-first posting'
          git push origin HEAD:mobile/ca4-collector-ui
