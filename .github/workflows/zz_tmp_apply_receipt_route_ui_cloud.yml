name: Temporary receipt route UI integration

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - .github/workflows/zz_tmp_apply_receipt_route_ui_cloud.yml
      - tools/tmp_apply_receipt_route_ui.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
          fetch-depth: 0
      - name: Apply receipt route UI integration
        shell: pwsh
        run: |
          $output = (& python tools/tmp_apply_receipt_route_ui.py 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            Set-Content -Path tools/tmp_receipt_route_ui_error.txt -Value $output -Encoding utf8
            Write-Host $output
            exit 1
          }
          Write-Host $output
      - name: Commit generated integration or diagnostic
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No changes to commit.'
            exit 0
          }
          if (Test-Path tools/tmp_receipt_route_ui_error.txt) {
            git commit -m 'Capture receipt route integration diagnostic'
          } else {
            git commit -m 'Expose receipt allocation status on Collector route'
          }
          git push origin HEAD:mobile/ca4-collector-ui
