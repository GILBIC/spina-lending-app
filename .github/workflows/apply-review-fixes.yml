name: Apply review fixes

on:
  push:
    branches: [review/bugs-efficiency]
    paths:
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/bugs-efficiency

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded fixes
        run: python tools/apply_review_fixes.py

      - name: Compile and validate
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            tools/redundancy_audit.py \
            tools/quality_audit.py \
            tools/test_quality_fixes.py
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python tools/quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --fail-critical
          python tools/test_quality_fixes.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Commit validated application changes
        run: |
          rm tools/apply_review_fixes.py
          rm .github/workflows/apply-review-fixes.yml
          git config user.name "SPINA Quality Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix task retries, account recovery, and repeated index setup"
          git push origin HEAD:review/bugs-efficiency
