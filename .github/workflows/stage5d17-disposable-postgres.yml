name: Stage 5D.17 disposable PostgreSQL validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage5d17-disposable-windows-postgres
  cancel-in-progress: false

jobs:
  validate-stage5d17-posting:
    if: contains(github.event.head_commit.message, '[stage5d17-disposable]')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      STAGE5D17_PG_PORT: '55432'
      STAGE5D17_PG_USER: stage5d17
      STAGE5D17_CLUSTER_BASE: ${{ runner.temp }}\..\spina-stage5d17-clusters
      STAGE5D17_RUN_ROOT: ${{ runner.temp }}\..\spina-stage5d17-clusters\run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      STAGE5D17_PG_DATA: ${{ runner.temp }}\..\spina-stage5d17-clusters\run-${{ github.run_id }}-attempt-${{ github.run_attempt }}\pgdata
      STAGE5D17_PG_LOG: ${{ runner.temp }}\..\spina-stage5d17-clusters\run-${{ github.run_id }}-attempt-${{ github.run_attempt }}\postgres.log
      STAGE5D17_CLUSTER_MARKER: ${{ runner.temp }}\..\spina-stage5d17-clusters\run-${{ github.run_id }}-attempt-${{ github.run_attempt }}\cluster-ready.marker
      STAGE5D17_VENV: ${{ runner.temp }}\..\spina-stage5d17-clusters\run-${{ github.run_id }}-attempt-${{ github.run_attempt }}\venv
      STAGE5D17_DATABASE_URL: postgresql://stage5d17@127.0.0.1:55432/postgres?sslmode=disable

    steps:
      - name: Check out exact revision
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Discover local PostgreSQL binaries
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pgBin = $null
          $initdb = Get-Command initdb.exe -ErrorAction SilentlyContinue
          if ($initdb) {
            $pgBin = Split-Path -Parent $initdb.Source
          }
          if (-not $pgBin) {
            $roots = @(
              'C:\Program Files\PostgreSQL',
              'C:\Program Files (x86)\PostgreSQL'
            )
            foreach ($root in $roots) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem $root -Directory |
                ForEach-Object { Join-Path $_.FullName 'bin' } |
                Where-Object {
                  (Test-Path (Join-Path $_ 'initdb.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_isready.exe'))
                } |
                Select-Object -First 1
              if ($candidate) {
                $pgBin = $candidate
                break
              }
            }
          }
          if (-not $pgBin) {
            throw 'No local PostgreSQL initdb/pg_ctl/pg_isready binaries were found. Refusing to use any remote database.'
          }
          "PG_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using local PostgreSQL binaries from $pgBin"

      - name: Reap orphaned owned Stage 5D.17 clusters
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pgCtl = Join-Path $env:PG_BIN 'pg_ctl.exe'
          $clusterBase = [System.IO.Path]::GetFullPath($env:STAGE5D17_CLUSTER_BASE).TrimEnd('\')
          $currentRoot = [System.IO.Path]::GetFullPath($env:STAGE5D17_RUN_ROOT).TrimEnd('\')
          New-Item -ItemType Directory -Force -Path $clusterBase | Out-Null

          Get-ChildItem $clusterBase -Directory -Filter 'run-*-attempt-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $candidateRoot = [System.IO.Path]::GetFullPath($_.FullName).TrimEnd('\')
              if ($candidateRoot -eq $currentRoot) { return }
              $marker = Join-Path $candidateRoot 'cluster-ready.marker'
              $pgData = Join-Path $candidateRoot 'pgdata'
              if (-not (Test-Path $marker) -or -not (Test-Path $pgData)) { return }

              Write-Host "Reaping previously owned Stage 5D.17 cluster at $candidateRoot"
              & $pgCtl -D $pgData status 2>$null
              $statusExit = $LASTEXITCODE
              if ($statusExit -eq 0) {
                & $pgCtl -D $pgData -m immediate -w stop
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to stop owned orphan Stage 5D.17 cluster at $candidateRoot."
                }
              }
              elseif ($statusExit -ne 3) {
                throw "Could not verify owned orphan Stage 5D.17 cluster state at $candidateRoot."
              }

              Remove-Item -Recurse -Force $candidateRoot
              if (Test-Path $candidateRoot) {
                throw "Failed to remove owned orphan Stage 5D.17 cluster at $candidateRoot."
              }
            }

      - name: Initialize isolated temporary PostgreSQL cluster
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $initdb = Join-Path $env:PG_BIN 'initdb.exe'
          $pgCtl = Join-Path $env:PG_BIN 'pg_ctl.exe'
          $pgIsReady = Join-Path $env:PG_BIN 'pg_isready.exe'
          $runRoot = $env:STAGE5D17_RUN_ROOT
          $pgData = $env:STAGE5D17_PG_DATA
          $pgLog = $env:STAGE5D17_PG_LOG
          $marker = $env:STAGE5D17_CLUSTER_MARKER
          $port = [int]$env:STAGE5D17_PG_PORT

          if (Test-Path $runRoot) {
            Remove-Item -Recurse -Force $runRoot
          }
          New-Item -ItemType Directory -Force -Path $runRoot | Out-Null

          $probe = New-Object System.Net.Sockets.TcpClient
          try {
            $probe.Connect('127.0.0.1', $port)
            throw "Reserved Stage 5D.17 test port $port is already in use; refusing to continue."
          }
          catch [System.Net.Sockets.SocketException] {
            # Connection refused is the expected safe state before the test cluster starts.
          }
          finally {
            $probe.Dispose()
          }

          & $initdb -D $pgData -U $env:STAGE5D17_PG_USER --auth=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed for the Stage 5D.17 temporary cluster.' }

          & $pgCtl -D $pgData -l $pgLog -o "-p $port -h 127.0.0.1" -w start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $pgLog) { Get-Content $pgLog }
            throw 'Temporary PostgreSQL cluster failed to start.'
          }

          & $pgIsReady -h 127.0.0.1 -p $port -U $env:STAGE5D17_PG_USER -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster did not become ready.' }

          "run_id=${{ github.run_id }}`nrun_attempt=${{ github.run_attempt }}`npgdata=$pgData`nport=$port" |
            Set-Content -Path $marker -Encoding ascii
          if (-not (Test-Path $marker)) {
            throw 'Temporary PostgreSQL ownership marker was not created.'
          }

      - name: Create isolated verifier environment
        timeout-minutes: 10
        shell: cmd
        run: |
          if not exist "%STAGE5D17_CLUSTER_MARKER%" exit /b 1
          if exist "%STAGE5D17_VENV%" rmdir /s /q "%STAGE5D17_VENV%"
          python -m venv "%STAGE5D17_VENV%" || exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9" || exit /b 1

      - name: Compile disposable PostgreSQL verifier
        timeout-minutes: 2
        shell: cmd
        run: |
          if not exist "%STAGE5D17_CLUSTER_MARKER%" exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" -m py_compile tools\run_stage5d17_disposable_postgres_validation.py || exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_regular_journal_posting_postgres.py || exit /b 1

      - name: Reap stale Stage 5D.17 disposable databases before execution
        timeout-minutes: 3
        shell: cmd
        run: |
          if not exist "%STAGE5D17_CLUSTER_MARKER%" exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" tools\run_stage5d17_disposable_postgres_validation.py --cleanup-stale-only --database-url-env STAGE5D17_DATABASE_URL || exit /b 1

      - name: Execute protected Regular posting in temporary local PostgreSQL
        timeout-minutes: 12
        shell: cmd
        run: |
          if not exist "%STAGE5D17_CLUSTER_MARKER%" exit /b 1
          "%STAGE5D17_VENV%\Scripts\python.exe" tools\run_stage5d17_disposable_postgres_validation.py --database-url-env STAGE5D17_DATABASE_URL || exit /b 1

      - name: Reap Stage 5D.17 disposable databases after execution
        if: always()
        timeout-minutes: 3
        shell: cmd
        run: |
          if not exist "%STAGE5D17_CLUSTER_MARKER%" exit /b 0
          if not exist "%STAGE5D17_VENV%\Scripts\python.exe" exit /b 0
          "%STAGE5D17_VENV%\Scripts\python.exe" tools\run_stage5d17_disposable_postgres_validation.py --cleanup-stale-only --database-url-env STAGE5D17_DATABASE_URL || exit /b 1

      - name: Stop and delete temporary PostgreSQL cluster
        if: always()
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $runRoot = $env:STAGE5D17_RUN_ROOT
          $pgData = $env:STAGE5D17_PG_DATA
          if ($env:PG_BIN) {
            $pgCtl = Join-Path $env:PG_BIN 'pg_ctl.exe'
            if ((Test-Path $pgCtl) -and (Test-Path $pgData)) {
              & $pgCtl -D $pgData status 2>$null
              $statusExit = $LASTEXITCODE
              if ($statusExit -eq 0) {
                & $pgCtl -D $pgData -m fast -w stop
                if ($LASTEXITCODE -ne 0) {
                  & $pgCtl -D $pgData -m immediate -w stop
                  if ($LASTEXITCODE -ne 0) {
                    throw 'Failed to stop the Stage 5D.17 temporary PostgreSQL cluster; preserving its data directory for safe recovery.'
                  }
                }
              }
              elseif ($statusExit -ne 3) {
                throw 'Could not verify the Stage 5D.17 temporary PostgreSQL cluster state; preserving its data directory for safe recovery.'
              }
            }
          }
          if (Test-Path $runRoot) {
            Remove-Item -Recurse -Force $runRoot
          }
          if (Test-Path $runRoot) {
            throw 'Stage 5D.17 temporary PostgreSQL run directory was not removed.'
          }
