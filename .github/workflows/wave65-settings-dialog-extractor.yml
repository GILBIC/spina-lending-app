name: Wave 65 Settings Dialog Extractor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_wave65_settings_dialog_extraction.py"
      - ".github/workflows/wave65-settings-dialog-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave65-settings-dialog-extractor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-65'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 65 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 288-line extraction
        shell: cmd
        run: |
          python -m py_compile tools\apply_wave65_settings_dialog_extraction.py
          python tools\apply_wave65_settings_dialog_extraction.py

      - name: Compile extracted application and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\settings_dialog_presentation.py
          python -m py_compile tools\test_settings_dialog_presentation_wave_65.py
          python -m py_compile tools\test_settings_dialog_widget_smoke_wave_65.py

      - name: Run Wave 65 focused regressions
        shell: cmd
        run: |
          python -m tools.test_settings_dialog_presentation_wave_65
          python -m tools.test_settings_dialog_widget_smoke_wave_65

      - name: Commit extracted source and permanent tests
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add spina_app\settings_dialog_presentation.py
          git add tools\test_settings_dialog_presentation_wave_65.py
          git add tools\test_settings_dialog_widget_smoke_wave_65.py
          git diff --cached --quiet || git commit -m "Extract Settings dialog presentation Wave 65"

      - name: Regenerate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 65 architecture maps"

      - name: Push Wave 65 extraction
        shell: cmd
        run: git push origin HEAD:agent/high-volume-wave-65
