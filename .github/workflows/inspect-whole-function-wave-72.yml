name: Inspect Whole Function Wave 72

on:
  pull_request:
    branches:
      - main
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_whole_function_wave_72.py"
      - ".github/workflows/inspect-whole-function-wave-72.yml"
  push:
    branches:
      - agent/high-volume-wave-72
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_whole_function_wave_72.py"
      - ".github/workflows/inspect-whole-function-wave-72.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-72
          fetch-depth: 0

      - name: Compile inspector
        run: python -m py_compile tools/inspect_whole_function_wave_72.py

      - name: Inspect complete active function
        run: python tools/inspect_whole_function_wave_72.py

      - name: Commit reviewed boundary metadata
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wave72_whole_function_report.json wave72_set_theme_source.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Record Wave 72 whole-function boundary"
            git push origin HEAD:agent/high-volume-wave-72
          }

      - name: Upload inspector report
        uses: actions/upload-artifact@v4
        with:
          name: wave72-whole-function-inspection
          path: |
            wave72_whole_function_report.json
            wave72_set_theme_source.py
