name: Apply Dashboard feature Wave 17

on:
  push:
    branches: [agent/dashboard-feature-module-wave-17]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-feature-module-wave-17
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract complete legacy Dashboard feature group
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          APP = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          MODULE = Path("spina_app/tabs/dashboard.py")
          INIT = Path("spina_app/tabs/__init__.py")
          MANIFEST = Path("tools/fixtures/dashboard_feature_wave_17_manifest.json")
          TEST = Path("tools/test_dashboard_feature_wave_17.py")
          WORKFLOW = Path(".github/workflows/dashboard-feature-wave-17.yml")

          expected = {
              "_spina_v17_visible_dashboard_rows": {
                  "signature": "self",
                  "sha256": "c703482167fa2b3e98a48b3522dfbcc3d0a91afe6503627ebd687038eb1cc0ac",
                  "line_count": 26,
              },
              "_spina_v17_build_dashboard_tab": {
                  "signature": "self",
                  "sha256": "d3afc06e49618191532f3312c4cc69fa180faf203b9866122785bc6ce5c81513",
                  "line_count": 247,
              },
              "_spina_v17_draw_dashboard_charts": {
                  "signature": "self, rows",
                  "sha256": "27038d3180e39517991e53759a57d1b23668c7ecea35625404178975158698aa",
                  "line_count": 87,
              },
              "_spina_v17_populate_dashboard_tree": {
                  "signature": "self",
                  "sha256": "a3ef5f6e519ec0cbf25d9524d4d3f047b2221bfd2e0aa1d1bed88f4a2afa5341",
                  "line_count": 83,
              },
              "_spina_v17_refresh_dashboard": {
                  "signature": "self",
                  "sha256": "cfd3440ef7171e1b5988d34bf56bce68176545dce2846c5e9f4e55388442ae58",
                  "line_count": 19,
              },
          }
          names = list(expected)

          source = APP.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(APP))
          nodes = {
              node.name: node
              for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name in expected
          }
          if set(nodes) != set(names):
              raise RuntimeError(f"Expected Dashboard definitions {names}, found {sorted(nodes)}")

          segments = {}
          for name in names:
              node = nodes[name]
              segment = ast.get_source_segment(source, node)
              if segment is None:
                  raise RuntimeError(f"Could not recover exact source for {name}")
              digest = hashlib.sha256(segment.encode("utf-8")).hexdigest()
              signature = ast.unparse(node.args)
              line_count = node.end_lineno - node.lineno + 1
              spec = expected[name]
              if digest != spec["sha256"]:
                  raise RuntimeError(f"Source hash changed for {name}: {digest}")
              if signature != spec["signature"]:
                  raise RuntimeError(f"Signature changed for {name}: {signature}")
              if line_count != spec["line_count"]:
                  raise RuntimeError(f"Line count changed for {name}: {line_count}")
              segments[name] = segment

          MODULE.parent.mkdir(parents=True, exist_ok=True)
          INIT.write_text('"""Feature-level Tkinter tab modules for SPINA."""\n', encoding="utf-8")

          module_header = '''"""Legacy Dashboard feature extracted from the SPINA desktop source.

The five public helpers retain their original names so existing App patching and
callbacks continue to work. Database row loading and application logging remain
owned by the desktop entry module and are supplied through a small late-bound
bridge to avoid circular imports.
"""

from __future__ import annotations

import tkinter as tk
from tkinter import ttk

from spina_app.theme_palettes import _spina_v17_dash_colors
from spina_app.ui_cards import _spina_v17_make_card
from spina_app.ui_controls import (
    _spina_v17_style_dashboard_table,
    _spina_v17_update_filter_buttons,
)
from spina_app.ui_helpers import _spina_v17_set_card
from spina_app.utilities.formatting import (
    _spina_dash__fmt_money,
    _spina_dash__fmt_pct,
    _spina_v17_fmt_short_money,
)

_dashboard_fetch_rows = None
_dashboard_log_exc = None


def configure_legacy_dashboard_feature(*, fetch_rows=None, log_exc=None):
    """Attach main-module services without importing the large entry module."""
    global _dashboard_fetch_rows, _dashboard_log_exc
    if fetch_rows is not None:
        _dashboard_fetch_rows = fetch_rows
    if log_exc is not None:
        _dashboard_log_exc = log_exc


def _spina_dashboard_fetch_rows(self):
    if not callable(_dashboard_fetch_rows):
        return []
    return _dashboard_fetch_rows(self)


def _log_exc(context, exc=None):
    if callable(_dashboard_log_exc):
        return _dashboard_log_exc(context, exc)
    return None
'''
          module_text = module_header.rstrip() + "\n\n\n" + "\n\n\n".join(segments[name] for name in names) + "\n"
          MODULE.write_text(module_text, encoding="utf-8")

          import_block = '''from spina_app.tabs.dashboard import (
    configure_legacy_dashboard_feature as _spina_v17_configure_feature,
    _spina_v17_visible_dashboard_rows,
    _spina_v17_build_dashboard_tab,
    _spina_v17_draw_dashboard_charts,
    _spina_v17_populate_dashboard_tree,
    _spina_v17_refresh_dashboard,
)

_spina_v17_configure_feature(
    fetch_rows=lambda app: _spina_dashboard_fetch_rows(app),
    log_exc=lambda context, exc=None: _log_exc(context, exc),
)
'''
          lines = source.splitlines(keepends=True)
          first_name = min(names, key=lambda name: nodes[name].lineno)
          for name in sorted(names, key=lambda item: nodes[item].lineno, reverse=True):
              node = nodes[name]
              start = node.lineno - 1
              end = node.end_lineno
              if name == first_name:
                  lines[start:end] = [import_block + "\n"]
              else:
                  del lines[start:end]
          updated = "".join(lines)
          ast.parse(updated, filename=str(APP))
          for name in names:
              if f"def {name}(" in updated:
                  raise RuntimeError(f"Original Dashboard definition remains in main source: {name}")
          if "from spina_app.tabs.dashboard import (" not in updated:
              raise RuntimeError("Dashboard feature import block was not inserted")
          APP.write_text(updated, encoding="utf-8")

          manifest = {
              "wave": 17,
              "feature": "legacy_dashboard",
              "app": str(APP),
              "module": "spina_app.tabs.dashboard",
              "module_path": str(MODULE),
              "helper_count": len(names),
              "moved_source_lines": sum(item["line_count"] for item in expected.values()),
              "helpers": [
                  {"name": name, **expected[name]}
                  for name in names
              ],
          }
          MANIFEST.parent.mkdir(parents=True, exist_ok=True)
          MANIFEST.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          test_source = r'''#!/usr/bin/env python3
"""Regression checks for the Wave 17 Dashboard feature-level extraction."""

from __future__ import annotations

import ast
import hashlib
import importlib
import json
import sys
from pathlib import Path
from types import SimpleNamespace

ROOT = Path(__file__).resolve().parents[1]
if str(ROOT) not in sys.path:
    sys.path.insert(0, str(ROOT))

APP = ROOT / "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
MANIFEST = ROOT / "tools/fixtures/dashboard_feature_wave_17_manifest.json"


class Var:
    def __init__(self, value=None):
        self.value = value

    def get(self):
        return self.value

    def set(self, value):
        self.value = value


def _functions(path: Path):
    text = path.read_text(encoding="utf-8")
    tree = ast.parse(text, filename=str(path))
    return text, {
        node.name: node
        for node in tree.body
        if isinstance(node, ast.FunctionDef)
    }


def verify_static_extraction():
    manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
    app_text, app_functions = _functions(APP)
    module_path = ROOT / manifest["module_path"]
    module_text, module_functions = _functions(module_path)

    names = [item["name"] for item in manifest["helpers"]]
    for item in manifest["helpers"]:
        name = item["name"]
        if name in app_functions:
            raise RuntimeError(f"{name} still has a top-level definition in the main source")
        node = module_functions.get(name)
        if node is None:
            raise RuntimeError(f"{name} is missing from the Dashboard feature module")
        segment = ast.get_source_segment(module_text, node)
        if segment is None:
            raise RuntimeError(f"Could not recover module source for {name}")
        digest = hashlib.sha256(segment.encode("utf-8")).hexdigest()
        if digest != item["sha256"]:
            raise RuntimeError(f"Source body changed for {name}: {digest}")
        if ast.unparse(node.args) != item["signature"]:
            raise RuntimeError(f"Signature changed for {name}")

    if "from spina_app.tabs.dashboard import (" not in app_text:
        raise RuntimeError("Main source does not import the Dashboard feature group")
    if manifest["helper_count"] != 5 or manifest["moved_source_lines"] != 462:
        raise RuntimeError("Unexpected Wave 17 extraction size")
    return names


def verify_visible_rows(module):
    rows = [
        {"name": "Ana", "area": "North", "loan_type": "Regular", "status": "Due Soon"},
        {"name": "Ben", "area": "South", "loan_type": "7x7", "status": "Complete"},
        {"name": "Cara", "area": "North", "loan_type": "7x7", "status": "Overdue"},
    ]
    app = SimpleNamespace(
        _dashboard_rows=rows,
        dashboard_loan_filter_var=Var("All"),
        dashboard_status_filter_var=Var("All Active"),
        dashboard_search_var=Var(""),
    )
    assert module._spina_v17_visible_dashboard_rows(app) == rows

    app.dashboard_loan_filter_var.set("7x7")
    assert [r["name"] for r in module._spina_v17_visible_dashboard_rows(app)] == ["Ben", "Cara"]

    app.dashboard_status_filter_var.set("Priority")
    assert [r["name"] for r in module._spina_v17_visible_dashboard_rows(app)] == ["Cara"]

    app.dashboard_loan_filter_var.set("All")
    app.dashboard_status_filter_var.set("All Active")
    app.dashboard_search_var.set("north")
    assert [r["name"] for r in module._spina_v17_visible_dashboard_rows(app)] == ["Ana", "Cara"]


def verify_refresh_bridge(module):
    calls = []
    logs = []
    original_populate = module._spina_v17_populate_dashboard_tree
    try:
        module._spina_v17_populate_dashboard_tree = lambda app: calls.append(("populate", list(app._dashboard_rows)))
        module.configure_legacy_dashboard_feature(
            fetch_rows=lambda app: [{"name": "Loaded"}],
            log_exc=lambda context, exc=None: logs.append((context, type(exc).__name__ if exc else None)),
        )
        app = SimpleNamespace(tab_dashboard=object(), status_var=Var(""))
        module._spina_v17_refresh_dashboard(app)
        assert app._dashboard_rows == [{"name": "Loaded"}]
        assert calls == [("populate", [{"name": "Loaded"}])]
        assert app.status_var.get() == "Dashboard refreshed."

        def broken_fetch(_app):
            raise RuntimeError("fetch failed")

        module.configure_legacy_dashboard_feature(fetch_rows=broken_fetch)
        app2 = SimpleNamespace(tab_dashboard=object(), status_var=Var(""))
        module._spina_v17_refresh_dashboard(app2)
        assert app2.status_var.get() == "Dashboard refresh failed. See data/spina_app.log."
        assert logs and logs[-1][0] == "v17.refresh_dashboard"
    finally:
        module._spina_v17_populate_dashboard_tree = original_populate


def main():
    names = verify_static_extraction()
    module = importlib.import_module("spina_app.tabs.dashboard")
    verify_visible_rows(module)
    verify_refresh_bridge(module)
    print(f"Dashboard Wave 17 extraction verified: {len(names)} helpers, 462 source lines moved")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
'''
          TEST.write_text(test_source, encoding="utf-8")

