name: Collector refresh presentation Wave 39 bootstrap
on: [pull_request]
permissions:
  contents: write
jobs:
  extract-and-validate:
    if: github.head_ref == 'agent/collector-refresh-presentation-wave-39'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out Wave 39 branch
        uses: actions/checkout@v4
        with:
          ref: agent/collector-refresh-presentation-wave-39
          fetch-depth: 0
      - name: Verify local Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh auth status
      - name: Capture guarded collector-refresh extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/apply_collector_refresh_presentation_wave_39.py > artifacts\wave-39-extractor.log 2>&1
          echo %ERRORLEVEL%> artifacts\wave-39-extractor-exit.txt
          type artifacts\wave-39-extractor.log
          exit /b 0
      - name: Upload extractor diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-refresh-wave-39-extractor-diagnostic
          path: |
            artifacts/wave-39-extractor.log
            artifacts/wave-39-extractor-exit.txt
          if-no-files-found: error
      - name: Enforce extractor exit code
        shell: powershell
        run: |
          $code = [int](Get-Content 'artifacts/wave-39-extractor-exit.txt' -Raw).Trim()
          if ($code -ne 0) { exit $code }
      - name: Compile application, module, and test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/collector_refresh_presentation.py
          python -m py_compile tools/test_collector_refresh_presentation_wave_39.py
          python -m compileall -q spina_app
      - name: Run exact collector-refresh regression
        shell: cmd
        run: python tools/test_collector_refresh_presentation_wave_39.py
      - name: Commit application extraction
        shell: cmd
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/collector_refresh_presentation.py tools/test_collector_refresh_presentation_wave_39.py .github/workflows/collector-refresh-presentation-wave-39.yml
          git commit -m "Extract collector refresh presentation Wave 39"
      - name: Regenerate architecture map
        shell: cmd
        run: python -m tools.generate_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m tools.test_architecture_map
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-39-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-39-quality.json
      - name: Commit architecture refresh
        shell: cmd
        run: |
          git add architecture-map.json docs/architecture
          git commit -m "Refresh architecture map after Wave 39"
      - name: Push completed Wave 39 branch
        shell: cmd
        run: git push origin HEAD:agent/collector-refresh-presentation-wave-39
