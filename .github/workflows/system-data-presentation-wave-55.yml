name: System Data presentation Wave 55

# Permanent read-only validation for the finalized Wave 55 branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/system_data_presentation.py"
      - "tools/test_system_data_presentation_wave_55.py"
      - "tools/test_system_data_widget_smoke_wave_55.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/system-data-presentation-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-data-presentation-wave-55-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\system_data_presentation.py
          python -m py_compile tools\test_system_data_presentation_wave_55.py
          python -m py_compile tools\test_system_data_widget_smoke_wave_55.py
          python -m compileall -q spina_app

      - name: Run exact System Data extraction regression
        shell: cmd
        run: python -m tools.test_system_data_presentation_wave_55

      - name: Run real Tkinter System Data construction and routing test
        shell: cmd
        run: python -m tools.test_system_data_widget_smoke_wave_55

      - name: Run protected Data Bank, navigation, and theme regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-55-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-55-quality.json

      - name: Upload Wave 55 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-data-presentation-wave-55-reports
          path: artifacts/wave-55-*.json
          if-no-files-found: warn
