name: Inspect modularization wave 11 UI

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build focused exact-source packet
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import builtins
          import hashlib
          import json
          from pathlib import Path

          app = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          source = app.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(app))
          all_functions = [
              node for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          top_level = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
          }
          selected = sorted(
              (
                  node for node in all_functions
                  if ("clients" in node.name.lower() or "route" in node.name.lower())
                  and any(token in node.name.lower() for token in ("color", "palette", "style", "card", "button"))
              ),
              key=lambda node: (node.lineno, node.name),
          )
          builtin_names = set(dir(builtins))

          def external_names(node: ast.FunctionDef) -> list[str]:
              local = {
                  arg.arg
                  for arg in (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)
              }
              if node.args.vararg:
                  local.add(node.args.vararg.arg)
              if node.args.kwarg:
                  local.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, (ast.Store, ast.Del)):
                      local.add(child.id)
              loaded = {
                  child.id
                  for child in ast.walk(node)
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Load)
              }
              return sorted(loaded - local - builtin_names - {node.name})

          def enclosing_top_level(node: ast.AST) -> str | None:
              for owner_name, owner in top_level.items():
                  if owner is node:
                      return None
                  if getattr(owner, "lineno", 0) <= node.lineno <= getattr(owner, "end_lineno", -1):
                      return owner_name
              return None

          def callers(name: str) -> list[str]:
              result = []
              for owner_name, owner in top_level.items():
                  if owner_name == name:
                      continue
                  if any(
                      isinstance(child, ast.Name)
                      and isinstance(child.ctx, ast.Load)
                      and child.id == name
                      for child in ast.walk(owner)
                  ):
                      result.append(owner_name)
              return sorted(result)

          packet = []
          for node in selected:
              exact = ast.get_source_segment(source, node)
              if exact is None:
                  raise RuntimeError(f"Could not recover source: {node.name}")
              packet.append({
                  "name": node.name,
                  "signature": ast.unparse(node.args),
                  "source": exact,
                  "source_sha256": hashlib.sha256(exact.encode("utf-8")).hexdigest(),
                  "external_names": external_names(node),
                  "callers": callers(node.name),
                  "occurrence_count": source.count(node.name),
                  "lineno": node.lineno,
                  "end_lineno": node.end_lineno,
                  "col_offset": node.col_offset,
                  "enclosing_top_level": enclosing_top_level(node),
                  "is_top_level": node in tree.body,
              })

          payload = {
              "source_commit": "${{ github.sha }}",
              "functions": packet,
              "safety": {"read_only": True, "application_modified": False},
          }
          Path("modularization-wave-11-ui.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "functions": [item["name"] for item in packet],
              "locations": {
                  item["name"]: {
                      "line": item["lineno"],
                      "owner": item["enclosing_top_level"],
                      "top_level": item["is_top_level"],
                  }
                  for item in packet
              },
          }, indent=2))
          PY

      - name: Upload focused inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: modularization-wave-11-ui
          path: modularization-wave-11-ui.json
          if-no-files-found: error
          retention-days: 14
