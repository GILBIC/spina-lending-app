name: UI button factories Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/ui_controls.py"
      - "spina_app/theme_palettes.py"
      - "spina_app/collector_tab_presentation.py"
      - "spina_app/login_dialog_presentation.py"
      - "tools/test_ui_button_factories_wave_50.py"
      - "tools/test_ui_button_factories_widget_smoke_wave_50.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/ui-button-factories-wave-50.yml"
permissions:
  contents: read
jobs:
  validate:
    if: github.head_ref == 'agent/presentation-batch-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile application, UI controls, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/ui_controls.py
          python -m py_compile spina_app/theme_palettes.py
          python -m py_compile spina_app/collector_tab_presentation.py
          python -m py_compile spina_app/login_dialog_presentation.py
          python -m py_compile tools/test_ui_button_factories_wave_50.py
          python -m py_compile tools/test_ui_button_factories_widget_smoke_wave_50.py
          python -m compileall -q spina_app
      - name: Run exact UI button-factory regression
        shell: cmd
        run: python tools/test_ui_button_factories_wave_50.py
      - name: Run real Tkinter button smoke test
        shell: cmd
        run: python tools/test_ui_button_factories_widget_smoke_wave_50.py
      - name: Run protected Collector Route regressions
        shell: cmd
        run: |
          python tools/test_collector_tab_presentation_wave_44.py
          python tools/test_collector_tab_widget_smoke_wave_44.py
      - name: Run protected login and shutdown regressions
        shell: cmd
        run: |
          python tools/test_login_dialog_presentation_wave_45.py
          python tools/test_login_dialog_widget_smoke_wave_45.py
          python tools/test_account_header_presentation_wave_46.py
          python tools/test_tk_shutdown_wave_46.py
          python tools/test_login_cancel_startup_wave_46.py
      - name: Run protected theme regression
        shell: cmd
        run: python -m tools.test_theme_presentation_wave_35
      - name: Validate permanent architecture map
        shell: cmd
        run: python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-50-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-50-quality.json
      - name: Upload Wave 50 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-ui-button-factory-reports
          path: artifacts/wave-50-*.json
