name: Wave 70 Client New Extractor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/client_new_status.py"
      - "tools/extract_client_new_status_wave_70.py"
      - "tools/test_client_new_status_wave_70.py"
      - "tools/test_client_new_status_behavior_wave_70.py"
      - ".github/workflows/wave70-client-new-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave70-client-new-extractor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-70'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 70 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile guarded extractor and permanent files
        shell: cmd
        run: |
          python -m py_compile tools\extract_client_new_status_wave_70.py
          python -m py_compile spina_app\client_new_status.py
          python -m py_compile tools\test_client_new_status_wave_70.py
          python -m py_compile tools\test_client_new_status_behavior_wave_70.py

      - name: Extract exact client-new boundary
        shell: cmd
        run: python -m tools.extract_client_new_status_wave_70

      - name: Compile extracted application
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\client_new_status.py
          python -m compileall -q spina_app

      - name: Run Wave 70 structural regression
        shell: cmd
        run: python -m tools.test_client_new_status_wave_70

      - name: Run Wave 70 behavior regression
        shell: cmd
        run: python -m tools.test_client_new_status_behavior_wave_70

      - name: Run protected client-statement regression
        shell: cmd
        run: python -m tools.test_client_statement_generation_wave_67

      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-70-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-70-quality.json

      - name: Commit validated extraction and maps
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py architecture-map.json docs\architecture
          git diff --cached --quiet && exit /b 0
          git commit -m "Extract client NEW status Wave 70"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload Wave 70 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-new-status-wave-70-reports
          path: artifacts/wave-70-*.json
          if-no-files-found: warn
