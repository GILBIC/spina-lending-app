name: Temporary cross-collector correction patch

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - 'tools/tmp_patch_cross_correction.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Apply cross-collector correction patch
        shell: cmd
        run: python tools\tmp_patch_cross_correction.py
