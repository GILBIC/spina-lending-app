name: Plan high-volume Wave 51
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/plan_high_volume_wave_51.py"
      - ".github/workflows/plan-high-volume-wave-51.yml"
permissions:
  contents: read
concurrency:
  group: plan-high-volume-wave-51-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    if: github.head_ref == 'agent/high-volume-wave-51'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile planner
        shell: cmd
        run: python -m py_compile tools/plan_high_volume_wave_51.py
      - name: Rank strict high-volume batches
        shell: cmd
        run: python tools/plan_high_volume_wave_51.py
      - name: Upload Wave 51 plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-51-high-volume-plan
          path: artifacts/wave-51-high-volume-plan.json
          if-no-files-found: error
