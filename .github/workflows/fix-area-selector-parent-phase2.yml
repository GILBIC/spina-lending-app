name: Fix Area selector parent Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct selector parent
        run: |
          python tools/fix_area_selector_parent_phase2.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Correct legacy Area selector container"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
