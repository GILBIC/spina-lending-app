name: Temporary Collector Flutter test alignment

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - 'tools/tmp_align_collector_flutter_tests.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Align Collector tests with approved one-tap UI
        shell: cmd
        run: python tools\tmp_align_collector_flutter_tests.py
