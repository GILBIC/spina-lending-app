name: Apply Reports notes dialog fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reports-notes-panel-visible
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire Notes button to existing dialog
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          app = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = app.read_text(encoding='utf-8')
          lines = source.splitlines(keepends=True)
          tree = ast.parse(source)

          builders = [
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == '_spina_v22_build_reports_tab'
          ]
          if len(builders) != 1:
              raise RuntimeError(f'Expected one modern Reports builder, found {len(builders)}')
          builder = builders[0]
          region = lines[builder.lineno - 1:builder.end_lineno]
          stripped = [line.strip() for line in region]

          old_command = 'self.report_notes_btn.configure(command=_toggle_reports_notes_panel)'
          new_command = 'self.report_notes_btn.configure(command=self._open_note_dialog)'
          old_positions = [i for i, value in enumerate(stripped) if value == old_command]
          new_positions = [i for i, value in enumerate(stripped) if value == new_command]
          if len(old_positions) == 1 and not new_positions:
              i = old_positions[0]
              indent = region[i][:len(region[i]) - len(region[i].lstrip())]
              newline = '\r\n' if region[i].endswith('\r\n') else '\n'
              region[i] = indent + new_command + newline
          elif not old_positions and len(new_positions) == 1:
              pass
          else:
              raise RuntimeError(f'Unexpected Notes command state: old={old_positions}, new={new_positions}')

          fixed_box = 'self.reports_notes_box.pack(side="bottom", fill="x", padx=18, pady=(0, 18), before=table_card)'
          fixed_sep = 'self.reports_notes_sep.pack(side="bottom", fill="x", padx=18, pady=(0, 6), before=table_card)'
          original_sep = 'self.reports_notes_sep.pack(fill="x", padx=18, pady=(0, 6))'
          original_box = 'self.reports_notes_box.pack(fill="x", padx=18, pady=(0, 18))'

          stripped = [line.strip() for line in region]
          box_positions = [i for i, value in enumerate(stripped) if value == fixed_box]
          sep_positions = [i for i, value in enumerate(stripped) if value == fixed_sep]
          if len(box_positions) == 1 and len(sep_positions) == 1:
              box_i = box_positions[0]
              sep_i = sep_positions[0]
              box_indent = region[box_i][:len(region[box_i]) - len(region[box_i].lstrip())]
              sep_indent = region[sep_i][:len(region[sep_i]) - len(region[sep_i].lstrip())]
              box_nl = '\r\n' if region[box_i].endswith('\r\n') else '\n'
              sep_nl = '\r\n' if region[sep_i].endswith('\r\n') else '\n'
              region[box_i] = box_indent + original_sep + box_nl
              region[sep_i] = sep_indent + original_box + sep_nl
          else:
              current = [line.strip() for line in region]
              if original_sep not in current or original_box not in current:
                  raise RuntimeError('Unable to restore original unused drawer layout')

          lines[builder.lineno - 1:builder.end_lineno] = region
          app.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Compile and test
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            tools/test_reports_notes_dialog_wiring.py
          python tools/test_reports_notes_dialog_wiring.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Open Report Notes in existing editor dialog"
          git push origin HEAD:agent/fix-reports-notes-panel-visible
