name: Extract Data Bank editor Wave 60

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/extract_databank_editor_wave60_tmp.py"
      - "tools/patch_databank_editor_smoke_wave60_tmp.py"
      - ".github/workflows/extract-databank-editor-wave-60.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-60'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 60 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Extract guarded Data Bank editor boundary
        shell: cmd
        run: python -m tools.extract_databank_editor_wave60_tmp
      - name: Configure generated smoke-test dependencies
        shell: cmd
        run: python -m tools.patch_databank_editor_smoke_wave60_tmp
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_editor_presentation.py
          python -m py_compile tools\test_databank_editor_presentation_wave_60.py
          python -m py_compile tools\test_databank_editor_widget_smoke_wave_60.py
          python -m compileall -q spina_app
      - name: Run exact Data Bank editor extraction regression
        shell: cmd
        run: python -m tools.test_databank_editor_presentation_wave_60
      - name: Run real Tkinter Data Bank editor behavior test
        shell: cmd
        run: python -m tools.test_databank_editor_widget_smoke_wave_60
      - name: Run protected Data Bank and System Data regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_databank_presentation_wave_49
          python -m tools.test_databank_widget_smoke_wave_49
          python -m tools.test_ui_button_factories_wave_50
          python -m tools.test_databank_import_control_wave_53
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_audit_presentation_wave_54
          python -m tools.test_system_data_presentation_wave_56
          python -m tools.test_system_data_widget_smoke_wave_56
          python -m tools.test_databank_close_history_presentation_wave_57
          python -m tools.test_databank_close_history_widget_smoke_wave_57
          python -m tools.test_system_data_summary_presentation_wave_58
          python -m tools.test_system_data_summary_widget_smoke_wave_58
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_grid_widget_smoke_wave_59
      - name: Commit extracted application boundary
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_editor_presentation.py tools\test_databank_editor_presentation_wave_60.py tools\test_databank_editor_widget_smoke_wave_60.py
          git commit -m "Extract Data Bank editor presentation Wave 60"
          git push origin HEAD:agent/high-volume-wave-60
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        shell: cmd
        run: |
          git add architecture-map.json docs\architecture
          git commit -m "Refresh architecture maps for Wave 60"
          git push origin HEAD:agent/high-volume-wave-60
      - name: Upload Wave 60 extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-editor-wave-60-extraction
          path: artifacts/wave-60-databank-editor-extraction.json
          if-no-files-found: warn
