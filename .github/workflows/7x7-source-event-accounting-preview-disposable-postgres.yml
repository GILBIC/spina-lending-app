name: 7x7 source-event, parity and mobile acceptance disposable PostgreSQL validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0064_add_7x7_source_event_accounting_preview.sql'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_operational_allocator.py'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_collection_posting.py'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_collector_route.py'
      - 'gilbic_backend/src/gilbic_backend/collection_api.py'
      - 'gilbic_backend/src/gilbic_backend/collector_route_api.py'
      - 'gilbic_backend/tests/test_7x7_source_event_accounting_preview_migration.py'
      - 'gilbic_backend/tests/test_7x7_source_event_accounting_preview_postgres.py'
      - 'gilbic_backend/tests/test_seven_by_seven_desktop_server_parity_matrix.py'
      - 'gilbic_backend/tests/test_seven_by_seven_desktop_server_postgres_parity.py'
      - 'gilbic_backend/tests/test_seven_by_seven_mobile_collection_postgres.py'
      - 'gilbic_mobile/lib/src/core/collector/collector_route.dart'
      - 'gilbic_mobile/lib/src/features/collector/collector_route_page.dart'
      - 'gilbic_mobile/lib/src/features/collector/collection_entry_page.dart'
      - 'gilbic_mobile/test/collector_route_collection_gate_test.dart'
      - 'gilbic_mobile/test/collection_entry_page_test.dart'
      - 'spina_app/calculation_rules.py'
      - 'tools/run_7x7_source_event_accounting_preview_disposable_postgres_validation.py'
      - 'tools/7x7-source-event-accounting-preview-live-migration.once'
      - '.github/workflows/7x7-source-event-accounting-preview-disposable-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0064_add_7x7_source_event_accounting_preview.sql'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_operational_allocator.py'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_collection_posting.py'
      - 'gilbic_backend/src/gilbic_backend/seven_by_seven_collector_route.py'
      - 'gilbic_backend/src/gilbic_backend/collection_api.py'
      - 'gilbic_backend/src/gilbic_backend/collector_route_api.py'
      - 'gilbic_backend/tests/test_7x7_source_event_accounting_preview_migration.py'
      - 'gilbic_backend/tests/test_7x7_source_event_accounting_preview_postgres.py'
      - 'gilbic_backend/tests/test_seven_by_seven_desktop_server_parity_matrix.py'
      - 'gilbic_backend/tests/test_seven_by_seven_desktop_server_postgres_parity.py'
      - 'gilbic_backend/tests/test_seven_by_seven_mobile_collection_postgres.py'
      - 'gilbic_mobile/lib/src/core/collector/collector_route.dart'
      - 'gilbic_mobile/lib/src/features/collector/collector_route_page.dart'
      - 'gilbic_mobile/lib/src/features/collector/collection_entry_page.dart'
      - 'gilbic_mobile/test/collector_route_collection_gate_test.dart'
      - 'gilbic_mobile/test/collection_entry_page_test.dart'
      - 'spina_app/calculation_rules.py'
      - 'tools/run_7x7_source_event_accounting_preview_disposable_postgres_validation.py'
      - 'tools/7x7-source-event-accounting-preview-live-migration.once'
      - '.github/workflows/7x7-source-event-accounting-preview-disposable-postgres.yml'

permissions:
  contents: read

concurrency:
  group: seven-by-seven-source-preview-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-seven-by-seven-source-preview:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      X7PREVIEW_PG_PORT: '55451'
      X7PREVIEW_PG_USER: x7preview
      X7PREVIEW_DATABASE_URL: postgresql://x7preview@127.0.0.1:55451/postgres?sslmode=disable

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Define isolated runner paths
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $clusterBase = [System.IO.Path]::GetFullPath(
            (Join-Path $env:RUNNER_TEMP '..\spina-7x7-source-preview-clusters')
          ).TrimEnd('\')
          $runRoot = Join-Path $clusterBase (
            'run-{0}-attempt-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          @(
            "X7PREVIEW_CLUSTER_BASE=$clusterBase",
            "X7PREVIEW_RUN_ROOT=$runRoot",
            "X7PREVIEW_PG_DATA=$(Join-Path $runRoot 'pgdata')",
            "X7PREVIEW_PG_LOG=$(Join-Path $runRoot 'postgres.log')",
            "X7PREVIEW_OWNERSHIP_MARKER=$(Join-Path $runRoot 'cluster-owned.marker')",
            "X7PREVIEW_READY_MARKER=$(Join-Path $runRoot 'cluster-ready.marker')",
            "X7PREVIEW_VENV=$(Join-Path $runRoot 'venv')"
          ) | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Discover local PostgreSQL binaries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgBin = $null
          $initdb = Get-Command initdb.exe -ErrorAction SilentlyContinue
          if ($initdb) { $pgBin = Split-Path -Parent $initdb.Source }
          if (-not $pgBin) {
            foreach ($root in @('C:\Program Files\PostgreSQL', 'C:\Program Files (x86)\PostgreSQL')) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem $root -Directory |
                ForEach-Object { Join-Path $_.FullName 'bin' } |
                Where-Object {
                  (Test-Path (Join-Path $_ 'initdb.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_isready.exe'))
                } | Select-Object -First 1
              if ($candidate) { $pgBin = $candidate; break }
            }
          }
          if (-not $pgBin) { throw 'No local PostgreSQL binaries were found. Refusing to use any remote database.' }
          "X7PREVIEW_PG_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reap orphaned owned 7x7 source-preview clusters
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgCtl = Join-Path $env:X7PREVIEW_PG_BIN 'pg_ctl.exe'
          New-Item -ItemType Directory -Force -Path $env:X7PREVIEW_CLUSTER_BASE | Out-Null
          Get-ChildItem $env:X7PREVIEW_CLUSTER_BASE -Directory -Filter 'run-*-attempt-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              if ($_.FullName -eq $env:X7PREVIEW_RUN_ROOT) { return }
              $marker = Join-Path $_.FullName 'cluster-owned.marker'
              $pgData = Join-Path $_.FullName 'pgdata'
              if (-not (Test-Path $marker) -or -not (Test-Path $pgData)) { return }
              & $pgCtl -D $pgData status 2>$null
              if ($LASTEXITCODE -eq 0) {
                & $pgCtl -D $pgData -m immediate -w stop
                if ($LASTEXITCODE -ne 0) { throw "Failed to stop owned orphan $($_.FullName)." }
              }
              elseif ($LASTEXITCODE -ne 3) { throw "Could not verify owned orphan state at $($_.FullName)." }
              Remove-Item -Recurse -Force $_.FullName
            }

      - name: Initialize isolated temporary PostgreSQL cluster
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:X7PREVIEW_RUN_ROOT) { Remove-Item -Recurse -Force $env:X7PREVIEW_RUN_ROOT }
          New-Item -ItemType Directory -Force -Path $env:X7PREVIEW_RUN_ROOT | Out-Null
          $probe = New-Object System.Net.Sockets.TcpClient
          try {
            $probe.Connect('127.0.0.1', [int]$env:X7PREVIEW_PG_PORT)
            throw "Reserved test port $env:X7PREVIEW_PG_PORT is already in use."
          }
          catch [System.Net.Sockets.SocketException] { }
          finally { $probe.Dispose() }

          $initdb = Join-Path $env:X7PREVIEW_PG_BIN 'initdb.exe'
          $pgCtl = Join-Path $env:X7PREVIEW_PG_BIN 'pg_ctl.exe'
          $pgReady = Join-Path $env:X7PREVIEW_PG_BIN 'pg_isready.exe'
          & $initdb -D $env:X7PREVIEW_PG_DATA -U $env:X7PREVIEW_PG_USER --auth=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed.' }
          "run_id=$env:GITHUB_RUN_ID`npgdata=$env:X7PREVIEW_PG_DATA" |
            Set-Content -Path $env:X7PREVIEW_OWNERSHIP_MARKER -Encoding ascii
          & $pgCtl -D $env:X7PREVIEW_PG_DATA -l $env:X7PREVIEW_PG_LOG -o "-p $env:X7PREVIEW_PG_PORT -h 127.0.0.1" -w start
          if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster failed to start.' }
          & $pgReady -h 127.0.0.1 -p $env:X7PREVIEW_PG_PORT -U $env:X7PREVIEW_PG_USER -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster is not ready.' }
          'ready=true' | Set-Content -Path $env:X7PREVIEW_READY_MARKER -Encoding ascii

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          if not exist "%X7PREVIEW_READY_MARKER%" exit /b 1
          python -m venv "%X7PREVIEW_VENV%" || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9" || exit /b 1

      - name: Compile protected verifier
        shell: cmd
        run: |
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile tools\run_7x7_source_event_accounting_preview_disposable_postgres_validation.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\seven_by_seven_operational_allocator.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\seven_by_seven_collection_posting.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\seven_by_seven_collector_route.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile spina_app\calculation_rules.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_seven_by_seven_mobile_collection_postgres.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_seven_by_seven_desktop_server_parity_matrix.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_seven_by_seven_desktop_server_postgres_parity.py || exit /b 1
          "%X7PREVIEW_VENV%\Scripts\python.exe" -m py_compile gilbic_backend\tests\test_7x7_source_event_accounting_preview_postgres.py || exit /b 1

      - name: Execute protected 7x7 source-event, parity and mobile acceptance proof
        shell: cmd
        run: |
          "%X7PREVIEW_VENV%\Scripts\python.exe" tools\run_7x7_source_event_accounting_preview_disposable_postgres_validation.py --database-url-env X7PREVIEW_DATABASE_URL || exit /b 1

      - name: Stop and delete temporary PostgreSQL cluster
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:X7PREVIEW_PG_BIN -and (Test-Path $env:X7PREVIEW_PG_DATA)) {
            $pgCtl = Join-Path $env:X7PREVIEW_PG_BIN 'pg_ctl.exe'
            & $pgCtl -D $env:X7PREVIEW_PG_DATA status 2>$null
            if ($LASTEXITCODE -eq 0) {
              & $pgCtl -D $env:X7PREVIEW_PG_DATA -m fast -w stop
              if ($LASTEXITCODE -ne 0) { & $pgCtl -D $env:X7PREVIEW_PG_DATA -m immediate -w stop }
            }
          }
          if (Test-Path $env:X7PREVIEW_RUN_ROOT) { Remove-Item -Recurse -Force $env:X7PREVIEW_RUN_ROOT }
          if (Test-Path $env:X7PREVIEW_RUN_ROOT) { throw 'Temporary 7x7 source-preview run directory was not removed.' }

      - name: Require a clean committed tree
        if: always()
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1