name: Bootstrap note editor presentation Wave 40
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  extract:
    if: github.head_ref == 'agent/note-editor-presentation-wave-40'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Extract guarded note editor module
        shell: cmd
        run: python tools/extract_note_editor_presentation_wave_40.py
      - name: Compile and run focused regression
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/note_editor_presentation.py
          python -m py_compile tools/test_note_editor_presentation_wave_40.py
          python -m compileall -q spina_app
          python tools/test_note_editor_presentation_wave_40.py
      - name: Run repository audits before commit
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-40-bootstrap-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-40-bootstrap-quality.json
      - name: Commit extracted code
        shell: cmd
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add spina_app\note_editor_presentation.py
          git add tools\test_note_editor_presentation_wave_40.py
          git add .github\workflows\note-editor-presentation-wave-40.yml
          git diff --cached --stat
          git commit -m "Extract note editor presentation Wave 40"
      - name: Refresh and commit architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh architecture map after Wave 40"
      - name: Push exact-head update
        shell: pwsh
        run: |
          $branch = "${{ github.head_ref }}"
          $expected = "${{ github.event.pull_request.head.sha }}"
          $lease = "refs/heads/${branch}:$expected"
          git push "--force-with-lease=$lease" origin "HEAD:refs/heads/$branch"
