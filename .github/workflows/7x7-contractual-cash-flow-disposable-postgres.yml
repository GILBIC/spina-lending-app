name: 7x7 contractual cash-flow disposable PostgreSQL validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0060_add_7x7_contractual_cash_flow_readiness.sql'
      - 'gilbic_backend/sql/0115_align_7x7_signed_schedule_accounting_authority.sql'
      - 'gilbic_backend/sql/0116_enforce_one_active_7x7_per_client.sql'
      - 'gilbic_backend/sql/0117_add_7x7_pricing_compliance_readiness.sql'
      - 'gilbic_backend/src/gilbic_backend/contract_schedule_registration_api.py'
      - 'gilbic_backend/src/gilbic_backend/contract_schedule_registration_repository.py'
      - 'gilbic_backend/tests/test_7x7_contractual_cash_flow_readiness_migration.py'
      - 'gilbic_backend/tests/test_7x7_contractual_cash_flow_readiness_postgres.py'
      - 'gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_migration.py'
      - 'gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_postgres.py'
      - 'gilbic_backend/tests/test_7x7_one_active_loan_migration.py'
      - 'gilbic_backend/tests/test_7x7_one_active_loan_postgres.py'
      - 'gilbic_backend/tests/test_7x7_pricing_compliance_gate.py'
      - 'gilbic_backend/tests/test_7x7_pricing_compliance_readiness_postgres.py'
      - 'tools/run_7x7_contractual_cash_flow_disposable_postgres_validation.py'
      - '.github/workflows/7x7-contractual-cash-flow-disposable-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0060_add_7x7_contractual_cash_flow_readiness.sql'
      - 'gilbic_backend/sql/0115_align_7x7_signed_schedule_accounting_authority.sql'
      - 'gilbic_backend/sql/0116_enforce_one_active_7x7_per_client.sql'
      - 'gilbic_backend/sql/0117_add_7x7_pricing_compliance_readiness.sql'
      - 'gilbic_backend/src/gilbic_backend/contract_schedule_registration_api.py'
      - 'gilbic_backend/src/gilbic_backend/contract_schedule_registration_repository.py'
      - 'gilbic_backend/tests/test_7x7_contractual_cash_flow_readiness_migration.py'
      - 'gilbic_backend/tests/test_7x7_contractual_cash_flow_readiness_postgres.py'
      - 'gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_migration.py'
      - 'gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_postgres.py'
      - 'gilbic_backend/tests/test_7x7_one_active_loan_migration.py'
      - 'gilbic_backend/tests/test_7x7_one_active_loan_postgres.py'
      - 'gilbic_backend/tests/test_7x7_pricing_compliance_gate.py'
      - 'gilbic_backend/tests/test_7x7_pricing_compliance_readiness_postgres.py'
      - 'tools/run_7x7_contractual_cash-flow-disposable-postgres-validation.py'
      - '.github/workflows/7x7-contractual-cash-flow-disposable-postgres.yml'

permissions:
  contents: read

concurrency:
  group: seven-by-seven-contractual-cash-flow-disposable-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-seven-by-seven-contractual-cash-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      X7CF_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' 'pytest>=8.3,<9'

      - name: Compile protected verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/run_7x7_contractual_cash_flow_disposable_postgres_validation.py
          python -m py_compile gilbic_backend/tests/test_7x7_contractual_cash_flow_readiness_postgres.py
          python -m py_compile gilbic_backend/tests/test_7x7_one_active_loan_postgres.py
          python -m py_compile gilbic_backend/tests/test_7x7_pricing_compliance_readiness_postgres.py
          python -m py_compile gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_migration.py
          python -m py_compile gilbic_backend/tests/test_7x7_one_active_loan_migration.py
          python -m py_compile gilbic_backend/tests/test_7x7_pricing_compliance_gate.py

      - name: Verify Priority 6 migration contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            gilbic_backend/tests/test_7x7_signed_schedule_accounting_alignment_migration.py \
            gilbic_backend/tests/test_7x7_one_active_loan_migration.py \
            gilbic_backend/tests/test_7x7_pricing_compliance_gate.py

      - name: Execute protected 7x7 contractual cash-flow proof
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_7x7_contractual_cash_flow_disposable_postgres_validation.py --database-url-env X7CF_DATABASE_URL

      - name: Require a clean committed tree
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
