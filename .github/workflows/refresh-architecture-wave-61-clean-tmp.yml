name: Temporary clean Wave 61 architecture refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/refresh-architecture-wave-61-clean-tmp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-architecture-wave-61-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-61'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out Wave 61 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Regenerate and validate clean architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit clean architecture maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs\architecture
          git commit -m "Refresh clean architecture maps for Wave 61"
          git push origin HEAD:agent/high-volume-wave-61
