name: Extract account permission Wave 47
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/extract_account_permission_wave_47.py"
      - "tools/run_account_permission_extractor_wave_47.py"
      - ".github/workflows/extract-account-permission-wave-47.yml"
permissions:
  contents: write
jobs:
  extract:
    if: github.head_ref == 'agent/login-support-presentation-wave-47'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile guarded extractor
        shell: cmd
        run: |
          python -m py_compile tools/extract_account_permission_wave_47.py
          python -m py_compile tools/run_account_permission_extractor_wave_47.py
      - name: Apply guarded extraction
        shell: cmd
        run: python tools/run_account_permission_extractor_wave_47.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/account_permission_presentation.py
          python -m py_compile tools/test_account_permission_presentation_wave_47.py
          python -m compileall -q spina_app
      - name: Run Wave 47 regression
        shell: cmd
        run: python tools/test_account_permission_presentation_wave_47.py
      - name: Run protected login and header regressions
        shell: cmd
        run: |
          python tools/test_login_dialog_presentation_wave_45.py
          python tools/test_login_dialog_widget_smoke_wave_45.py
          python tools/test_account_header_presentation_wave_46.py
          python tools/test_account_header_widget_smoke_wave_46.py
          python tools/test_tk_shutdown_wave_46.py
          python tools/test_login_cancel_startup_wave_46.py
      - name: Remove temporary Wave 47 files
        shell: cmd
        run: |
          git rm tools/inspect_login_support_wave_47.py
          git rm tools/extract_account_permission_wave_47.py
          git rm tools/run_account_permission_extractor_wave_47.py
          git rm .github/workflows/inspect-login-support-wave-47.yml
          git rm .github/workflows/extract-account-permission-wave-47.yml
      - name: Generate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-47-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-47-quality.json
      - name: Commit guarded Wave 47 extraction
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/account_permission_presentation.py tools/test_account_permission_presentation_wave_47.py architecture-map.json docs/architecture
          git commit -m "Extract account permission presentation Wave 47"
          git push origin HEAD:${{ github.head_ref }}
