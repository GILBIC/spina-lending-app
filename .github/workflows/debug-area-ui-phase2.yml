name: Debug hierarchical Area UI Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture validation output
        run: |
          set +e
          {
            python -m py_compile \
              spina_app/area_hierarchy.py \
              spina_app/area_hierarchy_ops.py \
              spina_app/area_hierarchy_ui.py \
              tools/apply_hierarchical_area_ui_phase2.py \
              tools/test_hierarchical_area_ui_phase2.py \
              tools/test_hierarchical_area_ui_phase2_source.py
            echo "compile_status=$?"
            python tools/apply_hierarchical_area_ui_phase2.py
            echo "guard_status=$?"
            python tools/test_hierarchical_area_ui_phase2.py
            echo "ops_status=$?"
          } > tools/fixtures/area_ui_phase2_debug.txt 2>&1
          cat tools/fixtures/area_ui_phase2_debug.txt
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/area_ui_phase2_debug.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Phase 2 validation output"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
