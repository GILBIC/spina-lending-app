name: Inspect Data Bank presentation boundary Wave 49
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_databank_presentation_boundary_wave_49.py"
      - ".github/workflows/inspect-databank-presentation-boundary-wave-49.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/databank-dashboard-presentation-wave-49'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_databank_presentation_boundary_wave_49.py
      - name: Inspect Data Bank presentation boundary
        shell: cmd
        run: python tools/inspect_databank_presentation_boundary_wave_49.py
      - name: Upload Wave 49 boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-49-databank-presentation-boundary
          path: artifacts/wave-49-databank-presentation-boundary.json
