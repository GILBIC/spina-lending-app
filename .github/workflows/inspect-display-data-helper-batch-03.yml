name: Inspect display data helper batch 03

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/display-data-helper-batch-03-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact current helper sources
        run: |
          python - <<'PY'
          import ast
          import builtins
          import hashlib
          import json
          from pathlib import Path

          app = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = app.read_text(encoding='utf-8')
          tree = ast.parse(source)
          names = [
              '_spina_dash__status_for',
              '_spina_perf_dict_rows',
              '_spina_crc_fmt_money',
          ]

          def external_names(node):
              local = {a.arg for a in (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)}
              if node.args.vararg:
                  local.add(node.args.vararg.arg)
              if node.args.kwarg:
                  local.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, (ast.Store, ast.Del)):
                      local.add(child.id)
              loaded = {
                  child.id for child in ast.walk(node)
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Load)
              }
              return sorted(loaded - local - set(dir(builtins)) - {node.name})

          report = {}
          for name in names:
              matches = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name]
              if len(matches) != 1:
                  report[name] = {'definition_count': len(matches)}
                  continue
              node = matches[0]
              exact = ast.get_source_segment(source, node)
              report[name] = {
                  'line': node.lineno,
                  'end_line': node.end_lineno,
                  'signature': ast.unparse(node.args),
                  'external_names': external_names(node),
                  'source_sha256': hashlib.sha256(exact.encode('utf-8')).hexdigest(),
                  'source': exact,
              }

          out = Path('tools/fixtures/display_data_helper_batch_03_inspection.json')
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/display_data_helper_batch_03_inspection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect display data helper batch"
          git push origin HEAD:agent/display-data-helper-batch-03-work
