name: Data Bank modularization Wave 82

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/**/*databank*.py"
      - "spina_app/**/*data_bank*.py"
      - "spina_app/features/data_bank.py"
      - "spina_app/repositories/data_bank.py"
      - "spina_app/services/data_bank.py"
      - "tools/*databank*wave_82.py"
      - "docs/databank-modularization-wave-82.md"
      - ".github/workflows/databank-modularization-wave-82.yml"
  workflow_dispatch:

concurrency:
  group: databank-wave-82-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Check out exact Wave 82 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compile inventory tool and desktop application
        shell: cmd
        run: |
          python -m py_compile tools\inspect_databank_modularization_wave_82.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\tabs\data_bank_shell.py

      - name: Inventory active Data Bank runtime
        shell: cmd
        run: python tools\inspect_databank_modularization_wave_82.py

      - name: Check clean tree
        shell: cmd
        run: git diff --check

      - name: Upload Data Bank inventory
        uses: actions/upload-artifact@v4
        with:
          name: databank-wave-82-inventory
          path: artifacts/databank-wave-82-inventory.json
          if-no-files-found: error
