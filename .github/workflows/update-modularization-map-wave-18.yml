name: Update modularization map Wave 18

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-map:
    if: github.head_ref == 'agent/feature-module-wave-18'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out Wave 18 branch
        uses: actions/checkout@v4
        with:
          ref: agent/feature-module-wave-18
          fetch-depth: 0

      - name: Update permanent map
        shell: cmd
        run: python tools\update_modularization_map_wave_18.py

      - name: Commit updated map
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\modularization-map.md
          git diff --cached --quiet && exit /b 0
          git commit -m "Document modularization Wave 18 [skip ci]"
          git push origin HEAD:agent/feature-module-wave-18
