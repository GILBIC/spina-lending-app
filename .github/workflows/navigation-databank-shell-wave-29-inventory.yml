name: Navigation and Data Bank shell Wave 29 inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/navigation-databank-shell-wave-29'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile and inventory Wave 29 target
        shell: cmd
        run: |
          python -m py_compile tools/inventory_navigation_databank_shell_wave_29.py
          python -m tools.inventory_navigation_databank_shell_wave_29

      - name: Upload Wave 29 inventory
        uses: actions/upload-artifact@v4
        with:
          name: navigation-databank-shell-wave-29-inventory
          path: artifacts/navigation-databank-shell-wave-29-inventory.json
          if-no-files-found: error
