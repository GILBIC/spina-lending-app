name: Remove legacy collector presentation Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/collector_tab_presentation.py"
      - "tools/test_collector_tab_presentation_wave_44.py"
      - "tools/test_legacy_collector_cleanup_wave_50.py"
      - "tools/remove_legacy_collector_presentation_wave_50.py"
      - ".github/workflows/remove-legacy-collector-presentation-wave-50.yml"
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'agent/high-volume-presentation-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile guarded remover and tests
        shell: cmd
        run: |
          python -m py_compile tools/remove_legacy_collector_presentation_wave_50.py
          python -m py_compile tools/test_legacy_collector_cleanup_wave_50.py
          python -m py_compile tools/test_collector_tab_presentation_wave_44.py
      - name: Remove exact legacy collector presentation
        shell: cmd
        run: python tools/remove_legacy_collector_presentation_wave_50.py
      - name: Compile application and collector presentation
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/collector_tab_presentation.py
          python -m py_compile tools/test_collector_tab_widget_smoke_wave_44.py
          python -m compileall -q spina_app
      - name: Run exact Wave 50 cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_collector_cleanup_wave_50
      - name: Run updated active collector-tab regression
        shell: cmd
        run: python -m tools.test_collector_tab_presentation_wave_44
      - name: Run active Collector Route Tkinter smoke test
        shell: cmd
        run: python -m tools.test_collector_tab_widget_smoke_wave_44
      - name: Run protected collector regressions
        shell: cmd
        run: |
          python -m tools.test_collectors_editor_wave_26
          python -m tools.test_collector_refresh_presentation_wave_39
          python -m tools.test_collector_dialog_presentation_wave_43
      - name: Run protected navigation regression
        shell: cmd
        run: |
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48
      - name: Remove temporary Wave 50 files
        shell: cmd
        run: |
          git rm tools/plan_high_volume_presentation_wave_50.py
          git rm tools/inspect_remaining_presentation_families_wave_50.py
          git rm tools/inspect_legacy_collector_presentation_wave_50.py
          git rm tools/remove_legacy_collector_presentation_wave_50.py
          git rm tools/diagnose_legacy_collector_removal_wave_50.py
          git rm .github/workflows/plan-high-volume-presentation-wave-50.yml
          git rm .github/workflows/inspect-remaining-presentation-families-wave-50.yml
          git rm .github/workflows/inspect-legacy-collector-presentation-wave-50.yml
          git rm .github/workflows/diagnose-legacy-collector-removal-wave-50.yml
          git rm .github/workflows/remove-legacy-collector-presentation-wave-50.yml
      - name: Generate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-50-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-50-quality.json
      - name: Commit guarded Wave 50 cleanup
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py tools/test_collector_tab_presentation_wave_44.py tools/test_legacy_collector_cleanup_wave_50.py architecture-map.json docs/architecture
          git commit -m "Remove legacy collector presentation Wave 50"
          git push origin HEAD:${{ github.head_ref }}
