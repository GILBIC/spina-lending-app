name: Client Info Logs modularization Wave 78

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/features/client_info_logs.py"
      - "spina_app/repositories/client_info_logs.py"
      - "spina_app/services/client_info_logs.py"
      - "spina_app/tabs/client_info_logs.py"
      - "tools/apply_client_info_logs_modularization_wave_78.py"
      - "tools/test_client_info_logs_layers_wave_78.py"
      - "tools/test_client_info_logs_feature_wave_78.py"
      - "tools/test_client_info_logs_extraction_wave_78.py"
      - "docs/client-info-logs-modularization-wave-78.md"
      - ".github/workflows/client-info-logs-modularization-wave-78.yml"
  workflow_dispatch:

concurrency:
  group: client-info-logs-wave-78-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      wave78: ${{ steps.architecture.outputs.wave78 }}

    steps:
      - name: Check out exact Wave 78 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed Client Info Logs architecture
        id: architecture
        shell: cmd
        run: |
          python -c "import os; from pathlib import Path; marker='# --- BEGIN: Client Info Logs feature installer Wave 78 ---'; source=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py').read_text(encoding='utf-8'); value='true' if marker in source else 'false'; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(f'wave78={value}\n'); print(f'Wave 78 architecture detected: {value}')"

      - name: Compile Wave 78 layers, tools, and desktop app
        shell: cmd
        run: |
          python -m py_compile spina_app\features\client_info_logs.py
          python -m py_compile spina_app\repositories\client_info_logs.py
          python -m py_compile spina_app\services\client_info_logs.py
          python -m py_compile spina_app\tabs\client_info_logs.py
          python -m py_compile tools\apply_client_info_logs_modularization_wave_78.py
          python -m py_compile tools\test_client_info_logs_layers_wave_78.py
          python -m py_compile tools\test_client_info_logs_feature_wave_78.py
          python -m py_compile tools\test_client_info_logs_extraction_wave_78.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Run Client Info Logs repository and service regressions
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_layers_wave_78.py

      - name: Run Client Info Logs installer regression
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_feature_wave_78.py

      - name: Confirm committed source is clean before generation
        shell: cmd
        run: git diff --exit-code -- OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Apply guarded Client Info Logs extraction twice
        if: steps.architecture.outputs.wave78 != 'true'
        shell: cmd
        run: |
          python tools\apply_client_info_logs_modularization_wave_78.py
          python tools\apply_client_info_logs_modularization_wave_78.py

      - name: Compile validated desktop application
        shell: cmd
        run: python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Run Client Info Logs extraction regression
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_extraction_wave_78.py

      - name: Run Cash Control Wave 77 regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_layers_wave_77.py
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_feature_wave_77.py
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_extraction_wave_77.py

      - name: Run Dashboard Wave 76 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_full_dashboard_modularization_wave_76.py

      - name: Run Wave 75 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py

      - name: Run Wave 74 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py

      - name: Check validated diff
        shell: cmd
        run: git diff --check

      - name: Upload validated Client Info Logs app
        uses: actions/upload-artifact@v4
        with:
          name: client-info-logs-wave-78-generated
          path: OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if-no-files-found: error

  publish-generated:
    name: publish-generated
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.wave78 != 'true' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out exact validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated generated app
        uses: actions/download-artifact@v4
        with:
          name: client-info-logs-wave-78-generated
          path: generated-wave78

      - name: Verify artifact and restrict publish scope
        shell: cmd
        run: |
          python -c "from pathlib import Path; app=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py'); generated=Path('generated-wave78')/app.name; source=generated.read_text(encoding='utf-8'); assert source.count('# --- BEGIN: Client Info Logs feature installer Wave 78 ---') == 1; assert '# --- BEGIN: Easy Client Info Logs tab ---' not in source; assert '# --- BEGIN: v24 Modern Client Info Logs UI ---' not in source; app.write_bytes(generated.read_bytes())"
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git diff --check
          python -c "import subprocess; app='OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py'; names=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines(); assert names == [app], names"

      - name: Commit validated production wiring
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git commit -m "Apply Client Info Logs modularization Wave 78"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
