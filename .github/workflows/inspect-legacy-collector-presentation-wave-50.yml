name: Inspect legacy collector presentation Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_legacy_collector_presentation_wave_50.py"
      - ".github/workflows/inspect-legacy-collector-presentation-wave-50.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/high-volume-presentation-wave-50'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        run: python -m py_compile tools/inspect_legacy_collector_presentation_wave_50.py
      - name: Inspect legacy collector presentation boundary
        run: python tools/inspect_legacy_collector_presentation_wave_50.py
      - name: Upload Wave 50 collector boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-legacy-collector-boundary
          path: artifacts/wave-50-legacy-collector-boundary.json
