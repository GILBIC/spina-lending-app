name: Wave 65 Final Verifier

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/wave65-final-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave65-final-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-65'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 65 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, module, tests, and package
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\settings_dialog_presentation.py
          python -m py_compile tools\test_settings_dialog_presentation_wave_65.py
          python -m py_compile tools\test_settings_dialog_widget_smoke_wave_65.py
          python -m py_compile tools\test_architecture_map.py
          python -m compileall -q spina_app

      - name: Run focused Wave 65 regressions
        shell: cmd
        run: |
          python -m tools.test_settings_dialog_presentation_wave_65
          python -m tools.test_settings_dialog_widget_smoke_wave_65

      - name: Run protected theme and navigation regressions
        shell: cmd
        run: |
          python tools\test_theme_presentation_wave_35.py
          python tools\test_navigation_databank_shell_wave_29.py
          python tools\test_side_navigation_presentation_wave_48.py
          python tools\test_side_navigation_widget_smoke_wave_48.py

      - name: Run protected Reports and Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_reports_tab_presentation_wave_64
          python -m tools.test_reports_tab_widget_smoke_wave_64
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_delete_day_password_gate_wave_63

      - name: Validate committed architecture maps
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-65-final-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-65-final-quality.json

      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-65-final-verifier-reports
          path: artifacts/wave-65-final-*.json
          if-no-files-found: warn
