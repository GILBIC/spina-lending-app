name: Extract Data Bank grid Wave 59

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/extract_databank_grid_wave59_tmp.py"
      - ".github/workflows/extract-databank-grid-wave-59.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-databank-grid-wave-59-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-59'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 59 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-59
          fetch-depth: 0
          show-progress: false
      - name: Extract guarded Data Bank grid boundary
        shell: cmd
        run: python tools\extract_databank_grid_wave59_tmp.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_grid_presentation.py
          python -m py_compile tools\test_databank_grid_presentation_wave_59.py
          python -m py_compile tools\test_databank_grid_widget_smoke_wave_59.py
          python -m compileall -q spina_app
      - name: Run exact Data Bank grid extraction regression
        shell: cmd
        run: python -m tools.test_databank_grid_presentation_wave_59
      - name: Run real Tkinter Data Bank grid behavior test
        shell: cmd
        run: python -m tools.test_databank_grid_widget_smoke_wave_59
      - name: Run protected Data Bank and System Data regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_databank_presentation_wave_49
          python -m tools.test_databank_widget_smoke_wave_49
          python -m tools.test_ui_button_factories_wave_50
          python -m tools.test_databank_import_control_wave_53
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_audit_presentation_wave_54
          python -m tools.test_system_data_presentation_wave_56
          python -m tools.test_system_data_widget_smoke_wave_56
          python -m tools.test_databank_close_history_presentation_wave_57
          python -m tools.test_databank_close_history_widget_smoke_wave_57
          python -m tools.test_system_data_summary_presentation_wave_58
          python -m tools.test_system_data_summary_widget_smoke_wave_58
      - name: Commit extracted application boundary
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_grid_presentation.py tools\test_databank_grid_presentation_wave_59.py tools\test_databank_grid_widget_smoke_wave_59.py
          git diff --cached --quiet || git commit -m "Extract Data Bank grid presentation Wave 59"
          git push origin HEAD:agent/high-volume-wave-59
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        shell: cmd
        run: |
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 59 architecture maps"
          git push origin HEAD:agent/high-volume-wave-59
      - name: Upload Wave 59 extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-grid-wave-59-extraction
          path: artifacts/wave-59-databank-grid-extraction.json
          if-no-files-found: warn
