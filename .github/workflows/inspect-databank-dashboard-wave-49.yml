name: Inspect Data Bank dashboard Wave 49
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_databank_dashboard_batch_wave_49.py"
      - ".github/workflows/inspect-databank-dashboard-wave-49.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/databank-dashboard-presentation-wave-49'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        run: python -m py_compile tools/inspect_databank_dashboard_batch_wave_49.py
      - name: Inspect Data Bank dashboard block
        run: python tools/inspect_databank_dashboard_batch_wave_49.py
      - name: Upload Wave 49 inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-49-databank-dashboard-inspection
          path: artifacts/wave-49-databank-dashboard-inspection.json
