name: Sidebar startup static Wave 87

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/features/side_navigation.py"
      - "tools/test_login_cancel_startup_wave_46.py"
      - ".github/workflows/sidebar-cleanup-static-wave-87.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-startup-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile startup architecture
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/features/side_navigation.py
          python -m py_compile tools/test_login_cancel_startup_wave_46.py

      - name: Validate modular startup cancellation
        run: python tools/test_login_cancel_startup_wave_46.py

      - name: Require clean committed tree
        run: git diff --exit-code
