name: Sidebar cleanup static Wave 87

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/features/side_navigation.py"
      - "spina_app/side_navigation_presentation.py"
      - "spina_app/account_header_presentation.py"
      - "tools/test_sidebar_cleanup_wave_87.py"
      - "tools/test_side_navigation_feature_wave_86.py"
      - "tools/test_side_navigation_presentation_wave_48.py"
      - "tools/test_navigation_compatibility_wave_86.py"
      - "tools/test_login_cancel_startup_wave_46.py"
      - ".github/workflows/sidebar-cleanup-static-wave-87.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile cleaned sidebar architecture
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/features/side_navigation.py
          python -m py_compile spina_app/side_navigation_presentation.py
          python -m py_compile spina_app/account_header_presentation.py
          python -m py_compile tools/test_sidebar_cleanup_wave_87.py
          python -m py_compile tools/test_side_navigation_feature_wave_86.py
          python -m py_compile tools/test_side_navigation_presentation_wave_48.py
          python -m py_compile tools/test_navigation_compatibility_wave_86.py
          python -m py_compile tools/test_login_cancel_startup_wave_46.py

      - name: Run static sidebar and startup regressions
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tools/test_sidebar_cleanup_wave_87.py
          python tools/test_side_navigation_feature_wave_86.py
          python tools/test_side_navigation_presentation_wave_48.py
          python tools/test_navigation_compatibility_wave_86.py
          python tools/test_login_cancel_startup_wave_46.py
          python tools/test_accounts_cleanup_wave_84.py
          python tools/test_accounts_validation_wave_85.py
          python -m tools.test_architecture_map

      - name: Require clean committed tree
        run: git diff --exit-code
