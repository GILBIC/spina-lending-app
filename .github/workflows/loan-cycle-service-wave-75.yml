name: Loan cycle service Wave 75
# Revalidate the committed Wave 75 rules directly or through newer Dashboard layers.

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/calculation_rules.py"
      - "spina_app/repositories/**"
      - "spina_app/services/**"
      - "spina_app/utilities/dashboard.py"
      - "tools/apply_loan_cycle_service_wave_75.py"
      - "tools/test_loan_cycle_service_wave_75.py"
      - "tools/test_calculation_regressions_wave_74.py"
      - "tools/test_wave74_compat_under_wave75.py"
      - "tools/test_wave74_compat_under_wave76.py"
      - "tools/test_wave75_compat_under_wave76.py"
      - "tools/test_wave28_compat_under_wave76.py"
      - ".github/workflows/loan-cycle-service-wave-75.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    # Persistent-runner execution is limited to owner-authored same-repository PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out Wave 75 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect Dashboard architecture
        shell: cmd
        run: |
          findstr /C:"# --- BEGIN: Dashboard feature installer Wave 76 ---" OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py >nul
          if errorlevel 1 (echo SPINA_DASHBOARD_WAVE76=0>>"%GITHUB_ENV%") else (echo SPINA_DASHBOARD_WAVE76=1>>"%GITHUB_ENV%")

      - name: Compile Wave 75 service and tools
        shell: cmd
        run: |
          python -m py_compile spina_app\services\__init__.py
          python -m py_compile spina_app\services\loan_cycles.py
          python -m py_compile tools\apply_loan_cycle_service_wave_75.py
          python -m py_compile tools\test_loan_cycle_service_wave_75.py
          python -m py_compile tools\test_wave74_compat_under_wave75.py
          if exist tools\test_wave74_compat_under_wave76.py python -m py_compile tools\test_wave74_compat_under_wave76.py
          if exist tools\test_wave75_compat_under_wave76.py python -m py_compile tools\test_wave75_compat_under_wave76.py
          if exist tools\test_wave28_compat_under_wave76.py python -m py_compile tools\test_wave28_compat_under_wave76.py

      - name: Apply guarded loan cycle wiring
        shell: cmd
        run: |
          if "%SPINA_DASHBOARD_WAVE76%"=="1" (echo Wave 76 already delegates loan-cycle wiring.) else (python tools\apply_loan_cycle_service_wave_75.py)

      - name: Compile updated desktop application
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\services\loan_cycles.py

      - name: Run Wave 75 service regressions
        shell: cmd
        run: |
          if "%SPINA_DASHBOARD_WAVE76%"=="1" (set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py) else (set "PYTHONPATH=%CD%" && python tools\test_loan_cycle_service_wave_75.py)

      - name: Run Wave 74 compatibility regressions
        shell: cmd
        run: |
          if "%SPINA_DASHBOARD_WAVE76%"=="1" (set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py) else (set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave75.py)

      - name: Run Dashboard presentation compatibility
        shell: cmd
        run: |
          if "%SPINA_DASHBOARD_WAVE76%"=="1" (set "PYTHONPATH=%CD%" && python tools\test_wave28_compat_under_wave76.py) else (if exist tools\test_dashboard_presentation_wave_28.py set "PYTHONPATH=%CD%" && python tools\test_dashboard_presentation_wave_28.py)

      - name: Check generated diff
        shell: cmd
        run: git diff --check

      - name: Commit validated production wiring
        shell: cmd
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git diff --quiet -- OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py && (echo Wave 75 production wiring is already applied. & exit /b 0)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git commit -m "Wire loan cycle service Wave 75"
          git push origin "HEAD:%TARGET_BRANCH%"
