name: Loan cycle service Wave 75
# Revalidate the committed Wave 75 rules directly or through newer Dashboard layers.

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/calculation_rules.py"
      - "spina_app/repositories/**"
      - "spina_app/services/**"
      - "spina_app/utilities/dashboard.py"
      - "tools/apply_loan_cycle_service_wave_75.py"
      - "tools/test_loan_cycle_service_wave_75.py"
      - "tools/test_calculation_regressions_wave_74.py"
      - "tools/test_wave74_compat_under_wave75.py"
      - "tools/test_wave74_compat_under_wave76.py"
      - "tools/test_wave75_compat_under_wave76.py"
      - "tools/test_wave28_compat_under_wave76.py"
      - ".github/workflows/loan-cycle-service-wave-75.yml"
  workflow_dispatch:

concurrency:
  group: loan-cycle-wave-75-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply-and-validate:
    # Persistent-runner execution is limited to the repository owner and trusted refs.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out Wave 75 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Dashboard architecture
        id: architecture
        shell: cmd
        run: |
          python -c "import os; from pathlib import Path; marker='# --- BEGIN: Dashboard feature installer Wave 76 ---'; source=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py').read_text(encoding='utf-8'); value='true' if marker in source else 'false'; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write(f'wave76={value}\n'); print(f'Wave 76 architecture detected: {value}')"

      - name: Compile Wave 75 service and tools
        shell: cmd
        run: |
          python -m py_compile spina_app\services\__init__.py
          python -m py_compile spina_app\services\loan_cycles.py
          python -m py_compile tools\apply_loan_cycle_service_wave_75.py
          python -m py_compile tools\test_loan_cycle_service_wave_75.py
          python -m py_compile tools\test_wave74_compat_under_wave75.py
          if exist tools\test_wave74_compat_under_wave76.py python -m py_compile tools\test_wave74_compat_under_wave76.py
          if exist tools\test_wave75_compat_under_wave76.py python -m py_compile tools\test_wave75_compat_under_wave76.py
          if exist tools\test_wave28_compat_under_wave76.py python -m py_compile tools\test_wave28_compat_under_wave76.py

      - name: Apply guarded loan cycle wiring
        if: steps.architecture.outputs.wave76 != 'true'
        shell: cmd
        run: python tools\apply_loan_cycle_service_wave_75.py

      - name: Confirm Wave 76 loan-cycle delegation
        if: steps.architecture.outputs.wave76 == 'true'
        shell: cmd
        run: echo Wave 76 already delegates loan-cycle wiring.

      - name: Compile updated desktop application
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\services\loan_cycles.py

      - name: Run Wave 75 service regressions
        if: steps.architecture.outputs.wave76 != 'true'
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_loan_cycle_service_wave_75.py

      - name: Run Wave 75 compatibility under Wave 76
        if: steps.architecture.outputs.wave76 == 'true'
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py

      - name: Run Wave 74 compatibility under Wave 75
        if: steps.architecture.outputs.wave76 != 'true'
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave75.py

      - name: Run Wave 74 compatibility under Wave 76
        if: steps.architecture.outputs.wave76 == 'true'
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py

      - name: Run legacy Dashboard presentation regression
        if: steps.architecture.outputs.wave76 != 'true'
        shell: cmd
        run: if exist tools\test_dashboard_presentation_wave_28.py set "PYTHONPATH=%CD%" && python tools\test_dashboard_presentation_wave_28.py

      - name: Run Dashboard presentation compatibility under Wave 76
        if: steps.architecture.outputs.wave76 == 'true'
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave28_compat_under_wave76.py

      - name: Check generated diff
        shell: cmd
        run: git diff --check

      - name: Require committed production wiring
        shell: cmd
        run: git diff --exit-code -- OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
