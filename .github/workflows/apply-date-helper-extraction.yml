name: Apply date helper extraction

on:
  push:
    branches:
      - agent/extract-date-helpers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guarded extractor and test
        run: |
          python -m py_compile \
            tools/extract_date_helpers_module.py \
            tools/test_date_helpers_extraction.py

      - name: Test original state and write behavior fixture
        run: |
          python tools/test_date_helpers_extraction.py \
            --write-fixture tools/fixtures/date_helpers_behavior.json

      - name: Run guarded dry-run
        run: |
          python tools/extract_date_helpers_module.py \
            --json /tmp/date-helper-extraction-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('/tmp/date-helper-extraction-plan.json').read_text(encoding='utf-8')
          )
          assert result['safe_to_apply'] is True
          assert result['targets']
          PY

      - name: Apply guarded extraction
        run: |
          python tools/extract_date_helpers_module.py \
            --apply \
            --json /tmp/date-helper-extraction-result.json

      - name: Validate extracted state
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/dates.py \
            tools/extract_date_helpers_module.py \
            tools/test_date_helpers_extraction.py
          python tools/test_date_helpers_extraction.py
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('/tmp/date-helper-extraction-result.json').read_text(encoding='utf-8')
          )
          assert result['safe_to_apply'] is True
          assert result.get('applied') is True or result.get('already_applied') is True
          PY

      - name: Commit generated extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/dates.py \
            tools/fixtures/date_helpers_behavior.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Extract pure date helpers"
          git push origin HEAD:${GITHUB_REF_NAME}
