name: Bootstrap account header presentation Wave 46
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: bootstrap-account-header-presentation-wave-46-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  extract:
    if: github.head_ref == 'agent/account-header-presentation-wave-46'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile guarded extractor
        shell: cmd
        run: python -m py_compile .github/scripts/extract_account_header_presentation_wave_46.py
      - name: Extract guarded account header presentation
        shell: cmd
        run: |
          set PYTHONIOENCODING=utf-8
          python .github/scripts/extract_account_header_presentation_wave_46.py
      - name: Compile generated application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/account_header_presentation.py
          python -m py_compile tools/test_account_header_presentation_wave_46.py
          python -m py_compile tools/test_account_header_widget_smoke_wave_46.py
          python -m compileall -q spina_app
      - name: Run exact Wave 46 regression
        shell: cmd
        run: python tools/test_account_header_presentation_wave_46.py
      - name: Run account header Tkinter smoke test
        shell: cmd
        run: python tools/test_account_header_widget_smoke_wave_46.py
      - name: Run repository audits before commit
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-46-bootstrap-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-46-bootstrap-quality.json
      - name: Configure commit identity
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit permanent Wave 46 Python extraction
        shell: cmd
        run: |
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/account_header_presentation.py tools/test_account_header_presentation_wave_46.py tools/test_account_header_widget_smoke_wave_46.py
          git diff --cached --quiet || git commit -m "Extract account header presentation Wave 46"
      - name: Remove temporary Wave 46 Python discovery files
        shell: cmd
        run: git rm tools/inspect_account_header_wave_46.py .github/scripts/extract_account_header_presentation_wave_46.py
      - name: Generate clean architecture maps
        shell: cmd
        run: python -m tools.generate_architecture_map
      - name: Validate clean architecture maps
        shell: cmd
        run: python -m tools.test_architecture_map
      - name: Commit Wave 46 cleanup and architecture maps
        shell: cmd
        run: |
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh architecture maps for Wave 46 [skip ci]"
      - name: Push permanent Wave 46 Python branch state
        shell: cmd
        run: git push origin HEAD:${{ github.head_ref }}
