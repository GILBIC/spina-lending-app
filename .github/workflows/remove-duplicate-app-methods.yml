name: Guarded duplicate App method cleanup

on:
  push:
    branches: [cleanup/duplicate-app-methods]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: cleanup/duplicate-app-methods

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run guarded duplicate-method cleanup
        run: python tools/remove_duplicate_app_methods.py

      - name: Compile and audit
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            tools/redundancy_audit.py \
            tools/spina_quality_audit.py \
            tools/spina_startup_diagnostics.py
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json redundancy-report.json
          python tools/spina_quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json quality-report.json

      - name: Verify duplicate App methods are removed
        run: |
          python - <<'PY'
          import json
          data = json.load(open('quality-report.json', encoding='utf-8'))
          app_dupes = data.get('duplicate_class_methods', {}).get('App', {})
          targets = {'_get_selected_report_client', '_auto_load_report_note'}
          remaining = targets.intersection(app_dupes)
          if remaining:
              raise SystemExit(f'Target duplicate App methods still present: {sorted(remaining)}')
          print('Target duplicate App methods removed.')
          PY

      - name: Remove temporary cleanup automation
        run: |
          git rm .github/workflows/remove-duplicate-app-methods.yml tools/remove_duplicate_app_methods.py

      - name: Commit cleanup result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Remove shadowed App method definitions"
            git push origin cleanup/duplicate-app-methods
          fi
