# Repository-triggered rerun after the candidate report stabilized.
name: Wave 68 Clean Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/finalize_wave68.py"
      - ".github/workflows/wave68-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave68-clean-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-68'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 68 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Remove temporary files and write permanent workflow
        shell: cmd
        run: |
          python -m py_compile tools\finalize_wave68.py
          python -m tools.finalize_wave68

      - name: Compile final application tree
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\backup_history_presentation.py
          python -m py_compile tools\test_backup_history_presentation_wave_68.py
          python -m py_compile tools\test_backup_history_widget_smoke_wave_68.py
          python -m py_compile tools\test_long_task_presentation_wave_42.py
          python -m compileall -q spina_app

      - name: Run focused and protected regressions
        shell: cmd
        run: |
          python -m tools.test_backup_history_presentation_wave_68
          python -m tools.test_backup_history_widget_smoke_wave_68
          python tools\test_long_task_presentation_wave_42.py

      - name: Regenerate and validate clean architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-68-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-68-quality.json

      - name: Commit clean permanent Wave 68 tree
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 1
          git commit -m "Finalize backup history presentation Wave 68"
          git push origin HEAD:${{ github.head_ref }}
