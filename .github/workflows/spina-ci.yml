name: SPINA CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spina-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.44.7"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  backend:
    name: Backend, quality, and security
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out exact revision and history
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            gilbic_backend/pyproject.toml
            spina_backend_mobile/pyproject.toml
            requirements.txt

      - name: Install backend, test, quality, and security dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            -e './spina_backend_mobile[test]' \
            -e './gilbic_backend[test]' \
            'ruff==0.16.8' \
            'pyright==1.1.414' \
            'pytest-cov>=6,<8' \
            'bandit==1.9.4' \
            'pip-audit>=2.8,<3'
          mkdir -p ci-artifacts/backend

      - name: Compile Python sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m compileall -q spina_app gilbic_backend/src spina_backend_mobile/src tools

      - name: Ruff lint baseline
        id: ruff_lint
        shell: bash
        run: |
          set +e
          ruff check gilbic_backend/src gilbic_backend/tests spina_backend_mobile/src spina_backend_mobile/tests \
            --output-format json --output-file ci-artifacts/backend/ruff.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Ruff format baseline
        id: ruff_format
        shell: bash
        run: |
          set +e
          ruff format --check gilbic_backend/src gilbic_backend/tests spina_backend_mobile/src spina_backend_mobile/tests \
            > ci-artifacts/backend/ruff-format.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then
            cat ci-artifacts/backend/ruff-format.txt
            exit "$code"
          fi

      - name: Pyright typed-code baseline
        id: pyright
        shell: bash
        run: |
          set +e
          pyright --outputjson gilbic_backend/src/gilbic_backend spina_backend_mobile/src/spina_mobile_collections \
            > ci-artifacts/backend/pyright.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then
            cat ci-artifacts/backend/pyright.json
            exit "$code"
          fi

      - name: Bandit security baseline
        id: bandit
        shell: bash
        run: |
          set +e
          bandit -r gilbic_backend/src spina_backend_mobile/src -f json -o ci-artifacts/backend/bandit.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Dependency vulnerability baseline
        id: pip_audit
        shell: bash
        run: |
          set +e
          pip-audit --local --skip-editable -f json -o ci-artifacts/backend/pip-audit.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks"
          rm -rf "$tool_dir"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version
          echo "GITLEAKS_EXE=$tool_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Gitleaks full-history baseline
        id: gitleaks
        shell: bash
        run: |
          set -uo pipefail
          report="ci-artifacts/backend/gitleaks-redacted.json"
          log="ci-artifacts/backend/gitleaks-redacted.txt"
          rm -f "$report" "$log"
          set +e
          "$GITLEAKS_EXE" git --redact=100 --verbose --no-banner \
            --report-format json --report-path "$report" . > "$log" 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -ne 1 ] || [ ! -s "$report" ]; then
            cat "$log"
            echo "Gitleaks scanner/runtime failure with exit code $code."
            exit "${code:-2}"
          fi
          python - "$report" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          findings = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(findings, list) or not findings:
              raise SystemExit("Gitleaks returned findings status without a valid findings report")
          print(f"Gitleaks reported {len(findings)} fully redacted baseline finding(s).")
          PY

      - name: Reject scanner regressions against retained evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_release_scanner_regressions.py \
            --reports-dir ci-artifacts/backend \
            --baseline docs/release/scanner-baseline.json \
            --output ci-artifacts/backend/scanner-regressions.json

      - name: Validate deployment script and contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/digitalocean/bootstrap.sh
          python tools/test_digitalocean_deployment_contract.py

      - name: Run Python test suite once with coverage and timings
        shell: bash
        env:
          GILBIC_TEST_DATABASE_URL: ""
          PYTHONPATH: gilbic_backend/src:spina_backend_mobile/src:.
        run: |
          set -euo pipefail
          python -m pytest -q gilbic_backend/tests spina_backend_mobile/tests tests \
            --cov=gilbic_backend --cov=spina_mobile_collections \
            --cov-report=term-missing \
            --cov-report=xml:ci-artifacts/backend/coverage.xml \
            --cov-report=json:ci-artifacts/backend/coverage.json \
            --durations=20 | tee ci-artifacts/backend/pytest.txt

      - name: Publish backend summary
        if: always()
        shell: bash
        env:
          RUFF_LINT_EXIT: ${{ steps.ruff_lint.outputs.exit_code }}
          RUFF_FORMAT_EXIT: ${{ steps.ruff_format.outputs.exit_code }}
          PYRIGHT_EXIT: ${{ steps.pyright.outputs.exit_code }}
          BANDIT_EXIT: ${{ steps.bandit.outputs.exit_code }}
          PIP_AUDIT_EXIT: ${{ steps.pip_audit.outputs.exit_code }}
          GITLEAKS_EXIT: ${{ steps.gitleaks.outputs.exit_code }}
        run: |
          mkdir -p ci-artifacts/backend
          {
            echo "## Backend, quality, and security"
            echo
            echo "New lint, type, format, and scanner findings, incomplete scans, and test failures block CI. Existing retained findings still require security review; CI success is not security clearance."
            echo
            echo "- Ruff lint exit: ${RUFF_LINT_EXIT:-not-run}"
            echo "- Ruff format exit: ${RUFF_FORMAT_EXIT:-not-run}"
            echo "- Pyright exit: ${PYRIGHT_EXIT:-not-run}"
            echo "- Bandit exit: ${BANDIT_EXIT:-not-run}"
            echo "- pip-audit exit: ${PIP_AUDIT_EXIT:-not-run}"
            echo "- Gitleaks exit: ${GITLEAKS_EXIT:-not-run}"
          } | tee ci-artifacts/backend/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require clean tracked files
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: spina-ci-backend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/backend
          if-no-files-found: warn
          retention-days: 14

  client-apps:
    name: Portal, Flutter, and Android
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test portal modules
        run: npm test

      - name: Build portal without repeating tests
        run: node tools/build_portal.mjs

      - name: Verify public portal output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/manifest.webmanifest
          test ! -d dist/tests
          if grep -R -E "GILBIC_(DATABASE_URL|SUPABASE_SECRET_KEY)|service_role|postgresql://" dist; then
            echo "Public portal output contains a forbidden backend secret pattern."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter-${FLUTTER_VERSION}"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$flutter_root"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Analyze and test Flutter
        working-directory: gilbic_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test

      - name: Build Android debug package in generated host
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/spina-android-host"
          output="$GITHUB_WORKSPACE/gilbic_mobile/build/app/outputs/flutter-apk"
          flutter create --platforms=android --org com.spinalending --project-name gilbic_mobile --no-pub "$host"
          python tools/prepare_android_host.py prepare --host "$host" \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode debug --api-url https://spina.157-230-250-111.sslip.io
          cd "$host"
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-arm64,android-x64 --no-pub \
            --dart-define=GILBIC_API_URL=https://spina.157-230-250-111.sslip.io
          mkdir -p "$output"
          cp build/app/outputs/flutter-apk/app-debug.apk "$output/Spina-Android-internal.apk"

      - name: Verify Android package
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_android_artifact.py \
            --apk gilbic_mobile/build/app/outputs/flutter-apk/Spina-Android-internal.apk \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode debug --api-url https://spina.157-230-250-111.sslip.io \
            --output gilbic_mobile/build/app/outputs/flutter-apk/android-verification.json

      - name: Require clean tracked files
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload Android package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Spina-Android-internal-${{ github.event.pull_request.head.sha || github.sha }}
          path: gilbic_mobile/build/app/outputs/flutter-apk/
          if-no-files-found: error
          retention-days: 7

  financial-database:
    name: Financial and disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            gilbic_backend/pyproject.toml
            spina_backend_mobile/pyproject.toml

      - name: Install database verifier dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ./spina_backend_mobile -e './gilbic_backend[test]'

      - name: Install matching PostgreSQL backup tools
        shell: bash
        run: |
          set -euo pipefail
          # https://www.postgresql.org/download/linux/ubuntu/
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Compile disposable validators
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/run_7x7_source_event_accounting_preview_disposable_postgres_validation.py \
            tools/run_combined_collection_renewal_disposable_postgres_validation.py \
            tools/run_delegated_area_disposable_postgres_validation.py \
            tools/run_initial_capital_funding_disposable_postgres_validation.py \
            tools/run_period_close_disposable_postgres_validation.py \
            tools/run_0099_remittance_capacity_disposable_postgres_validation.py \
            tools/run_0102_remittance_review_disposable_postgres_validation.py \
            tools/run_v1_tax_evidence_disposable_postgres_validation.py \
            tools/run_mvp_private_schema_barrier_validation.py

      - name: Create isolated validation databases
        shell: bash
        run: |
          set -euo pipefail
          for database in x7preview combinedrenewal delegatedarea initialcapital periodclose remittancecap remittancereview v1tax mvp_private_schema_test; do
            docker exec "${{ job.services.postgres.id }}" createdb -U postgres "$database"
          done

      - name: Run disposable PostgreSQL validations
        shell: bash
        env:
          SPINA_ALLOW_DISPOSABLE_DATABASE: "1"
          X7PREVIEW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/x7preview?sslmode=disable
          COMBINED_RENEWAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/combinedrenewal?sslmode=disable
          DELEGATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/delegatedarea?sslmode=disable
          CAPITAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/initialcapital?sslmode=disable
          CLOSE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/periodclose?sslmode=disable
          REMIT_CAP_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/remittancecap?sslmode=disable
          REMIT_REVIEW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/remittancereview?sslmode=disable
          TAX_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/v1tax?sslmode=disable
          GILBIC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mvp_private_schema_test?sslmode=disable
        run: |
          set -euo pipefail
          python tools/run_7x7_source_event_accounting_preview_disposable_postgres_validation.py --database-url-env X7PREVIEW_DATABASE_URL
          python tools/run_combined_collection_renewal_disposable_postgres_validation.py
          python tools/run_delegated_area_disposable_postgres_validation.py --database-url-env DELEGATE_DATABASE_URL
          python tools/run_initial_capital_funding_disposable_postgres_validation.py --database-url-env CAPITAL_DATABASE_URL
          python tools/run_period_close_disposable_postgres_validation.py --database-url-env CLOSE_DATABASE_URL
          python tools/run_0099_remittance_capacity_disposable_postgres_validation.py --database-url-env REMIT_CAP_DATABASE_URL
          python tools/run_0102_remittance_review_disposable_postgres_validation.py
          python tools/run_v1_tax_evidence_disposable_postgres_validation.py --database-url-env TAX_DATABASE_URL
          python tools/run_mvp_private_schema_barrier_validation.py

      - name: Restore synthetic database and private evidence from backup
        shell: bash
        env:
          PYTHONPATH: gilbic_backend/src:spina_backend_mobile/src:tools:.
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/financial
          dsn_file="$RUNNER_TEMP/spina-recovery-admin.dsn"
          trap 'rm -f "$dsn_file"' EXIT
          umask 077
          printf '%s\n' 'host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres sslmode=disable' > "$dsn_file"
          python tools/run_release_recovery_drill.py \
            --admin-dsn-file "$dsn_file" --allow-disposable \
            --pg-bin /usr/lib/postgresql/17/bin \
            --output ci-artifacts/financial/recovery.json
          python tools/run_accounting_export_disposable_validation.py \
            --admin-dsn-file "$dsn_file" --allow-disposable \
            --sample-output "$GITHUB_WORKSPACE/ci-artifacts/financial/accounting-export-synthetic.zip" \
            --proof-output "$GITHUB_WORKSPACE/ci-artifacts/financial/accounting-export-proof.json"

      - name: Build unsigned BIR preparation package from exact source
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_bir_registration_package.py \
            --repository "$GITHUB_WORKSPACE" \
            --expected-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir "$RUNNER_TEMP/spina-bir-review" \
            --accounting-export "$GITHUB_WORKSPACE/ci-artifacts/financial/accounting-export-synthetic.zip"

      - name: Upload unsigned synthetic BIR preparation package
        uses: actions/upload-artifact@v7.0.0
        with:
          name: spina-bir-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/spina-bir-review/
          if-no-files-found: error
          retention-days: 14

      - name: Upload synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: spina-ci-financial-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/financial/
          if-no-files-found: warn
          retention-days: 14

      - name: Require clean tracked files
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
