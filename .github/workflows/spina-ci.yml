name: SPINA unified validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spina-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply requested covered-calendar patch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('gilbic_mobile/lib/src/features/collector/collection_entry_page.dart')
          page = page_path.read_text(encoding='utf-8')

          method_start = page.index('  Future<void> _selectCoveredDate() async {')
          method_end = page.index('  Future<void> _selectUnableDate() async {', method_start)
          new_method = r'''  Future<void> _selectCoveredDate() async {
            final existingDates = _sortedCoveredDates;
            final firstDate = _collectionDate.subtract(const Duration(days: 365));
            final lastDate = _collectionDate.add(const Duration(days: 730));
            final initialDate = existingDates.isEmpty ? _collectionDate : existingDates.last;
            final firstMonth = DateTime(firstDate.year, firstDate.month);
            final lastMonth = DateTime(lastDate.year, lastDate.month);

            final selectedDates = await showDialog<List<DateTime>>(
              context: context,
              builder: (dialogContext) {
                final workingDates = existingDates.map(_dateOnly).toSet();
                var visibleMonth = DateTime(initialDate.year, initialDate.month);

                return StatefulBuilder(
                  builder: (context, setDialogState) {
                    final sortedDates = workingDates.toList(growable: false)
                      ..sort((left, right) => left.compareTo(right));
                    final canMoveBack = visibleMonth.isAfter(firstMonth);
                    final canMoveForward = visibleMonth.isBefore(lastMonth);

                    void toggleDate(DateTime value) {
                      final normalized = _dateOnly(value);
                      setDialogState(() {
                        if (workingDates.contains(normalized)) {
                          workingDates.remove(normalized);
                        } else {
                          workingDates.add(normalized);
                        }
                      });
                    }

                    void moveMonth(int offset) {
                      final candidate = DateTime(
                        visibleMonth.year,
                        visibleMonth.month + offset,
                      );
                      if (candidate.isBefore(firstMonth) ||
                          candidate.isAfter(lastMonth)) {
                        return;
                      }
                      setDialogState(() => visibleMonth = candidate);
                    }

                    return AlertDialog(
                      title: const Text('Choose covered dates'),
                      content: SizedBox(
                        width: 380,
                        child: SingleChildScrollView(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                'Tap every date this payment covers. Selected dates stay circled until you press Done.',
                                style: Theme.of(context).textTheme.bodySmall,
                              ),
                              const SizedBox(height: 8),
                              _MultiSelectMonthCalendar(
                                visibleMonth: visibleMonth,
                                firstDate: firstDate,
                                lastDate: lastDate,
                                selectedDates: workingDates,
                                onDateTapped: toggleDate,
                                onPreviousMonth:
                                    canMoveBack ? () => moveMonth(-1) : null,
                                onNextMonth:
                                    canMoveForward ? () => moveMonth(1) : null,
                              ),
                            ],
                          ),
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: workingDates.isEmpty
                              ? null
                              : () => setDialogState(workingDates.clear),
                          child: const Text('Clear'),
                        ),
                        TextButton(
                          onPressed: () => Navigator.of(dialogContext).pop(),
                          child: const Text('Cancel'),
                        ),
                        FilledButton(
                          key: const Key('confirm-covered-dates'),
                          onPressed: workingDates.isEmpty
                              ? null
                              : () => Navigator.of(dialogContext).pop(sortedDates),
                          child: const Text('Done'),
                        ),
                      ],
                    );
                  },
                );
              },
            );

            if (selectedDates == null || !mounted) {
              return;
            }
            _setCoveredDates(selectedDates);
          }

'''
          page = page[:method_start] + new_method + page[method_end:]

          if 'class _MultiSelectMonthCalendar extends StatelessWidget {' not in page:
              widget_code = r'''class _MultiSelectMonthCalendar extends StatelessWidget {
            const _MultiSelectMonthCalendar({
              required this.visibleMonth,
              required this.firstDate,
              required this.lastDate,
              required this.selectedDates,
              required this.onDateTapped,
              required this.onPreviousMonth,
              required this.onNextMonth,
            });

            final DateTime visibleMonth;
            final DateTime firstDate;
            final DateTime lastDate;
            final Set<DateTime> selectedDates;
            final ValueChanged<DateTime> onDateTapped;
            final VoidCallback? onPreviousMonth;
            final VoidCallback? onNextMonth;

            static const _monthNames = <String>[
              'January',
              'February',
              'March',
              'April',
              'May',
              'June',
              'July',
              'August',
              'September',
              'October',
              'November',
              'December',
            ];

            static const _weekdayLabels = <String>[
              'S',
              'M',
              'T',
              'W',
              'T',
              'F',
              'S',
            ];

            @override
            Widget build(BuildContext context) {
              final scheme = Theme.of(context).colorScheme;
              final monthStart = DateTime(visibleMonth.year, visibleMonth.month);
              final leadingEmptyCells = monthStart.weekday % 7;
              final daysInMonth =
                  DateTime(visibleMonth.year, visibleMonth.month + 1, 0).day;
              final cellCount =
                  ((leadingEmptyCells + daysInMonth + 6) ~/ 7) * 7;
              final today = _dateOnly(DateTime.now());
              final normalizedFirstDate = _dateOnly(firstDate);
              final normalizedLastDate = _dateOnly(lastDate);

              return Column(
                key: const Key('covered-date-calendar'),
                mainAxisSize: MainAxisSize.min,
                children: [
                  Row(
                    children: [
                      Expanded(
                        child: Text(
                          '${_monthNames[visibleMonth.month - 1]} ${visibleMonth.year}',
                          style: Theme.of(context).textTheme.titleSmall?.copyWith(
                                fontWeight: FontWeight.w700,
                              ),
                        ),
                      ),
                      IconButton(
                        key: const Key('previous-covered-month'),
                        tooltip: 'Previous month',
                        onPressed: onPreviousMonth,
                        icon: const Icon(Icons.chevron_left),
                      ),
                      IconButton(
                        key: const Key('next-covered-month'),
                        tooltip: 'Next month',
                        onPressed: onNextMonth,
                        icon: const Icon(Icons.chevron_right),
                      ),
                    ],
                  ),
                  Row(
                    children: [
                      for (final label in _weekdayLabels)
                        Expanded(
                          child: Padding(
                            padding: const EdgeInsets.symmetric(vertical: 6),
                            child: Text(
                              label,
                              textAlign: TextAlign.center,
                              style: Theme.of(context).textTheme.labelMedium,
                            ),
                          ),
                        ),
                    ],
                  ),
                  GridView.builder(
                    key: Key(
                      'covered-calendar-${visibleMonth.year}-${visibleMonth.month}',
                    ),
                    shrinkWrap: true,
                    physics: const NeverScrollableScrollPhysics(),
                    itemCount: cellCount,
                    gridDelegate:
                        const SliverGridDelegateWithFixedCrossAxisCount(
                      crossAxisCount: 7,
                      mainAxisExtent: 44,
                    ),
                    itemBuilder: (context, index) {
                      final dayNumber = index - leadingEmptyCells + 1;
                      if (dayNumber < 1 || dayNumber > daysInMonth) {
                        return const SizedBox.shrink();
                      }

                      final date = DateTime(
                        visibleMonth.year,
                        visibleMonth.month,
                        dayNumber,
                      );
                      final enabled = !date.isBefore(normalizedFirstDate) &&
                          !date.isAfter(normalizedLastDate);
                      final selected = selectedDates.contains(date);
                      final isToday = _sameDate(date, today);
                      final foreground = selected
                          ? scheme.onPrimary
                          : enabled
                              ? scheme.onSurface
                              : scheme.onSurface.withValues(alpha: 0.38);

                      return Semantics(
                        button: true,
                        enabled: enabled,
                        selected: selected,
                        label: '${_date(date)}${selected ? ', selected' : ''}',
                        child: InkResponse(
                          key: Key('covered-calendar-day-${_date(date)}'),
                          onTap: enabled ? () => onDateTapped(date) : null,
                          radius: 22,
                          child: Center(
                            child: AnimatedContainer(
                              key: selected
                                  ? Key('selected-covered-date-${_date(date)}')
                                  : null,
                              duration: const Duration(milliseconds: 120),
                              width: 36,
                              height: 36,
                              alignment: Alignment.center,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                color: selected ? scheme.primary : null,
                                border: !selected && isToday
                                    ? Border.all(color: scheme.primary)
                                    : null,
                              ),
                              child: Text(
                                '$dayNumber',
                                style: Theme.of(context)
                                    .textTheme
                                    .bodyMedium
                                    ?.copyWith(
                                      color: foreground,
                                      fontWeight: selected
                                          ? FontWeight.w700
                                          : FontWeight.normal,
                                    ),
                              ),
                            ),
                          ),
                        ),
                      );
                    },
                  ),
                ],
              );
            }
          }

          '''
              marker = 'class _ClientSummary extends StatelessWidget {'
              page = page.replace(marker, widget_code + marker, 1)

          page_path.write_text(page, encoding='utf-8')

          test_path = Path('gilbic_mobile/test/collection_entry_page_test.dart')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = test.index(
              "  testWidgets('covered-date calendar stays open for several exact dates'"
          )
          block_start = test.index(
              "    expect(find.text('Choose covered dates'), findsOneWidget);",
              test_anchor,
          )
          block_end = test.index(
              "    await tester.tap(find.byKey(const Key('confirm-covered-dates')));",
              block_start,
          )
          replacement = r'''    expect(find.text('Choose covered dates'), findsOneWidget);
            expect(find.byType(CalendarDatePicker), findsNothing);
            expect(find.byKey(const Key('covered-date-calendar')), findsOneWidget);
            expect(
              find.byKey(const Key('selected-covered-date-2026-08-01')),
              findsOneWidget,
            );
            expect(
              find.byKey(const Key('calendar-selected-2026-08-01')),
              findsNothing,
            );

            await tester.tap(
              find.byKey(const Key('covered-calendar-day-2026-08-02')),
            );
            await tester.pumpAndSettle();
            expect(
              find.byKey(const Key('selected-covered-date-2026-08-02')),
              findsOneWidget,
            );
            expect(find.text('Choose covered dates'), findsOneWidget);

            await tester.tap(
              find.byKey(const Key('covered-calendar-day-2026-08-03')),
            );
            await tester.pumpAndSettle();
            expect(
              find.byKey(const Key('selected-covered-date-2026-08-03')),
              findsOneWidget,
            );
            expect(find.text('Choose covered dates'), findsOneWidget);

'''
          test = test[:block_start] + replacement + test[block_end:]
          test_path.write_text(test, encoding='utf-8')
          PY

          git config user.name "GILBIC"
          git config user.email "gilbic@users.noreply.github.com"
          if [ -f .github/workflows/patch-covered-calendar-indicators.yml ]; then
            git rm .github/workflows/patch-covered-calendar-indicators.yml
          fi
          git add gilbic_mobile/lib/src/features/collector/collection_entry_page.dart
          git add gilbic_mobile/test/collection_entry_page_test.dart
          git diff --check
          if git diff --cached --quiet; then
            echo "Calendar patch already applied."
          else
            git commit -m "Show every selected covered date on calendar"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated Python environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-unified-ci-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\spina_backend_mobile" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\gilbic_backend[test]" || exit /b 1

      - name: Compile desktop and backend Python
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-unified-ci-venv"
          "%VENV%\Scripts\python.exe" -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m compileall -q spina_app gilbic_backend\src spina_backend_mobile\src || exit /b 1

      - name: Run backend and database tests
        shell: cmd
        env:
          GILBIC_TEST_DATABASE_URL: ${{ secrets.GILBIC_TEST_DATABASE_URL }}
        run: |
          set "VENV=%RUNNER_TEMP%\spina-unified-ci-venv"
          "%VENV%\Scripts\python.exe" -m pytest -q gilbic_backend\tests spina_backend_mobile\tests || exit /b 1

      - name: Install Flutter 3.44.7
        shell: cmd
        run: |
          set "FLUTTER_ROOT=%RUNNER_TEMP%\flutter-3.44.7"
          set "PUB_CACHE=%RUNNER_TEMP%\pub-cache"
          if exist "%FLUTTER_ROOT%" rmdir /s /q "%FLUTTER_ROOT%"
          if not exist "%PUB_CACHE%" mkdir "%PUB_CACHE%" || exit /b 1
          echo PUB_CACHE=%PUB_CACHE%>>"%GITHUB_ENV%"
          git clone --depth 1 --branch 3.44.7 https://github.com/flutter/flutter.git "%FLUTTER_ROOT%" || exit /b 1
          echo %FLUTTER_ROOT%\bin>>"%GITHUB_PATH%"

      - name: Verify Flutter runtime
        shell: cmd
        run: flutter --version || exit /b 1

      - name: Resolve Flutter packages
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter pub get || exit /b 1

      - name: Analyze Flutter application
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter analyze --fatal-infos || exit /b 1

      - name: Run Flutter tests
        shell: cmd
        working-directory: gilbic_mobile
        run: flutter test || exit /b 1

      - name: Build Android debug APK in generated host
        shell: cmd
        run: |
          set "HOST=%RUNNER_TEMP%\gilbic-android-host"
          set "APK_OUT=%GITHUB_WORKSPACE%\gilbic_mobile\build\app\outputs\flutter-apk"
          if exist "%HOST%" rmdir /s /q "%HOST%"
          mkdir "%HOST%" || exit /b 1
          pushd "%HOST%"
          call flutter create --platforms=android --org com.spinalending --project-name gilbic_mobile . || exit /b 1
          if exist "lib" rmdir /s /q "lib"
          xcopy /e /i /y "%GITHUB_WORKSPACE%\gilbic_mobile\lib" "lib" >nul || exit /b 1
          copy /y "%GITHUB_WORKSPACE%\gilbic_mobile\pubspec.yaml" "pubspec.yaml" >nul || exit /b 1
          echo kotlin.incremental=false>>"android\gradle.properties"
          echo kotlin.compiler.execution.strategy=in-process>>"android\gradle.properties"
          call flutter pub get || exit /b 1
          call flutter build apk --debug --no-pub || exit /b 1
          if not exist "build\app\outputs\flutter-apk\app-debug.apk" exit /b 1
          if not exist "%APK_OUT%" mkdir "%APK_OUT%" || exit /b 1
          copy /y "build\app\outputs\flutter-apk\app-debug.apk" "%APK_OUT%\app-debug.apk" >nul || exit /b 1
          for %%I in ("%APK_OUT%\app-debug.apk") do echo APK size: %%~zI bytes
          popd

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gilbic-mobile-debug-${{ github.sha }}
          path: gilbic_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
