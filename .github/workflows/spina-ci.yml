name: SPINA CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-jit-diagnostic:
    name: Repaired final accounting schema checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install identical verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ./spina_backend_mobile -e './gilbic_backend[test]'
      - name: Install matching PostgreSQL backup tools
        shell: bash
        run: |
          set -euo pipefail
          # https://www.postgresql.org/download/linux/ubuntu/
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            . /etc/os-release
            printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Run original final schema validator
        env:
          SPINA_ALLOW_DISPOSABLE_DATABASE: "1"
          SPINA_POSTGRES_BIN: /usr/lib/postgresql/17/bin
          ACCOUNTING_CONTROLS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/jit-diagnostic
          python tools/run_accounting_final_schema_validation.py 2>&1 | tee ci-artifacts/jit-diagnostic/repaired-final.log
      - name: Preserve synthetic diagnostic results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: accounting-final-repaired-${{ github.sha }}
          path: ci-artifacts/jit-diagnostic/
          if-no-files-found: error
          retention-days: 7
