name: SPINA CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting-jit-diagnostic:
    name: Disposable accounting JIT diagnostic only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install identical verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ./spina_backend_mobile -e './gilbic_backend[test]'
      - name: Compare exact test and schema with JIT on and off
        env:
          SPINA_ALLOW_DISPOSABLE_DATABASE: "1"
          ACCOUNTING_CONTROLS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: python tools/diagnose_accounting_jit.py
      - name: Preserve synthetic diagnostic results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: accounting-jit-diagnostic-${{ github.sha }}
          path: ci-artifacts/jit-diagnostic/
          if-no-files-found: error
          retention-days: 7
