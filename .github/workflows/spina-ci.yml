name: SPINA isolated native acceptance debug build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spina-isolated-native-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-native-debug:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/acceptance/s04-native-83-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out exact isolated acceptance revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up existing CI Java toolchain
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install existing CI Flutter version
        shell: bash
        run: |
          set -euo pipefail
          flutter_root="$RUNNER_TEMP/flutter-3.44.7"
          test ! -e "$flutter_root"
          git clone --depth 1 --branch 3.44.7 https://github.com/flutter/flutter.git "$flutter_root"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Build and verify only the isolated arm64 debug package
        shell: bash
        run: |
          set -euo pipefail
          python .native-acceptance/build_linux.py --execute

      - name: Upload isolated debug artifact and explicit acceptance provenance
        if: success()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Spina-Native-Acceptance-arm64-debug-${{ github.sha }}
          path: |
            ${{ runner.temp }}/s04-native-debug-output/Spina-Native-Acceptance-arm64-debug.apk
            ${{ runner.temp }}/s04-native-debug-output/debug-artifact-result.json
            ${{ runner.temp }}/s04-native-debug-output/build-provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload bounded build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Spina-Native-Acceptance-build-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/s04-native-debug-output/*.log
            ${{ runner.temp }}/s04-native-debug-output/events.jsonl
          if-no-files-found: warn
          retention-days: 7
