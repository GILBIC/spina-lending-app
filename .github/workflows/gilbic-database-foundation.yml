name: Gilbic database foundation validation

on:
  pull_request:
    paths:
      - "gilbic_backend/**"
      - ".github/workflows/gilbic-database-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated backend environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\gilbic-database-foundation-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\gilbic_backend[test]" || exit /b 1

      - name: Compile backend
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\gilbic-database-foundation-venv"
          "%VENV%\Scripts\python.exe" -m compileall -q gilbic_backend\src || exit /b 1

      - name: Run backend tests
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\gilbic-database-foundation-venv"
          "%VENV%\Scripts\python.exe" -m pytest -q gilbic_backend\tests || exit /b 1

      - name: Require clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
