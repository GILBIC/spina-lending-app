name: Data Bank Delete Day Password Gate Wave 63

# Final read-only validation for the exact Wave 63 PR head.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "spina_app/databank_delete_day.py"
      - "tools/test_databank_delete_day_wave_62.py"
      - "tools/test_databank_delete_day_behavior_wave_62.py"
      - "tools/test_databank_delete_day_password_gate_wave_63.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/databank-delete-day-password-gate-wave-63.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databank-delete-day-password-gate-wave-63-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/databank-delete-day-password-gate-wave-63'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_delete_day.py
          python -m py_compile tools\test_databank_delete_day_wave_62.py
          python -m py_compile tools\test_databank_delete_day_behavior_wave_62.py
          python -m py_compile tools\test_databank_delete_day_password_gate_wave_63.py

      - name: Run Delete Day structural regression
        shell: cmd
        run: python -m tools.test_databank_delete_day_wave_62

      - name: Run existing Delete Day behavior regression
        shell: cmd
        run: python -m tools.test_databank_delete_day_behavior_wave_62

      - name: Run fail-closed password gate regression
        shell: cmd
        run: python -m tools.test_databank_delete_day_password_gate_wave_63

      - name: Run protected Wave 61 Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_databank_cell_writes_wave_61
          python -m tools.test_databank_cell_writes_behavior_wave_61

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-63-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-63-quality.json

      - name: Upload Wave 63 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-delete-day-password-gate-wave-63-reports
          path: artifacts/wave-63-*.json
          if-no-files-found: warn
