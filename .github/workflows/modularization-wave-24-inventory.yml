name: Modularization Wave 24 inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/modularization-wave-24-inventory'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile inventory tool
        shell: cmd
        run: python -m py_compile tools\inventory_modularization_wave_24.py

      - name: Inspect remaining presentation candidates
        shell: cmd
        run: python -m tools.inventory_modularization_wave_24

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: modularization-wave-24-inventory
          path: wave-24-inventory.json
