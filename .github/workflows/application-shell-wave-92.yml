name: Application shell Wave 92

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/account_header_presentation.py"
      - "spina_app/features/application_shell.py"
      - "spina_app/features/accounts.py"
      - "spina_app/features/side_navigation.py"
      - "spina_app/features/startup_runtime.py"
      - "tools/test_application_shell_wave_92.py"
      - "tools/test_account_header_presentation_wave_46.py"
      - "tools/test_accounts_feature_wave_83.py"
      - "tools/test_side_navigation_feature_wave_86.py"
      - "tools/test_startup_runtime_wave_89.py"
      - "docs/application-shell-wave-92.md"
      - ".github/workflows/application-shell-wave-92.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70

    steps:
      - name: Check out exact Wave 92 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compile application shell architecture
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py || exit /b 1
          python -m py_compile spina_app\account_header_presentation.py || exit /b 1
          python -m py_compile spina_app\features\application_shell.py || exit /b 1
          python -m py_compile spina_app\features\accounts.py || exit /b 1
          python -m py_compile spina_app\features\side_navigation.py || exit /b 1
          python -m py_compile spina_app\features\startup_runtime.py || exit /b 1
          python -m py_compile tools\test_application_shell_wave_92.py || exit /b 1
          python -m py_compile tools\test_account_header_presentation_wave_46.py || exit /b 1
          python -m py_compile tools\test_side_navigation_feature_wave_86.py || exit /b 1
          python -m py_compile tools\test_startup_runtime_wave_89.py || exit /b 1

      - name: Run final application shell regression
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_application_shell_wave_92.py

      - name: Run protected account and header regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_account_header_presentation_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_account_header_widget_smoke_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_feature_wave_83.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_validation_wave_85.py || exit /b 1

      - name: Run protected sidebar and navigation regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_side_navigation_feature_wave_86.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_navigation_compatibility_wave_86.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_cleanup_wave_87.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_validation_wave_88.py || exit /b 1

      - name: Run protected startup regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_startup_runtime_wave_89.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_startup_cleanup_wave_90.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_startup_validation_wave_91.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_login_cancel_startup_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_tk_shutdown_wave_46.py || exit /b 1

      - name: Run permanent architecture map
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python -m tools.test_architecture_map

      - name: Require clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
