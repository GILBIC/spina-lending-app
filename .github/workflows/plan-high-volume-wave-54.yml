name: Plan high-volume Wave 54

on:
  push:
    branches:
      - agent/high-volume-wave-54
    paths:
      - "tools/plan_high_volume_wave_54.py"
      - ".github/workflows/plan-high-volume-wave-54.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plan-high-volume-wave-54
  cancel-in-progress: true

jobs:
  plan:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 54 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-54
          persist-credentials: true
          show-progress: false

      - name: Compile and run planner
        shell: cmd
        run: |
          python -m py_compile tools\plan_high_volume_wave_54.py
          python tools\plan_high_volume_wave_54.py

      - name: Commit candidate report
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave-54-candidate-report.md artifacts\wave-54-candidates.json
          git diff --cached --quiet && exit /b 0
          git commit -m "Add Wave 54 candidate report"
          git push origin HEAD:agent/high-volume-wave-54
