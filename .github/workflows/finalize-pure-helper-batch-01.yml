name: Finalize pure helper batch 01

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-pure-helper-scan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add permanent read-only CI coverage and remove temporary files
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/quality-audit.yml')
          text = path.read_text(encoding='utf-8')

          compile_old = '''            tools/extract_merge_note_dict.py \\
            tools/test_merge_note_dict_extraction.py'''
          compile_new = '''            tools/extract_merge_note_dict.py \\
            tools/test_merge_note_dict_extraction.py \\
            tools/extract_pure_helper_batch.py \\
            tools/test_pure_helper_batch.py'''
          if 'tools/test_pure_helper_batch.py' not in text:
              if compile_old not in text:
                  raise RuntimeError('Could not find compile insertion point')
              text = text.replace(compile_old, compile_new, 1)

          test_old = '''      - name: Test merge note dictionary extraction
        run: python tools/test_merge_note_dict_extraction.py
'''
          test_new = '''      - name: Test merge note dictionary extraction
        run: python tools/test_merge_note_dict_extraction.py

      - name: Test accelerated pure helper batch 01
        run: |
          python tools/extract_pure_helper_batch.py \\
            --manifest tools/fixtures/pure_helper_batch_01_manifest.json
          python tools/test_pure_helper_batch.py \\
            --manifest tools/fixtures/pure_helper_batch_01_manifest.json \\
            --fixture tools/fixtures/pure_helper_batch_01_behavior.json
'''
          if 'Test accelerated pure helper batch 01' not in text:
              if test_old not in text:
                  raise RuntimeError('Could not find test insertion point')
              text = text.replace(test_old, test_new, 1)

          path.write_text(text, encoding='utf-8')

          for temporary in (
              '.github/workflows/inspect-safe-helper-batch.yml',
              '.github/workflows/apply-pure-helper-batch-01.yml',
              '.github/workflows/finalize-pure-helper-batch-01.yml',
              'tools/fixtures/safe_helper_batch_scan.json',
              'tools/fixtures/pure_helper_batch_01_result.json',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY
      - name: Verify permanent tests
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/formatting.py \
            spina_app/utilities/numbers.py \
            tools/extract_pure_helper_batch.py \
            tools/test_pure_helper_batch.py
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/pure_helper_batch_01_manifest.json
          python tools/test_pure_helper_batch.py \
            --manifest tools/fixtures/pure_helper_batch_01_manifest.json \
            --fixture tools/fixtures/pure_helper_batch_01_behavior.json
      - name: Commit finalized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize first pure helper batch"
          git push origin HEAD:agent/batch-pure-helper-scan
