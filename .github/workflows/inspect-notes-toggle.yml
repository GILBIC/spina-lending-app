name: Inspect notes toggle and loading path

on:
  push:
    branches:
      - agent/extract-note-dict-helper

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect notes UI paths
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)

          needles = ('hide notes', 'show notes', 'notes')
          contexts = []
          for index, line in enumerate(lines, start=1):
              lower = line.lower()
              if 'hide notes' in lower or 'show notes' in lower:
                  start = max(1, index - 20)
                  end = min(len(lines), index + 35)
                  contexts.append({
                      'match_line': index,
                      'match': line,
                      'start_line': start,
                      'end_line': end,
                      'context': '\n'.join(f'{n}: {lines[n-1]}' for n in range(start, end + 1)),
                  })

          functions = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              text = '\n'.join(lines[node.lineno - 1:node.end_lineno])
              lower = text.lower()
              if 'hide notes' in lower or 'show notes' in lower or ('notes' in node.name.lower() and node.end_lineno - node.lineno < 180):
                  functions.append({
                      'name': node.name,
                      'line': node.lineno,
                      'end_line': node.end_lineno,
                      'source': text,
                  })

          imports = []
          for index, line in enumerate(lines, start=1):
              if '_as_note_dict' in line:
                  imports.append({'line': index, 'text': line})

          report = {
              'contexts': contexts,
              'functions': functions,
              'as_note_dict_references': imports,
          }
          output = Path('tools/fixtures/notes_toggle_inspection.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/notes_toggle_inspection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect notes toggle path"
          git push origin HEAD:${GITHUB_REF_NAME}
