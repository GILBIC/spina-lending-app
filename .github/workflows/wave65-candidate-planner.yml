name: Wave 65 Candidate Planner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_wave65_candidates.py"
      - ".github/workflows/wave65-candidate-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-65'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile and run Wave 65 planner
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools\plan_wave65_candidates.py
          python tools\plan_wave65_candidates.py > artifacts\wave65-planner-output.txt 2>&1
          type artifacts\wave65-planner-output.txt

      - name: Upload Wave 65 candidate report
        uses: actions/upload-artifact@v4
        with:
          name: wave65-candidate-report
          path: |
            artifacts/wave65-candidates.json
            artifacts/wave65-planner-output.txt
          if-no-files-found: error
