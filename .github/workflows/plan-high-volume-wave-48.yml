name: Plan high volume batch Wave 48
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/plan_high_volume_batch_wave_48.py"
      - ".github/workflows/plan-high-volume-wave-48.yml"
permissions:
  contents: read
jobs:
  plan:
    if: github.head_ref == 'agent/login-account-presentation-batch-wave-48'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile planner
        shell: cmd
        run: python -m py_compile tools/plan_high_volume_batch_wave_48.py
      - name: Plan safe high volume batches
        shell: cmd
        run: python tools/plan_high_volume_batch_wave_48.py
      - name: Upload Wave 48 plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-48-high-volume-batch-plan
          path: artifacts/wave-48-high-volume-batch-plan.json
