name: Inspect login support Wave 47
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_login_support_wave_47.py"
      - ".github/workflows/inspect-login-support-wave-47.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/login-support-presentation-wave-47'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_login_support_wave_47.py
      - name: Inspect login support candidates
        shell: cmd
        run: python tools/inspect_login_support_wave_47.py
      - name: Upload Wave 47 inspection
        uses: actions/upload-artifact@v4
        with:
          name: wave-47-login-support-inspection
          path: artifacts/wave-47-login-support-inspection.json
