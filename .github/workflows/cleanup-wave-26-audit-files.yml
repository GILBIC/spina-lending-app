name: Cleanup Wave 26 audit file diffs

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/high-volume-wave-26'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-26
          fetch-depth: 0

      - name: Restore generated audit reports from main
        shell: cmd
        run: |
          git fetch origin main
          git checkout origin/main -- quality-report.json redundancy-report.json
          del .github\workflows\cleanup-wave-26-audit-files.yml

      - name: Commit and push focused diff
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Keep Wave 26 diff focused"
          git push origin HEAD:agent/high-volume-wave-26
