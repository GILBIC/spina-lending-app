name: Inspect real login cancel Wave 46
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_real_login_cancel_wave_46.py"
      - ".github/workflows/inspect-real-login-cancel-wave-46.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/account-header-presentation-wave-46'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_real_login_cancel_wave_46.py
      - name: Inspect real login cancellation path
        shell: cmd
        run: python tools/inspect_real_login_cancel_wave_46.py
