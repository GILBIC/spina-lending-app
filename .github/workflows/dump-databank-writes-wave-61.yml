name: Dump Data Bank writes Wave 61

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/dump-databank-writes-wave-61.yml"
      - "tools/dump_databank_writes_wave61_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dump-databank-writes-wave-61-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-61'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out Wave 61 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Dump exact write methods
        shell: cmd
        run: python tools\dump_databank_writes_wave61_tmp.py
      - name: Commit source dump
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave-61-write-source.tmp.txt
          git commit -m "Record exact Wave 61 write source"
          git push origin HEAD:agent/high-volume-wave-61
