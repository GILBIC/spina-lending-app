name: Feature inventory Wave 18

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: powershell
        run: |
          where.exe python
          python --version

      - name: Compile inventory tool
        shell: powershell
        run: python -m py_compile tools/inventory_feature_wave_18.py

      - name: Generate feature inventory
        shell: powershell
        run: python tools/inventory_feature_wave_18.py

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: wave-18-feature-inventory
          path: artifacts/wave-18-feature-inventory.json
