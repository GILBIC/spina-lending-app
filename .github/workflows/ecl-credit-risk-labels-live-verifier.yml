name: ECL credit-risk labels live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0070_add_ecl_credit_risk_labels.sql'
      - 'gilbic_backend/sql/0071_harden_ecl_cash_recovery_chronology.sql'
      - 'gilbic_backend/sql/0072_add_ecl_quantitative_input_readiness.sql'
      - 'gilbic_backend/sql/0073_add_ecl_forward_looking_evidence_governance.sql'
      - 'gilbic_backend/sql/0074_integrate_ecl_forward_looking_readiness.sql'
      - 'gilbic_backend/sql/0075_add_read_only_quantitative_ecl_measurement.sql'
      - 'gilbic_backend/sql/0076_harden_read_only_quantitative_ecl_measurement.sql'
      - 'gilbic_backend/sql/0077_add_protected_ecl_allowance_posting.sql'
      - 'gilbic_backend/sql/0078_harden_ecl_allowance_posting_queue.sql'
      - 'gilbic_backend/sql/0079_add_ecl_remeasurement_writeoff_recovery.sql'
      - 'gilbic_backend/sql/0080_harden_ecl_post_writeoff_boundaries.sql'
      - 'gilbic_backend/tests/test_ecl_credit_risk_labels_migration.py'
      - 'gilbic_backend/tests/test_ecl_read_only_measurement_migration.py'
      - 'gilbic_backend/tests/test_ecl_quantitative_measurement_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_migration.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_queue_migration.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_a5_migration.py'
      - 'gilbic_backend/tests/test_ecl_a5_accounting_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_live_migration_plan_postgres.py'
      - 'docs/accounting/ecl-credit-risk-label-policy.md'
      - 'docs/accounting/ecl-read-only-measurement-policy.md'
      - 'docs/accounting/ecl-allowance-posting-policy.md'
      - 'docs/accounting/ecl-remeasurement-writeoff-recovery-policy.md'
      - 'tools/apply_ecl_credit_risk_labels_migration.py'
      - 'tools/apply_ecl_live_migrations_version_aware.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_credit_risk_label_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_credit_risk_label_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_quantitative_measurement_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_quantitative_measurement_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_allowance_posting_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_allowance_posting_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_a5_accounting_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_a5_accounting_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - '.github/workflows/ecl-credit-risk-labels-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0070_add_ecl_credit_risk_labels.sql'
      - 'gilbic_backend/sql/0071_harden_ecl_cash_recovery_chronology.sql'
      - 'gilbic_backend/sql/0072_add_ecl_quantitative_input_readiness.sql'
      - 'gilbic_backend/sql/0073_add_ecl_forward_looking_evidence_governance.sql'
      - 'gilbic_backend/sql/0074_integrate_ecl_forward_looking_readiness.sql'
      - 'gilbic_backend/sql/0075_add_read_only_quantitative_ecl_measurement.sql'
      - 'gilbic_backend/sql/0076_harden_read_only_quantitative_ecl_measurement.sql'
      - 'gilbic_backend/sql/0077_add_protected_ecl_allowance_posting.sql'
      - 'gilbic_backend/sql/0078_harden_ecl_allowance_posting_queue.sql'
      - 'gilbic_backend/sql/0079_add_ecl_remeasurement_writeoff_recovery.sql'
      - 'gilbic_backend/sql/0080_harden_ecl_post_writeoff_boundaries.sql'
      - 'gilbic_backend/tests/test_ecl_credit_risk_labels_migration.py'
      - 'gilbic_backend/tests/test_ecl_read_only_measurement_migration.py'
      - 'gilbic_backend/tests/test_ecl_quantitative_measurement_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_migration.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_queue_migration.py'
      - 'gilbic_backend/tests/test_ecl_allowance_posting_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_a5_migration.py'
      - 'gilbic_backend/tests/test_ecl_a5_accounting_api_contract.py'
      - 'gilbic_backend/tests/test_ecl_live_migration_plan_postgres.py'
      - 'docs/accounting/ecl-credit-risk-label-policy.md'
      - 'docs/accounting/ecl-read-only-measurement-policy.md'
      - 'docs/accounting/ecl-allowance-posting-policy.md'
      - 'docs/accounting/ecl-remeasurement-writeoff-recovery-policy.md'
      - 'tools/apply_ecl_credit_risk_labels_migration.py'
      - 'tools/apply_ecl_live_migrations_version_aware.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_credit_risk_label_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_credit_risk_label_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_quantitative_measurement_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_quantitative_measurement_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_allowance_posting_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_allowance_posting_api.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_a5_accounting_repository.py'
      - 'gilbic_backend/src/gilbic_backend/ecl_a5_accounting_api.py'
      - 'gilbic_backend/src/gilbic_backend/main.py'
      - '.github/workflows/ecl-credit-risk-labels-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecl-credit-risk-labels-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ecl-credit-risk-label-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-label-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-label-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_ecl_credit_risk_labels_migration.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_ecl_live_migrations_version_aware.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_credit_risk_label_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_credit_risk_label_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_quantitative_measurement_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_quantitative_measurement_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_allowance_posting_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_allowance_posting_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_a5_accounting_repository.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\ecl_a5_accounting_api.py || exit /b 1
          "%VENV%\Scripts\python.exe" -m py_compile gilbic_backend\src\gilbic_backend\main.py || exit /b 1

      - name: Verify PR protected ECL controls remain explicit and fail closed
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-label-live-venv"
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0070_add_ecl_credit_risk_labels.sql').read_text(encoding='utf-8'); u=s.upper(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'STAGE_1_12_MONTH' in u and 'STAGE_2_LIFETIME' in u and 'STAGE_3_CREDIT_IMPAIRED' in u; assert 'FALSE AS ACCOUNT_1190_POSTING_ENABLED' in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0071_harden_ecl_cash_recovery_chronology.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'RECOVERY_TX.ACCEPTED_AT <= PRIOR_REVIEW.CREATED_AT' in u; assert 'BEFORE INSERT ON ACCOUNTING.ECL_CREDIT_RISK_LABEL_REVIEWS' in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0072_add_ecl_quantitative_input_readiness.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'ECL_QUANTITATIVE_INPUT_READINESS' in u; assert 'APPROVED_FORWARD_LOOKING_EVIDENCE_REQUIRED' in u; assert 'NULL::NUMERIC(18,2) AS ECL_AMOUNT' in u; assert 'FALSE AS ACCOUNT_1190_POSTING_ENABLED' in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0075_add_read_only_quantitative_ecl_measurement.sql').read_text(encoding='utf-8'); u=s.upper(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'LOAN_LEVEL_PROBABILITY_WEIGHTED_DISCOUNTED_CASH_SHORTFALL_V1' in u; assert 'QUANTITATIVE ECL INPUT GATE IS BLOCKED' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0076_harden_read_only_quantitative_ecl_measurement.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'MEASUREMENT_FORWARD_EVIDENCE_CURRENT' in u; assert 'NEW_MEASUREMENT_REQUIRED' in u; assert 'FALSE AS ACCOUNT_1190_POSTING_ENABLED' in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0077_add_protected_ecl_allowance_posting.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'PREPARE_INITIAL_ECL_ALLOWANCE_JOURNAL' in u and 'POST_INITIAL_ECL_ALLOWANCE_JOURNAL' in u; assert 'CREDIT_LOSS_EXPENSE' in u and 'ALLOWANCE_EXPECTED_CREDIT_LOSS' in u; assert 'PRIOR ALLOWANCE BALANCE 0.00' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0078_harden_ecl_allowance_posting_queue.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'A5_REMEASUREMENT_REQUIRED' in u; assert 'TRUE AS ACCOUNT_1190_POSTING_ENABLED' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0079_add_ecl_remeasurement_writeoff_recovery.sql').read_text(encoding='utf-8'); u=s.upper(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'POST_ECL_ALLOWANCE_REMEASUREMENT' in u; assert 'POST_ECL_FULL_WRITEOFF' in u; assert 'POST_ECL_POST_WRITEOFF_RECOVERY' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0080_harden_ecl_post_writeoff_boundaries.sql').read_text(encoding='utf-8'); u=s.upper(); assert 'REVIEW_ECL_POST_WRITEOFF_RECOVERY' in u; assert 'ECL_POST_WRITEOFF_RECOVERY_REVIEW_PROVENANCE' in u; assert 'ACCOUNTING_ECL_POST_WRITEOFF_REGULAR_COLLECTION_GUARD' in u; assert 'ACCOUNTING_ECL_POST_WRITEOFF_7X7_COLLECTION_GUARD' in u; assert 'AUTOMATIC_SOURCE_POSTING' in u" || exit /b 1
          python -c "from pathlib import Path; s=Path('tools/apply_ecl_live_migrations_version_aware.py').read_text(encoding='utf-8'); assert '_select_missing_forward_migrations' in s; assert '0079_add_ecl_remeasurement_writeoff_recovery.sql' in s; assert '0080_harden_ecl_post_writeoff_boundaries.sql' in s; assert 'non-contiguous' in s; assert 'ecl.MIGRATIONS = selected' in s" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pytest -q gilbic_backend\tests\test_ecl_a5_migration.py gilbic_backend\tests\test_ecl_a5_accounting_api_contract.py || exit /b 1

      - name: Require the live database runner for non-PR execution
        if: github.event_name != 'pull_request'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SPINA-WINDOWS') {
            throw "Live ECL migration requires SPINA-WINDOWS because approved database env files are local to that runner; current runner is $env:RUNNER_NAME."
          }

      - name: Install and verify ECL controls through protected A5 accounting on live database
        if: github.event_name != 'pull_request'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-label-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_ecl_live_migrations_version_aware.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree when Git metadata is available
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git -and (Test-Path '.git')) {
            & $git.Source diff --check
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
            & $git.Source diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Working tree changed during verification.' }
            & $git.Source diff --cached --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Index changed during verification.' }
          }
          else {
            Write-Host 'Git metadata is unavailable on this secondary self-hosted runner; actions/checkout exact-revision archive was used and PR verification is read-only.'
          }
