name: Extract dashboard charts Wave 51
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/tabs/dashboard.py"
      - "spina_app/theme_palettes.py"
      - "spina_app/ui_helpers.py"
      - "tools/plan_high_volume_wave_51.py"
      - "tools/inspect_dashboard_charts_wave_51.py"
      - "tools/extract_dashboard_charts_wave_51.py"
      - "tools/test_dashboard_chart_presentation_wave_51.py"
      - "tools/test_dashboard_chart_widget_smoke_wave_51.py"
      - ".github/workflows/plan-high-volume-wave-51.yml"
      - ".github/workflows/extract-dashboard-charts-wave-51.yml"
permissions:
  contents: write
concurrency:
  group: extract-dashboard-charts-wave-51-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  extract:
    if: github.head_ref == 'agent/high-volume-wave-51'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile guarded extractor and tests
        shell: cmd
        run: |
          python -m py_compile tools/extract_dashboard_charts_wave_51.py
          python -m py_compile tools/test_dashboard_chart_presentation_wave_51.py
          python -m py_compile tools/test_dashboard_chart_widget_smoke_wave_51.py
      - name: Apply guarded dashboard-chart extraction
        shell: cmd
        run: python tools/extract_dashboard_charts_wave_51.py
      - name: Compile application and dashboard modules
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/dashboard_chart_presentation.py
          python -m py_compile spina_app/tabs/dashboard.py
          python -m py_compile tools/test_dashboard_chart_presentation_wave_51.py
          python -m py_compile tools/test_dashboard_chart_widget_smoke_wave_51.py
          python -m compileall -q spina_app
      - name: Run exact Wave 51 regression
        shell: cmd
        run: python tools/test_dashboard_chart_presentation_wave_51.py
      - name: Run real Tkinter chart smoke test
        shell: cmd
        run: python tools/test_dashboard_chart_widget_smoke_wave_51.py
      - name: Run protected Dashboard Wave 28 regression
        shell: cmd
        run: python -m tools.test_dashboard_presentation_wave_28
      - name: Run protected Theme Wave 35 regression
        shell: cmd
        run: python -m tools.test_theme_presentation_wave_35
      - name: Run protected UI button Wave 50 regressions
        shell: cmd
        run: |
          python tools/test_ui_button_factories_wave_50.py
          python tools/test_ui_button_factories_widget_smoke_wave_50.py
      - name: Remove temporary Wave 51 files
        shell: cmd
        run: |
          git rm tools/plan_high_volume_wave_51.py
          git rm tools/inspect_dashboard_charts_wave_51.py
          git rm tools/extract_dashboard_charts_wave_51.py
          git rm .github/workflows/plan-high-volume-wave-51.yml
          git rm .github/workflows/extract-dashboard-charts-wave-51.yml
      - name: Generate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-51-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-51-quality.json
      - name: Commit guarded Wave 51 extraction
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/dashboard_chart_presentation.py tools/test_dashboard_chart_presentation_wave_51.py tools/test_dashboard_chart_widget_smoke_wave_51.py architecture-map.json docs/architecture
          git commit -m "Extract dashboard chart presentation Wave 51"
          git push origin HEAD:${{ github.head_ref }}
