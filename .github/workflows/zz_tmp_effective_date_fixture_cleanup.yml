name: Temporary effective-date fixture cleanup

on:
  push:
    branches:
      - mobile/ca4-collector-ui
    paths:
      - 'tools/tmp_fix_effective_date_fixture.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Fix stale contractual collection test fixture
        shell: cmd
        run: python tools\tmp_fix_effective_date_fixture.py
