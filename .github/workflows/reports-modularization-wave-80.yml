name: Reports modularization Wave 80

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/client_statement_generation.py"
      - "spina_app/report_controller.py"
      - "spina_app/report_engine.py"
      - "spina_app/reports_tab_presentation.py"
      - "spina_app/features/reports.py"
      - "spina_app/repositories/reports.py"
      - "spina_app/services/reports.py"
      - "tools/apply_reports_modularization_wave_80.py"
      - "tools/test_reports_layers_wave_80.py"
      - "tools/test_reports_feature_wave_80.py"
      - "tools/test_reports_extraction_wave_80.py"
      - "tools/test_reports_legacy_compat_wave_80.py"
      - "tools/test_calculation_regressions_wave_74.py"
      - "tools/test_x7_fixed_interest_basis_wave_74.py"
      - "docs/reports-modularization-wave-80.md"
      - ".github/workflows/reports-modularization-wave-80.yml"
  workflow_dispatch:

concurrency:
  group: reports-wave-80-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    outputs:
      generated: ${{ steps.architecture.outputs.generated }}

    steps:
      - name: Check out exact Wave 80 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Detect committed architecture
        id: architecture
        shell: cmd
        run: |
          python -c "import os; from pathlib import Path; p=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py'); s=p.read_text(encoding='utf-8'); v='false' if '# --- BEGIN: Reports feature installer Wave 80 ---' in s else 'true'; open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write('generated='+v+'\n'); print('Production generation required:',v)"

      - name: Compile staged Reports layers and extractor
        shell: cmd
        run: |
          python -m py_compile spina_app\report_controller.py
          python -m py_compile spina_app\repositories\reports.py
          python -m py_compile spina_app\services\reports.py
          python -m py_compile tools\apply_reports_modularization_wave_80.py
          python -m py_compile tools\test_reports_layers_wave_80.py
          python -m py_compile tools\test_calculation_regressions_wave_74.py
          python -m py_compile tools\test_x7_fixed_interest_basis_wave_74.py

      - name: Run staged Reports layer regressions
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_reports_layers_wave_80.py

      - name: Apply guarded Reports extraction twice
        shell: cmd
        run: |
          python tools\apply_reports_modularization_wave_80.py
          python tools\apply_reports_modularization_wave_80.py

      - name: Compile complete Reports architecture
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\client_statement_generation.py
          python -m py_compile spina_app\report_controller.py
          python -m py_compile spina_app\report_engine.py
          python -m py_compile spina_app\reports_tab_presentation.py
          python -m py_compile spina_app\features\reports.py
          python -m py_compile tools\test_reports_feature_wave_80.py
          python -m py_compile tools\test_reports_extraction_wave_80.py
          python -m py_compile tools\test_reports_legacy_compat_wave_80.py

      - name: Run complete Reports regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_reports_layers_wave_80.py
          set "PYTHONPATH=%CD%" && python tools\test_reports_feature_wave_80.py
          set "PYTHONPATH=%CD%" && python tools\test_reports_extraction_wave_80.py

      - name: Run legacy Reports capability compatibility
        shell: cmd
        run: |
          if exist tools\test_reports_feature_wave_18.py set "PYTHONPATH=%CD%" && python tools\test_reports_feature_wave_18.py
          set "PYTHONPATH=%CD%" && python tools\test_reports_legacy_compat_wave_80.py

      - name: Run Collector Route and financial compatibility
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_collector_route_feature_wave_79.py
          set "PYTHONPATH=%CD%" && python tools\test_collector_route_extraction_wave_79.py
          set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py
          set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py
          set "PYTHONPATH=%CD%" && python tools\test_x7_fixed_interest_basis_wave_74.py

      - name: Check generated diff
        shell: cmd
        run: git diff --check

      - name: Upload validated generated Reports files
        if: steps.architecture.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-wave-80-generated
          path: |
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
            spina_app/report_engine.py
          if-no-files-found: error

  publish-generated:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      needs.validate.outputs.generated == 'true' &&
      github.event_name == 'pull_request' &&
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out exact validated head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download validated Reports files
        uses: actions/download-artifact@v4
        with:
          name: reports-wave-80-generated
          path: generated-wave80

      - name: Copy and verify two-file scope
        shell: cmd
        run: |
          copy /Y generated-wave80\OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if not exist spina_app mkdir spina_app
          copy /Y generated-wave80\spina_app\report_engine.py spina_app\report_engine.py
          rmdir /S /Q generated-wave80
          python -c "import subprocess; allowed={'OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py','spina_app/report_engine.py'}; changed={p.replace('\\','/') for p in subprocess.check_output(['git','status','--short'], text=True).splitlines() for p in [p[3:].strip()]}; assert changed == allowed, (changed, allowed); print('Validated publish scope:', sorted(changed))"

      - name: Commit validated Reports architecture
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/report_engine.py
          git commit -m "Complete Reports modularization Wave 80"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
