name: Modularization Wave 22 inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/modularization-wave-22-inventory'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile inventory tool
        shell: cmd
        run: python -m py_compile tools\inventory_modularization_wave_22.py

      - name: Inspect current-main feature groups
        shell: cmd
        run: python -m tools.inventory_modularization_wave_22

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: modularization-wave-22-inventory
          path: wave-22-inventory.json
