name: Extract Data Bank Feature Wave 72

on:
  pull_request:
    branches:
      - main
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "architecture-map.json"
      - "spina_app/databank_*.py"
      - "spina_app/tabs/data_bank_shell.py"
      - "tools/inspect_databank_feature_wave_72.py"
      - "tools/extract_databank_feature_wave_72.py"
      - "tools/test_databank_feature_wave_72.py"
      - "tools/run_databank_regression_suite_wave_72.py"
      - ".github/workflows/extract-databank-feature-wave-72.yml"
  push:
    branches:
      - agent/high-volume-wave-72
    paths:
      - "tools/extract_databank_feature_wave_72.py"
      - "tools/test_databank_feature_wave_72.py"
      - "tools/run_databank_regression_suite_wave_72.py"
      - ".github/workflows/extract-databank-feature-wave-72.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-databank-feature-wave-72-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out Wave 72 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-72
          fetch-depth: 0
          show-progress: false

      - name: Compile guards and permanent tests
        run: |
          python -m py_compile tools\inspect_databank_feature_wave_72.py
          python -m py_compile tools\extract_databank_feature_wave_72.py
          python -m py_compile tools\test_databank_feature_wave_72.py
          python -m py_compile tools\run_databank_regression_suite_wave_72.py

      - name: Reconfirm exact 2,993-line Data Bank boundary
        run: python tools\inspect_databank_feature_wave_72.py

      - name: Generate module and remove exact desktop roots
        run: python tools\extract_databank_feature_wave_72.py

      - name: Compile cleaned application and Data Bank modules
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_feature.py
          python -m compileall -q spina_app
          python -m compileall -q tools

      - name: Run permanent Wave 72 structural regression
        run: python -m tools.test_databank_feature_wave_72

      - name: Run every discovered Data Bank regression
        run: python -m tools.run_databank_regression_suite_wave_72

      - name: Regenerate and validate architecture maps
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-72-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-72-quality.json

      - name: Commit validated Data Bank feature extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_feature.py architecture-map.json docs\architecture
          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 exit /b 0
          git commit -m "Extract complete Data Bank feature Wave 72"
          git push origin HEAD:agent/high-volume-wave-72

      - name: Upload Wave 72 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave72-databank-feature-reports
          path: |
            wave72_databank_exact_inventory.json
            artifacts/wave-72-*.json
          if-no-files-found: warn
