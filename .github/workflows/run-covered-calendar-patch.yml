name: Run covered calendar patch

# Emit the generated patch on a temporary branch for connector-controlled adoption.
on:
  push:
    branches:
      - agent/cross-collector-payment-notifications
    paths:
      - .github/workflows/run-covered-calendar-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-collector-payment-notifications
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_covered_calendar.py
      - name: Commit patch
        run: |
          git config user.name "GILBIC"
          git config user.email "gilbic@users.noreply.github.com"
          git rm .github/workflows/run-covered-calendar-patch.yml
          git rm .github/workflows/patch-covered-calendar-indicators.yml
          git rm .github/scripts/patch_covered_calendar.py
          git add gilbic_mobile/lib/src/features/collector/collection_entry_page.dart
          git add gilbic_mobile/test/collection_entry_page_test.dart
          git diff --check
          git commit -m "Show every selected covered date on calendar"
          git push --force origin HEAD:agent/calendar-circle-patch-output
