name: Apply Final Architecture Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/architecture-map-wave-27'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out architecture branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-map-wave-27
          fetch-depth: 0

      - name: Regenerate and validate final current map
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Remove temporary refresh workflow
        shell: cmd
        run: del .github\workflows\apply-final-architecture-refresh.yml

      - name: Commit and push final current maps
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add architecture-map.json docs\architecture .github\workflows\apply-final-architecture-refresh.yml
          git diff --cached --quiet && exit /b 0
          git commit -m "Refresh final architecture map after review cleanup"
          git push origin HEAD:agent/architecture-map-wave-27
