name: Spina DigitalOcean Deployment Contract

on:
  push:
    branches:
      - ops/digitalocean-production
    paths:
      - .github/workflows/spina-digitalocean-contract.yml
      - .github/workflows/spina-digitalocean-deploy.yml
      - ops/digitalocean/**
      - tools/test_digitalocean_deployment_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify deployment contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/test_digitalocean_deployment_contract.py
          bash -n ops/digitalocean/bootstrap.sh
