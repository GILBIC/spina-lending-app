name: Stage 5B Linux validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage5b-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e ./spina_backend_mobile
          python -m pip install --disable-pip-version-check -e './gilbic_backend[test]'

      - name: Compile backend Python
        run: python -m compileall -q gilbic_backend/src spina_backend_mobile/src

      - name: Run backend and database tests
        env:
          GILBIC_TEST_DATABASE_URL: ${{ secrets.GILBIC_TEST_DATABASE_URL }}
        run: python -m pytest -q gilbic_backend/tests spina_backend_mobile/tests

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        working-directory: gilbic_mobile
        run: flutter pub get

      - name: Analyze Flutter application
        working-directory: gilbic_mobile
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        working-directory: gilbic_mobile
        run: flutter test

      - name: Build Android debug APK in generated host
        run: |
          HOST="$RUNNER_TEMP/gilbic-android-host"
          APK_OUT="$GITHUB_WORKSPACE/gilbic_mobile/build/app/outputs/flutter-apk"
          rm -rf "$HOST"
          mkdir -p "$HOST"
          cd "$HOST"
          flutter create --platforms=android --org com.spinalending --project-name gilbic_mobile .
          rm -rf lib
          cp -R "$GITHUB_WORKSPACE/gilbic_mobile/lib" lib
          cp "$GITHUB_WORKSPACE/gilbic_mobile/pubspec.yaml" pubspec.yaml
          flutter pub get
          flutter build apk --debug --no-pub
          mkdir -p "$APK_OUT"
          cp build/app/outputs/flutter-apk/app-debug.apk "$APK_OUT/app-debug.apk"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spina-stage5b-linux-${{ github.sha }}
          path: gilbic_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Require a clean committed tree
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
