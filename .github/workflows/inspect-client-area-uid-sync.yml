name: Inspect client Area UID sync points

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact client commit points
        run: python tools/inspect_client_area_uid_sync_points.py
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/client_area_uid_sync_points.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record client Area UID sync points"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
