name: Apply client and route tree style batch 12

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/client-route-tree-style-batch-12'
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guarded extraction inputs
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/ui_controls.py \
            tools/extract_pure_helper_batch.py \
            tools/test_client_route_tree_style_batch_12.py

      - name: Verify exact original source state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/client_route_tree_style_batch_12_manifest.json

      - name: Capture original behavior
        run: |
          PYTHONPATH=. python tools/test_client_route_tree_style_batch_12.py \
            --manifest tools/fixtures/client_route_tree_style_batch_12_manifest.json \
            --fixture tools/fixtures/client_route_tree_style_batch_12_behavior.json \
            --write-fixture

      - name: Apply guarded extraction
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/client_route_tree_style_batch_12_manifest.json \
            --apply

      - name: Verify extracted behavior and compilation
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/ui_controls.py \
            tools/test_client_route_tree_style_batch_12.py
          PYTHONPATH=. python tools/test_client_route_tree_style_batch_12.py \
            --manifest tools/fixtures/client_route_tree_style_batch_12_manifest.json \
            --fixture tools/fixtures/client_route_tree_style_batch_12_behavior.json

      - name: Commit verified extraction and remove write workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-client-route-tree-style-batch-12.yml
          git add -A
          git commit -m "Extract Clients and Collector Route tree styles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
