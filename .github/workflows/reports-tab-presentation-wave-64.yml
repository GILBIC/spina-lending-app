name: Reports Tab Presentation Wave 64

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/reports_tab_presentation.py"
      - "tools/test_reports_tab_presentation_wave_64.py"
      - "tools/test_reports_tab_widget_smoke_wave_64.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/reports-tab-presentation-wave-64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-tab-presentation-wave-64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-64'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\reports_tab_presentation.py
          python -m py_compile tools\test_reports_tab_presentation_wave_64.py
          python -m py_compile tools\test_reports_tab_widget_smoke_wave_64.py

      - name: Run Wave 64 exact extraction regression
        shell: cmd
        run: python -m tools.test_reports_tab_presentation_wave_64

      - name: Run Wave 64 real Tkinter regression
        shell: cmd
        run: python -m tools.test_reports_tab_widget_smoke_wave_64

      - name: Run protected Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_editor_presentation_wave_60
          python -m tools.test_databank_editor_widget_smoke_wave_60
          python -m tools.test_databank_cell_writes_wave_61
          python -m tools.test_databank_cell_writes_behavior_wave_61
          python -m tools.test_databank_delete_day_wave_62
          python -m tools.test_databank_delete_day_behavior_wave_62
          python -m tools.test_databank_delete_day_password_gate_wave_63

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-64-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-64-quality.json

      - name: Upload Wave 64 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-tab-presentation-wave-64-reports
          path: artifacts/wave-64-*.json
          if-no-files-found: warn
