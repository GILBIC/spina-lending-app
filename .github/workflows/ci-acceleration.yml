name: CI acceleration validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/ci-acceleration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Validate workflow acceleration
        shell: cmd
        run: |
          python -m py_compile tools\test_ci_acceleration.py
          python -m tools.test_ci_acceleration
