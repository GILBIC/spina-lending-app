name: Plan Data Bank writes Wave 61

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_databank_writes_wave61_tmp.py"
      - ".github/workflows/plan-databank-writes-wave-61.yml"
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plan-databank-writes-wave-61-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-61'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out Wave 61 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Analyze exact write boundary
        shell: cmd
        run: python tools\plan_databank_writes_wave61_tmp.py
      - name: Commit planning report
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave-61-plan.md
          git commit -m "Document Wave 61 Data Bank write boundary"
          git push origin HEAD:agent/high-volume-wave-61
