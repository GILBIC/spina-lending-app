name: Plan System Data presentation Wave 55

on:
  push:
    branches:
      - agent/high-volume-wave-55
    paths:
      - "tools/plan_system_data_presentation_wave_55.py"
      - ".github/workflows/plan-system-data-presentation-wave-55.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_system_data_presentation_wave_55.py"
      - ".github/workflows/plan-system-data-presentation-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Compile planner
        shell: cmd
        run: python -m py_compile tools\plan_system_data_presentation_wave_55.py
      - name: Inspect exact System Data methods
        shell: cmd
        run: python -m tools.plan_system_data_presentation_wave_55
