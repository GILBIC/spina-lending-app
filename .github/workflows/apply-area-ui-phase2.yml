name: Apply hierarchical Area UI Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact source and modules
        run: |
          python -m py_compile \
            spina_app/area_hierarchy.py \
            spina_app/area_hierarchy_ops.py \
            spina_app/area_hierarchy_ui.py \
            tools/apply_hierarchical_area_ui_phase2.py \
            tools/test_hierarchical_area_ui_phase2.py \
            tools/test_hierarchical_area_ui_phase2_source.py
          python tools/apply_hierarchical_area_ui_phase2.py
          PYTHONPATH=. python tools/test_hierarchical_area_ui_phase2.py
      - name: Apply guarded UI patch
        run: python tools/apply_hierarchical_area_ui_phase2.py --apply
      - name: Compile and retest
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/area_hierarchy.py \
            spina_app/area_hierarchy_ops.py \
            spina_app/area_hierarchy_ui.py \
            tools/apply_hierarchical_area_ui_phase2.py \
            tools/test_hierarchical_area_ui_phase2.py \
            tools/test_hierarchical_area_ui_phase2_source.py
          python tools/apply_hierarchical_area_ui_phase2.py
          PYTHONPATH=. python tools/test_hierarchical_area_ui_phase2.py
          PYTHONPATH=tools:. python tools/test_hierarchical_area_ui_phase2_source.py
      - name: Commit Phase 2 app wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire hierarchical Area manager and selectors"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
