name: Combined Pay + renewal disposable PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gilbic_backend/sql/0100_add_atomic_combined_collections.sql"
      - "gilbic_backend/sql/0101_add_collector_renewal_workflow.sql"
      - "gilbic_backend/src/gilbic_backend/combined_collection_api.py"
      - "gilbic_backend/src/gilbic_backend/renewal_repository.py"
      - "gilbic_backend/src/gilbic_backend/renewal_workflow_api.py"
      - "gilbic_backend/src/gilbic_backend/renewal_workflow_query_api.py"
      - "gilbic_backend/src/gilbic_backend/collector_route_renewal_repository.py"
      - "gilbic_backend/src/gilbic_backend/seven_by_seven_collector_route.py"
      - "gilbic_backend/tests/test_combined_collection_renewal_workflow_postgres.py"
      - "tools/apply_0100_0101_collection_renewal_migrations.py"
      - "tools/run_combined_collection_renewal_disposable_postgres_validation.py"
      - ".github/workflows/combined-renewal-disposable-postgres.yml"

permissions:
  contents: read

concurrency:
  group: combined-renewal-disposable-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      COMBINED_RENEWAL_PG_PORT: '55500'
      COMBINED_RENEWAL_PG_USER: combinedrenewal
      COMBINED_RENEWAL_DATABASE_URL: postgresql://combinedrenewal@127.0.0.1:55500/postgres?sslmode=disable

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: false

      - name: Define isolated PostgreSQL paths
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $clusterBase = [System.IO.Path]::GetFullPath(
            (Join-Path $env:RUNNER_TEMP '..\spina-combined-renewal-clusters')
          ).TrimEnd('\')
          $runRoot = Join-Path $clusterBase (
            'run-{0}-attempt-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          @(
            "COMBINED_RENEWAL_CLUSTER_BASE=$clusterBase",
            "COMBINED_RENEWAL_RUN_ROOT=$runRoot",
            "COMBINED_RENEWAL_PG_DATA=$(Join-Path $runRoot 'pgdata')",
            "COMBINED_RENEWAL_PG_LOG=$(Join-Path $runRoot 'postgres.log')",
            "COMBINED_RENEWAL_OWNERSHIP_MARKER=$(Join-Path $runRoot 'cluster-owned.marker')"
          ) | ForEach-Object {
            $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Discover local PostgreSQL binaries
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgBin = $null
          $initdb = Get-Command initdb.exe -ErrorAction SilentlyContinue
          if ($initdb) { $pgBin = Split-Path -Parent $initdb.Source }
          if (-not $pgBin) {
            foreach ($root in @('C:\Program Files\PostgreSQL', 'C:\Program Files (x86)\PostgreSQL')) {
              if (-not (Test-Path $root)) { continue }
              $candidate = Get-ChildItem $root -Directory |
                ForEach-Object { Join-Path $_.FullName 'bin' } |
                Where-Object {
                  (Test-Path (Join-Path $_ 'initdb.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_ctl.exe')) -and
                  (Test-Path (Join-Path $_ 'pg_isready.exe'))
                } | Select-Object -First 1
              if ($candidate) { $pgBin = $candidate; break }
            }
          }
          if (-not $pgBin) {
            throw 'No local PostgreSQL binaries were found. Refusing to use any remote database.'
          }
          "COMBINED_RENEWAL_PG_BIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reap orphaned owned combined-renewal clusters
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $pgCtl = Join-Path $env:COMBINED_RENEWAL_PG_BIN 'pg_ctl.exe'
          New-Item -ItemType Directory -Force -Path $env:COMBINED_RENEWAL_CLUSTER_BASE | Out-Null
          Get-ChildItem $env:COMBINED_RENEWAL_CLUSTER_BASE -Directory -Filter 'run-*-attempt-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              if ($_.FullName -eq $env:COMBINED_RENEWAL_RUN_ROOT) { return }
              $marker = Join-Path $_.FullName 'cluster-owned.marker'
              $pgData = Join-Path $_.FullName 'pgdata'
              if (-not (Test-Path $marker) -or -not (Test-Path $pgData)) { return }
              & $pgCtl -D $pgData status 2>$null
              if ($LASTEXITCODE -eq 0) {
                & $pgCtl -D $pgData -m immediate -w stop
                if ($LASTEXITCODE -ne 0) { throw "Failed to stop owned orphan $($_.FullName)." }
              }
              elseif ($LASTEXITCODE -ne 3) {
                throw "Could not verify owned orphan state at $($_.FullName)."
              }
              Remove-Item -Recurse -Force $_.FullName
            }

      - name: Initialize isolated temporary PostgreSQL cluster
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:COMBINED_RENEWAL_RUN_ROOT) {
            Remove-Item -Recurse -Force $env:COMBINED_RENEWAL_RUN_ROOT
          }
          New-Item -ItemType Directory -Force -Path $env:COMBINED_RENEWAL_RUN_ROOT | Out-Null

          $probe = New-Object System.Net.Sockets.TcpClient
          try {
            $probe.Connect('127.0.0.1', [int]$env:COMBINED_RENEWAL_PG_PORT)
            throw "Reserved test port $env:COMBINED_RENEWAL_PG_PORT is already in use."
          }
          catch [System.Net.Sockets.SocketException] { }
          finally { $probe.Dispose() }

          $initdb = Join-Path $env:COMBINED_RENEWAL_PG_BIN 'initdb.exe'
          $pgCtl = Join-Path $env:COMBINED_RENEWAL_PG_BIN 'pg_ctl.exe'
          $pgReady = Join-Path $env:COMBINED_RENEWAL_PG_BIN 'pg_isready.exe'
          & $initdb -D $env:COMBINED_RENEWAL_PG_DATA -U $env:COMBINED_RENEWAL_PG_USER --auth=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed.' }
          "run_id=$env:GITHUB_RUN_ID`npgdata=$env:COMBINED_RENEWAL_PG_DATA" |
            Set-Content -Path $env:COMBINED_RENEWAL_OWNERSHIP_MARKER -Encoding ascii
          & $pgCtl -D $env:COMBINED_RENEWAL_PG_DATA -l $env:COMBINED_RENEWAL_PG_LOG -o "-p $env:COMBINED_RENEWAL_PG_PORT -h 127.0.0.1" -w start
          if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster failed to start.' }
          & $pgReady -h 127.0.0.1 -p $env:COMBINED_RENEWAL_PG_PORT -U $env:COMBINED_RENEWAL_PG_USER -d postgres
          if ($LASTEXITCODE -ne 0) { throw 'Temporary PostgreSQL cluster is not ready.' }

      - name: Run disposable combined Pay and renewal validation
        shell: cmd
        run: |
          python tools\run_combined_collection_renewal_disposable_postgres_validation.py

      - name: Stop and delete temporary PostgreSQL cluster
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:COMBINED_RENEWAL_PG_BIN -and (Test-Path $env:COMBINED_RENEWAL_PG_DATA)) {
            $pgCtl = Join-Path $env:COMBINED_RENEWAL_PG_BIN 'pg_ctl.exe'
            & $pgCtl -D $env:COMBINED_RENEWAL_PG_DATA status 2>$null
            if ($LASTEXITCODE -eq 0) {
              & $pgCtl -D $env:COMBINED_RENEWAL_PG_DATA -m fast -w stop
              if ($LASTEXITCODE -ne 0) {
                & $pgCtl -D $env:COMBINED_RENEWAL_PG_DATA -m immediate -w stop
              }
            }
          }
          if ($env:COMBINED_RENEWAL_RUN_ROOT -and (Test-Path $env:COMBINED_RENEWAL_RUN_ROOT)) {
            Remove-Item -Recurse -Force $env:COMBINED_RENEWAL_RUN_ROOT
          }
          if ($env:COMBINED_RENEWAL_RUN_ROOT -and (Test-Path $env:COMBINED_RENEWAL_RUN_ROOT)) {
            throw 'Temporary combined-renewal run directory was not removed.'
          }

      - name: Require a clean committed tree
        if: always()
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
