name: Import Log presentation Wave 53
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/import_log_presentation.py"
      - "tools/test_import_log_presentation_wave_53.py"
      - "tools/test_import_log_widget_smoke_wave_53.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/import-log-presentation-wave-53.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-log-presentation-wave-53-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-53'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\import_log_presentation.py
          python -m py_compile tools\test_import_log_presentation_wave_53.py
          python -m py_compile tools\test_import_log_widget_smoke_wave_53.py
          python -m compileall -q spina_app

      - name: Run exact Wave 53 regression
        shell: cmd
        run: python -m tools.test_import_log_presentation_wave_53

      - name: Run real Tkinter and fallback-save smoke test
        shell: cmd
        run: python -m tools.test_import_log_widget_smoke_wave_53

      - name: Run protected Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python tools\test_databank_presentation_wave_49.py
          python tools\test_databank_widget_smoke_wave_49.py

      - name: Run protected long-task, theme, and navigation regressions
        shell: cmd
        run: |
          python -m tools.test_long_task_presentation_wave_42
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Validate permanent architecture map
        shell: cmd
        run: python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-53-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-53-quality.json

      - name: Upload Wave 53 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log-presentation-wave-53-reports
          path: artifacts/wave-53-*.json
          if-no-files-found: warn
