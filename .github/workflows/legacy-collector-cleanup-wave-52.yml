name: Legacy Collector Route cleanup Wave 52
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/ui_controls.py"
      - "spina_app/collector_tab_presentation.py"
      - "spina_app/login_dialog_presentation.py"
      - "tools/apply_legacy_collector_cleanup_wave_52.py"
      - "tools/test_legacy_collector_cleanup_wave_52.py"
      - "tools/test_ui_button_factories_wave_50.py"
      - "tools/test_ui_button_factories_widget_smoke_wave_50.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/legacy-collector-cleanup-wave-52.yml"
permissions:
  contents: write
concurrency:
  group: legacy-collector-cleanup-wave-52-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.head_ref == 'agent/high-volume-wave-52'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Apply one-time Wave 52 cleanup
        if: ${{ hashFiles('tools/apply_legacy_collector_cleanup_wave_52.py') != '' }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/apply_legacy_collector_cleanup_wave_52.py
          $bootstrapCode = $LASTEXITCODE
          if ($bootstrapCode -ne 0) {
            if (Test-Path artifacts/wave-52-bootstrap.txt) {
              git add artifacts/wave-52-bootstrap.txt
              git commit -m "Record Wave 52 bootstrap diagnostic"
              git push origin "HEAD:${{ github.head_ref }}"
            }
            exit $bootstrapCode
          }
          Remove-Item tools/apply_legacy_collector_cleanup_wave_52.py
          if (Test-Path artifacts/wave-52-bootstrap.txt) {
            Remove-Item artifacts/wave-52-bootstrap.txt
          }
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/ui_controls.py tools/apply_legacy_collector_cleanup_wave_52.py artifacts/wave-52-bootstrap.txt
          git commit -m "Remove obsolete Collector Route presentation layer"
          python tools/generate_architecture_map.py
          git add architecture-map.json docs/architecture
          git commit -m "Refresh architecture map for Wave 52"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Compile application, modules, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/ui_controls.py
          python -m py_compile spina_app/collector_tab_presentation.py
          python -m py_compile spina_app/login_dialog_presentation.py
          python -m py_compile tools/test_legacy_collector_cleanup_wave_52.py
          python -m py_compile tools/test_ui_button_factories_wave_50.py
          python -m py_compile tools/test_ui_button_factories_widget_smoke_wave_50.py
          python -m compileall -q spina_app
      - name: Run exact Wave 52 cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_collector_cleanup_wave_52
      - name: Run active UI button regressions
        shell: cmd
        run: |
          python tools/test_ui_button_factories_wave_50.py
          python tools/test_ui_button_factories_widget_smoke_wave_50.py
      - name: Run active Collector Route regressions
        shell: cmd
        run: |
          python -m tools.test_collector_tab_presentation_wave_44
          python -m tools.test_collector_tab_widget_smoke_wave_44
          python -m tools.test_collectors_editor_wave_26
          python -m tools.test_collector_refresh_presentation_wave_39
          python -m tools.test_collector_dialog_presentation_wave_43
      - name: Run protected login and navigation regressions
        shell: cmd
        run: |
          python -m tools.test_login_dialog_presentation_wave_45
          python -m tools.test_account_header_presentation_wave_46
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48
      - name: Run protected theme and Dashboard regressions
        shell: cmd
        run: |
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_dashboard_presentation_wave_28
          python tools/test_dashboard_chart_presentation_wave_51.py
          python tools/test_dashboard_chart_widget_smoke_wave_51.py
      - name: Validate permanent architecture map
        shell: cmd
        run: python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-52-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-52-quality.json
      - name: Upload Wave 52 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-collector-cleanup-wave-52-reports
          path: artifacts/wave-52-*
          if-no-files-found: warn
