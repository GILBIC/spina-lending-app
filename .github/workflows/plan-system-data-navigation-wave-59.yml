name: Plan System Data navigation Wave 59

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_system_data_navigation_wave59_tmp.py"
      - ".github/workflows/plan-system-data-navigation-wave-59.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-system-data-navigation-wave-59-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-59'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Compile navigation analyzer
        shell: cmd
        run: python -m py_compile tools\plan_system_data_navigation_wave59_tmp.py
      - name: Analyze System Data navigation boundaries
        shell: cmd
        run: python tools\plan_system_data_navigation_wave59_tmp.py
      - name: Upload candidate report and sources
        uses: actions/upload-artifact@v4
        with:
          name: system-data-navigation-wave-59-candidates
          path: |
            artifacts/wave-59-system-data-navigation-candidates.json
            artifacts/wave-59-system-data-navigation-sources/*.py
          if-no-files-found: error
