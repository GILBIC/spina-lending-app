name: Update modularization map wave 12

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-map:
    if: github.event.pull_request.head.ref == 'agent/client-route-tree-style-batch-12'
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update permanent modularization map
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/modularization-map.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('> **Last updated:** 2026-07-23  ', '> **Last updated:** 2026-07-24  '),
              ('> **Tracked main state:** after merged PR #107  ', '> **Tracked main state:** after merged PR #109  '),
              ('| Focused helper functions extracted from the large desktop source | **52** |', '| Focused helper functions extracted from the large desktop source | **54** |'),
              ('| Accelerated modularization waves completed | **11** |', '| Accelerated modularization waves completed | **12** |'),
              ('| Latest completed extraction | **Wave 11 / PR #107** |', '| Latest completed extraction | **Wave 12 / PR #109** |'),
              ('| Next step | **Wave 12 read-only inspection** |', '| Next step | **Wave 13 read-only inspection** |'),
              ('| `spina_app/ui_controls.py` | Cash Control labeled entries and Treeview styling; Client Information Log buttons and Treeview styling | 4 |', '| `spina_app/ui_controls.py` | Cash Control labeled entries and Treeview styling; Client Information Log buttons and Treeview styling; Clients and Collector Route Treeview styling | 6 |'),
              ('| **Total** |  | **52** |', '| **Total** |  | **54** |'),
              ('  - `_spina_v24_cilog_style_tree` — PR #105\n', '  - `_spina_v24_cilog_style_tree` — PR #105\n  - `_spina_v23_style_clients_tree` — PR #109\n  - `_spina_v27_style_route_trees` — PR #109\n'),
              ('| 12 | Not started | — | — | Candidate must be selected by a fresh read-only inspection | ⏭ Next |', '| 12 | #108 inspection | #109 | `ui_controls.py` | Clients and Collector Route Treeview styling | ✅ Passed and merged |\n| 13 | Not started | — | — | Candidate must be selected by a fresh read-only inspection | ⏭ Next |'),
              ('| 12 | Pending | Pending | Pending | Pending | ⬜ | ⬜ | ⬜ | Start with current-main inspection |', '| 12 | #108 | #109 | `ui_controls.py` | Clients and Collector Route Treeview style helpers | ✅ | ✅ | ✅ | Passed Windows smoke test |\n| 13 | Pending | Pending | Pending | Pending | ⬜ | ⬜ | ⬜ | Start with current-main inspection |'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one map occurrence for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Updated Wave 12 modularization map with 54 helpers and 12 completed waves')
          PY

      - name: Commit map and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-modularization-map-wave-12.yml
          git add -A
          git commit -m "Update modularization map for Wave 12"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
