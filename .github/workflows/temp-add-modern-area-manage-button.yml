name: Temporary add modern Area manage button

on:
  push:
    branches:
      - agent/hierarchical-area-ui-phase-2
    paths:
      - .github/workflows/temp-add-modern-area-manage-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2

      - name: Add Manage Areas button and regression check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("spina_app/area_hierarchy_ui.py")
          ui_source = ui_path.read_text(encoding="utf-8")
          old = '''    ttk.Button(line, text="Clear", command=lambda: variable.set("")).pack(side="left", padx=(4, 0))
              return box, entry
          '''
          new = '''    ttk.Button(line, text="Clear", command=lambda: variable.set("")).pack(side="left", padx=(4, 0))
              ttk.Button(
                  line,
                  text="Manage Areas",
                  command=lambda: open_area_manager(app),
              ).pack(side="left", padx=(4, 0))
              return box, entry
          '''
          if old not in ui_source:
              raise SystemExit("Modern Area selector anchor was not found")
          if 'text="Manage Areas"' in ui_source:
              raise SystemExit("Manage Areas button already exists")
          ui_path.write_text(ui_source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tools/test_hierarchical_area_ui_phase2_source.py")
          test_source = test_path.read_text(encoding="utf-8")
          old_test = '''APP = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          '''
          new_test = '''APP = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          UI = Path("spina_app/area_hierarchy_ui.py")
          '''
          if old_test not in test_source:
              raise SystemExit("Source test path anchor was not found")
          test_source = test_source.replace(old_test, new_test, 1)

          old_assert = '''    assert source.count("App.open_areas_manager = _spina_area_open_manager") == 1
              compile(source, str(APP), "exec")
          '''
          new_assert = '''    assert source.count("App.open_areas_manager = _spina_area_open_manager") == 1
              ui_source = UI.read_text(encoding="utf-8")
              assert ui_source.count('text="Manage Areas"') == 1
              assert "command=lambda: open_area_manager(app)" in ui_source
              compile(source, str(APP), "exec")
              compile(ui_source, str(UI), "exec")
          '''
          if old_assert not in test_source:
              raise SystemExit("Source test assertion anchor was not found")
          test_path.write_text(test_source.replace(old_assert, new_assert, 1), encoding="utf-8")

          workflow = Path(".github/workflows/temp-add-modern-area-manage-button.yml")
          workflow.unlink()
          PY

      - name: Validate
        run: |
          python -m py_compile spina_app/area_hierarchy_ui.py tools/test_hierarchical_area_ui_phase2_source.py
          PYTHONPATH=tools:. python tools/test_hierarchical_area_ui_phase2_source.py

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose Area Management in modern client form"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2
