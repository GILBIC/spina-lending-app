name: Wave 68 Backup History Extractor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_wave68_backup_history_extraction.py"
      - ".github/workflows/wave68-backup-history-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave68-backup-history-extractor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-68'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 68 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply exact guarded extraction
        shell: cmd
        run: |
          python -m py_compile tools\apply_wave68_backup_history_extraction.py
          python -m tools.apply_wave68_backup_history_extraction

      - name: Compile application, module, and permanent tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\backup_history_presentation.py
          python -m py_compile tools\test_backup_history_presentation_wave_68.py
          python -m py_compile tools\test_backup_history_widget_smoke_wave_68.py
          python -m compileall -q spina_app

      - name: Run Wave 68 structural regression
        shell: cmd
        run: python -m tools.test_backup_history_presentation_wave_68

      - name: Run Wave 68 real Tkinter regression
        shell: cmd
        run: python -m tools.test_backup_history_widget_smoke_wave_68

      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-68-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-68-quality.json

      - name: Commit extracted source and permanent tests
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add spina_app\backup_history_presentation.py
          git add tools\test_backup_history_presentation_wave_68.py
          git add tools\test_backup_history_widget_smoke_wave_68.py
          git add architecture-map.json docs\architecture
          git diff --cached --quiet && exit /b 1
          git commit -m "Extract backup history presentation Wave 68"
          git push origin HEAD:${{ github.head_ref }}
