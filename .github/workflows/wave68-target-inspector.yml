name: Wave 68 Target Inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_wave68_backup_history.py"
      - ".github/workflows/wave68-target-inspector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave68-target-inspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-68'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact Wave 68 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Export exact guarded target
        shell: cmd
        run: |
          python -m py_compile tools\inspect_wave68_backup_history.py
          python -m tools.inspect_wave68_backup_history

      - name: Commit target review files
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave68-backup-history-source.txt docs\wave68-backup-history-meta.json
          git diff --cached --quiet && exit /b 0
          git commit -m "Add Wave 68 target review files"
          git push origin HEAD:${{ github.head_ref }}
