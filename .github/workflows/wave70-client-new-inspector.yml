name: Wave 70 Client New Inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/inspect_wave70_client_new.py"
      - ".github/workflows/wave70-client-new-inspector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave70-client-new-inspector-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-70'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 70 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile inspector and desktop source
        shell: cmd
        run: |
          python -m py_compile tools\inspect_wave70_client_new.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Inspect exact client-new boundary
        shell: cmd
        run: python -m tools.inspect_wave70_client_new

      - name: Commit reviewed source and metadata
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave70-client-new-meta.json docs\wave70-client-new-source.txt
          git diff --cached --quiet && exit /b 0
          git commit -m "Add Wave 70 client-new review metadata"
          git push origin HEAD:${{ github.head_ref }}
