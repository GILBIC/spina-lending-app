name: Patch Cash Control extractor Wave 21

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/cash-control-feature-wave-21'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out Wave 21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/cash-control-feature-wave-21
          fetch-depth: 0

      - name: Correct alias guard
        shell: cmd
        run: python tools\patch_cash_control_extractor_wave_21.py

      - name: Commit corrected extractor
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools\apply_cash_control_feature_wave_21.py
          git diff --cached --quiet && exit /b 0
          git commit -m "Accept verified Cash Control dependency aliases [skip ci]"
          git push origin HEAD:agent/cash-control-feature-wave-21
