name: Wave 71 Legacy Area Manager Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/area_hierarchy_ui.py"
      - "tools/remove_legacy_area_manager_wave_71.py"
      - "tools/test_legacy_area_manager_cleanup_wave_71.py"
      - ".github/workflows/wave71-legacy-area-manager-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave71-legacy-area-manager-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-and-validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-71'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 71 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile guarded cleanup and permanent regression
        shell: cmd
        run: |
          python -m py_compile tools\remove_legacy_area_manager_wave_71.py
          python -m py_compile tools\test_legacy_area_manager_cleanup_wave_71.py
          python -m py_compile spina_app\area_hierarchy.py
          python -m py_compile spina_app\area_hierarchy_ops.py
          python -m py_compile spina_app\area_hierarchy_ui.py

      - name: Remove exact inactive legacy manager
        shell: cmd
        run: python -m tools.remove_legacy_area_manager_wave_71

      - name: Compile cleaned application and area modules
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\area_hierarchy.py
          python -m py_compile spina_app\area_hierarchy_ops.py
          python -m py_compile spina_app\area_hierarchy_ui.py
          python -m compileall -q spina_app

      - name: Run Wave 71 exact cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_area_manager_cleanup_wave_71

      - name: Run protected area picker regression
        shell: cmd
        run: python -m tools.test_area_picker_presentation_wave_37

      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-71-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-71-quality.json

      - name: Commit validated cleanup and maps
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py architecture-map.json docs\architecture
          git diff --cached --quiet && exit /b 0
          git commit -m "Remove inactive legacy area manager Wave 71"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload Wave 71 audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-area-manager-wave-71-reports
          path: artifacts/wave-71-*.json
          if-no-files-found: warn
