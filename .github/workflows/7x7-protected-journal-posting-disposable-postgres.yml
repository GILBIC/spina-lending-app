name: 7x7 protected journal posting disposable PostgreSQL validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0066_add_protected_7x7_source_event_journal_posting.sql'
      - 'gilbic_backend/tests/test_7x7_protected_journal_posting_postgres.py'
      - 'tools/run_7x7_protected_journal_posting_disposable_postgres_validation.py'
      - '.github/workflows/7x7-protected-journal-posting-disposable-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0066_add_protected_7x7_source_event_journal_posting.sql'
      - 'gilbic_backend/tests/test_7x7_protected_journal_posting_postgres.py'
      - 'tools/run_7x7_protected_journal_posting_disposable_postgres_validation.py'
      - '.github/workflows/7x7-protected-journal-posting-disposable-postgres.yml'

permissions:
  contents: read

concurrency:
  group: seven-by-seven-journal-posting-disposable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-seven-by-seven-journal-posting:
    # Keep this destructive create/drop proof independent of whichever Windows
    # self-hosted runner is free. The verifier itself additionally rejects any
    # non-loopback PostgreSQL endpoint.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: x7post
          POSTGRES_PASSWORD: x7post_test_only
          POSTGRES_DB: postgres
        ports:
          - 55453:5432
        options: >-
          --health-cmd "pg_isready -U x7post -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      X7POST_DATABASE_URL: postgresql://x7post:x7post_test_only@127.0.0.1:55453/postgres?sslmode=disable

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install protected verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" "pytest>=8.3,<9"

      - name: Compile protected verifier
        run: |
          python -m py_compile tools/run_7x7_protected_journal_posting_disposable_postgres_validation.py
          python -m py_compile gilbic_backend/tests/test_7x7_protected_journal_posting_postgres.py

      - name: Execute protected 7x7 journal-posting proof
        run: |
          python tools/run_7x7_protected_journal_posting_disposable_postgres_validation.py --database-url-env X7POST_DATABASE_URL

      - name: Require a clean committed tree
        if: always()
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
