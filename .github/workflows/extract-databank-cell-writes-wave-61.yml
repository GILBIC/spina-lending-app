name: Extract Data Bank cell writes Wave 61

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/extract-databank-cell-writes-wave-61.yml"
      - "tools/extract_databank_cell_writes_wave61_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-databank-cell-writes-wave-61-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-61'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out Wave 61 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Extract exact write boundary
        shell: cmd
        run: python tools\extract_databank_cell_writes_wave61_tmp.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_cell_writes.py
          python -m py_compile tools\test_databank_cell_writes_wave_61.py
          python -m py_compile tools\test_databank_cell_writes_behavior_wave_61.py
          python -m compileall -q spina_app
      - name: Run exact write-boundary regression
        shell: cmd
        run: python -m tools.test_databank_cell_writes_wave_61
      - name: Run fake-database payment mutation behavior
        shell: cmd
        run: python -m tools.test_databank_cell_writes_behavior_wave_61
      - name: Run protected Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_databank_presentation_wave_49
          python -m tools.test_databank_widget_smoke_wave_49
          python -m tools.test_databank_import_control_wave_53
          python -m tools.test_system_data_presentation_wave_56
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_grid_widget_smoke_wave_59
          python -m tools.test_databank_editor_presentation_wave_60
          python -m tools.test_databank_editor_widget_smoke_wave_60
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-61-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-61-quality.json
      - name: Commit extraction and generated maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_cell_writes.py tools\test_databank_cell_writes_wave_61.py tools\test_databank_cell_writes_behavior_wave_61.py architecture-map.json docs\architecture
          git commit -m "Extract Data Bank cell writes for Wave 61"
          git push origin HEAD:agent/high-volume-wave-61
      - name: Upload Wave 61 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-cell-writes-wave-61-extraction-reports
          path: artifacts/wave-61-*.json
          if-no-files-found: warn
