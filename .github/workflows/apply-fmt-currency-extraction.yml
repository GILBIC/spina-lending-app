name: Apply fmt_currency extraction

on:
  push:
    branches:
      - agent/apply-fmt-currency-extraction

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect whether extraction is already applied
        id: state
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          app = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          source = app.read_text(encoding="utf-8")
          already = (
              "from spina_app.utilities.formatting import fmt_currency" in source
              and "def fmt_currency" not in source
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"already={'true' if already else 'false'}\n")
          PY

      - name: Run pre-extraction regression test
        if: steps.state.outputs.already != 'true'
        run: python tools/test_fmt_currency_extraction.py

      - name: Run and validate dry-run
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          python tools/extract_fmt_currency_module.py --json /tmp/fmt-currency-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("/tmp/fmt-currency-plan.json").read_text(encoding="utf-8"))
          assert plan["safe_to_apply"] is True
          assert plan["already_applied"] is False
          assert plan["external_loaded_names"] == []
          PY

      - name: Capture original behavior
        if: steps.state.outputs.already != 'true'
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          app = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          source = app.read_text(encoding="utf-8")
          tree = ast.parse(source)
          node = next(
              item for item in tree.body
              if isinstance(item, ast.FunctionDef) and item.name == "fmt_currency"
          )
          module = ast.Module(body=[node], type_ignores=[])
          ast.fix_missing_locations(module)
          namespace = {}
          exec(compile(module, "<original-fmt-currency>", "exec"), namespace)
          function = namespace["fmt_currency"]
          cases = [None, 0, 1, 1234.5, -42.75, "1000", "bad", ""]

          def capture(value):
              try:
                  return {"kind": "return", "repr": repr(function(value))}
              except Exception as exc:
                  return {
                      "kind": "raise",
                      "type": type(exc).__name__,
                      "message": str(exc),
                  }

          payload = {
              "cases": cases,
              "expected": [capture(value) for value in cases],
          }
          Path("/tmp/fmt-currency-behavior.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Apply guarded extraction
        if: steps.state.outputs.already != 'true'
        run: python tools/extract_fmt_currency_module.py --apply --json /tmp/fmt-currency-result.json

      - name: Validate generated application and module
        if: steps.state.outputs.already != 'true'
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/formatting.py
          python - <<'PY'
          import ast
          import json
          import sys
          from pathlib import Path

          repo = Path.cwd()
          sys.path.insert(0, str(repo))
          from spina_app.utilities.formatting import fmt_currency

          payload = json.loads(Path("/tmp/fmt-currency-behavior.json").read_text(encoding="utf-8"))

          def capture(value):
              try:
                  return {"kind": "return", "repr": repr(fmt_currency(value))}
              except Exception as exc:
                  return {
                      "kind": "raise",
                      "type": type(exc).__name__,
                      "message": str(exc),
                  }

          actual = [capture(value) for value in payload["cases"]]
          assert actual == payload["expected"]

          app = Path("OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py")
          source = app.read_text(encoding="utf-8")
          tree = ast.parse(source)
          assert not any(
              isinstance(node, ast.FunctionDef) and node.name == "fmt_currency"
              for node in tree.body
          )
          assert "from spina_app.utilities.formatting import fmt_currency" in source

          result = json.loads(Path("/tmp/fmt-currency-result.json").read_text(encoding="utf-8"))
          assert result["safe_to_apply"] is True
          assert result["applied"] is True
          PY

      - name: Replace regression test for extracted state
        if: steps.state.outputs.already != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/fmt-currency-behavior.json").read_text(encoding="utf-8"))
          cases = repr(payload["cases"])
          expected = repr(payload["expected"])
          test_source = f'''#!/usr/bin/env python3
          """Regression checks for the extracted fmt_currency utility."""

          from __future__ import annotations

          import ast
          import sys
          from pathlib import Path

          REPO_ROOT = Path(__file__).resolve().parents[1]
          if str(REPO_ROOT) not in sys.path:
              sys.path.insert(0, str(REPO_ROOT))

          from spina_app.utilities.formatting import fmt_currency

          APP_FILE = "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
          IMPORT_LINE = "from spina_app.utilities.formatting import fmt_currency"
          CASES = {cases}
          EXPECTED = {expected}


          def _capture(value):
              try:
                  return {{"kind": "return", "repr": repr(fmt_currency(value))}}
              except Exception as exc:
                  return {{
                      "kind": "raise",
                      "type": type(exc).__name__,
                      "message": str(exc),
                  }}


          def main() -> int:
              source = (REPO_ROOT / APP_FILE).read_text(encoding="utf-8")
              tree = ast.parse(source)
              assert IMPORT_LINE in source
              assert not any(
                  isinstance(node, ast.FunctionDef) and node.name == "fmt_currency"
                  for node in tree.body
              )
              assert [_capture(value) for value in CASES] == EXPECTED
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          normalized = "\n".join(line[10:] if line.startswith("          ") else line for line in test_source.splitlines()) + "\n"
          Path("tools/test_fmt_currency_extraction.py").write_text(normalized, encoding="utf-8")
          PY
          python tools/test_fmt_currency_extraction.py

      - name: Commit generated extraction
        if: steps.state.outputs.already != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/formatting.py \
            tools/test_fmt_currency_extraction.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Extract fmt_currency utility"
          git push origin HEAD:${GITHUB_REF_NAME}
