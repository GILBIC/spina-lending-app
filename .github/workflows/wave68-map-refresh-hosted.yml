name: Wave 68 Hosted Map Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/wave68-map-refresh-hosted.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave68-hosted-map-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-68'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Wave 68 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile structural boundary
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/backup_history_presentation.py
          python -m py_compile tools/test_backup_history_presentation_wave_68.py
          python -m compileall -q spina_app
          python -m tools.test_backup_history_presentation_wave_68

      - name: Regenerate and validate clean architecture maps
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Commit refreshed maps only
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs/architecture
          git diff --cached --quiet && exit 1
          git commit -m "Refresh clean Wave 68 architecture maps"
          git push origin HEAD:${{ github.head_ref }}
