name: SPINA Reliability & Performance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spina-reliability-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reliability-performance:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Create isolated reliability environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-reliability-ci-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          echo RELIABILITY_VENV=%VENV%>>"%GITHUB_ENV%"
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\spina_backend_mobile" -e ".\gilbic_backend[test]" || exit /b 1
          if not exist reliability-artifacts mkdir reliability-artifacts

      # These focused tests exercise concurrent retries, idempotent replay/conflict,
      # transaction commit/rollback, advisory-lock protection, and API replay behavior.
      - name: Run concurrency, idempotency, and atomicity regression tests
        shell: cmd
        env:
          GILBIC_TEST_DATABASE_URL: ""
        run: |
          "%RELIABILITY_VENV%\Scripts\python.exe" -m pytest -q spina_backend_mobile\tests\test_service.py spina_backend_mobile\tests\test_postgres_executor.py spina_backend_mobile\tests\test_router.py --durations=15 > reliability-artifacts\pytest-durations.txt 2>&1
          set "CODE=%ERRORLEVEL%"
          type reliability-artifacts\pytest-durations.txt
          if not "%CODE%"=="0" exit /b %CODE%

      - name: Publish reliability and timing baseline
        if: always()
        shell: cmd
        run: |
          echo ## SPINA Reliability ^& Performance>reliability-artifacts\summary.md
          echo.>>reliability-artifacts\summary.md
          echo Focused concurrency, idempotency, transaction atomicity, and request-replay regressions run on every PR. Pytest slowest-test durations provide the initial performance baseline; stricter regression thresholds can be added after enough stable measurements exist.>>reliability-artifacts\summary.md
          type reliability-artifacts\summary.md>>"%GITHUB_STEP_SUMMARY%"
          echo.>>"%GITHUB_STEP_SUMMARY%"
          if exist reliability-artifacts\pytest-durations.txt type reliability-artifacts\pytest-durations.txt>>"%GITHUB_STEP_SUMMARY%"

      - name: Persist full reliability reports on runner
        if: always()
        continue-on-error: true
        shell: cmd
        run: |
          python tools\persist_ci_report.py --source reliability-artifacts --root "C:\SPINA_CI_REPORTS" --lane reliability-performance --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" --run-id "${{ github.run_id }}" --workflow-name "SPINA Reliability & Performance" --keep 50

      - name: Print reliability deep review
        if: always()
        continue-on-error: true
        shell: cmd
        run: |
          python tools\render_ci_deep_review.py --root "C:\SPINA_CI_REPORTS" --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}" --lane reliability-performance

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
