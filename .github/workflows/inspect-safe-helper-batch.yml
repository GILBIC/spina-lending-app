name: Inspect safe helper batch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-pure-helper-scan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan conservative pure-helper candidates
        run: |
          python - <<'PY'
          import ast
          import builtins
          import json
          from pathlib import Path

          APP = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = APP.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)

          blocked_terms = {
              'payment', 'balance', 'interest', 'principal', 'renew', '7x7',
              'loan', 'report', 'pdf', 'collector', 'payroll', 'backup',
              'login', 'auth', 'role', 'postgres', 'database', 'sql', 'cashctl',
              'receipt', 'statement', 'advance', 'ledger', 'migration', 'migrate',
              'transaction', 'gcash', 'schedule', 'due_date', 'allocation',
          }
          blocked_names = {
              'tk', 'ttk', 'messagebox', 'filedialog', 'simpledialog', 'Toplevel',
              'Frame', 'Label', 'Button', 'Entry', 'Treeview', 'Canvas',
              'self', 'root', 'app', 'conn', 'cursor', 'cur', 'db', 'execute',
              'executemany', 'commit', 'rollback', 'psycopg', 'sqlite3',
              'open', 'Path', 'os', 'subprocess', 'threading', 'queue',
              'canvas', 'reportlab', 'Image', 'ImageTk', 'Workbook', 'load_workbook',
          }
          allowed_external = {
              're', 'datetime', 'date', 'timedelta', 'Decimal', 'math', 'json',
              '_as_note_dict', '_append_unique_text', '_merge_note_dict',
              '_spina_dash__parse_date', '_spina_cilog_fmt_money',
          }

          def loaded_names(node):
              local = {arg.arg for arg in (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)}
              if node.args.vararg:
                  local.add(node.args.vararg.arg)
              if node.args.kwarg:
                  local.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  if isinstance(child, ast.Name) and isinstance(child.ctx, (ast.Store, ast.Del)):
                      local.add(child.id)
              loaded = {
                  child.id for child in ast.walk(node)
                  if isinstance(child, ast.Name) and isinstance(child.ctx, ast.Load)
              }
              return sorted(loaded - local - set(dir(builtins)) - {node.name})

          def mutates_arguments(node):
              args = {arg.arg for arg in (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)}
              if node.args.vararg:
                  args.add(node.args.vararg.arg)
              if node.args.kwarg:
                  args.add(node.args.kwarg.arg)
              for child in ast.walk(node):
                  targets = []
                  if isinstance(child, ast.Assign):
                      targets.extend(child.targets)
                  elif isinstance(child, ast.AugAssign):
                      targets.append(child.target)
                  elif isinstance(child, ast.Delete):
                      targets.extend(child.targets)
                  for target in targets:
                      base = target
                      while isinstance(base, (ast.Attribute, ast.Subscript)):
                          base = base.value
                      if isinstance(base, ast.Name) and base.id in args:
                          return True
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Attribute):
                      base = child.func.value
                      while isinstance(base, (ast.Attribute, ast.Subscript)):
                          base = base.value
                      if isinstance(base, ast.Name) and base.id in args and child.func.attr in {
                          'append', 'extend', 'insert', 'remove', 'pop', 'clear',
                          'update', 'setdefault', 'sort', 'reverse', 'add', 'discard'
                      }:
                          return True
              return False

          def group_for(name, text):
              combined = f'{name} {text}'.lower()
              if any(term in combined for term in ('date', 'day', 'ymd', 'month', 'year')):
                  return 'dates'
              if any(term in combined for term in ('fmt', 'format', 'money', 'percent', 'currency')):
                  return 'formatting'
              if any(term in combined for term in ('norm', 'text', 'name', 'label', 'slug', 'clean')):
                  return 'text'
              if any(term in combined for term in ('note',)):
                  return 'notes'
              if any(term in combined for term in ('count', 'number', 'float', 'int', 'decimal')):
                  return 'numbers'
              return 'misc'

          refs = {}
          for owner in ast.walk(tree):
              if not isinstance(owner, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  continue
              for child in ast.walk(owner):
                  if isinstance(child, ast.Call) and isinstance(child.func, ast.Name):
                      refs.setdefault(child.func.id, []).append({
                          'owner': owner.name,
                          'line': child.lineno,
                      })

          candidates = []
          rejected = []
          for node in tree.body:
              if not isinstance(node, ast.FunctionDef):
                  continue
              size = node.end_lineno - node.lineno + 1
              fn_source = '\n'.join(lines[node.lineno - 1:node.end_lineno])
              lowered = f'{node.name}\n{fn_source}'.lower()
              external = loaded_names(node)
              reasons = []
              if size > 35:
                  reasons.append('over_35_lines')
              if node.decorator_list:
                  reasons.append('decorated')
              if any(isinstance(x, (ast.Global, ast.Nonlocal, ast.Yield, ast.YieldFrom, ast.Await)) for x in ast.walk(node)):
                  reasons.append('stateful_or_async')
              if any(term in lowered for term in blocked_terms):
                  reasons.append('sensitive_term')
              if any(name in blocked_names for name in external):
                  reasons.append('blocked_dependency')
              unsupported = [name for name in external if name not in allowed_external]
              if unsupported:
                  reasons.append('unsupported_dependencies')
              if mutates_arguments(node):
                  reasons.append('mutates_arguments')
              if reasons:
                  if size <= 35 and len(rejected) < 60:
                      rejected.append({
                          'name': node.name,
                          'line': node.lineno,
                          'lines': size,
                          'reasons': reasons,
                          'external_names': external,
                      })
                  continue
              candidates.append({
                  'name': node.name,
                  'line': node.lineno,
                  'end_line': node.end_lineno,
                  'lines': size,
                  'signature': ast.unparse(node.args),
                  'external_names': external,
                  'group': group_for(node.name, fn_source),
                  'reference_count': len(refs.get(node.name, [])),
                  'references': refs.get(node.name, [])[:12],
                  'source': fn_source,
              })

          candidates.sort(key=lambda item: (item['group'], item['lines'], item['name']))
          grouped = {}
          for item in candidates:
              grouped.setdefault(item['group'], []).append(item)

          report = {
              'app': str(APP),
              'top_level_function_count': sum(isinstance(n, ast.FunctionDef) for n in tree.body),
              'candidate_count': len(candidates),
              'groups': grouped,
              'rejected_sample': rejected,
              'policy': {
                  'max_lines': 35,
                  'mutating_arguments_rejected': True,
                  'sensitive_terms_rejected': sorted(blocked_terms),
                  'blocked_dependencies': sorted(blocked_names),
                  'allowed_external_names': sorted(allowed_external),
              },
          }
          out = Path('tools/fixtures/safe_helper_batch_scan.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({
              'candidate_count': len(candidates),
              'group_counts': {key: len(value) for key, value in grouped.items()},
          }, indent=2))
          PY
      - name: Commit scan report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/safe_helper_batch_scan.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect safe helper batch"
          git push origin HEAD:agent/batch-pure-helper-scan
