name: Clients read presentation Wave 30

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/clients-read-presentation-wave-30'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile application, Clients modules, and test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/tabs/clients.py
          python -m py_compile spina_app/tabs/client_info_logs.py
          python -m py_compile tools/test_clients_read_presentation_wave_30.py
          python -m compileall -q spina_app

      - name: Run Clients read presentation regression
        shell: cmd
        run: python -m tools.test_clients_read_presentation_wave_30

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run redundancy audit
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-30-redundancy.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-30-quality.json

      - name: Upload Wave 30 reports
        uses: actions/upload-artifact@v4
        with:
          name: clients-read-presentation-wave-30-reports
          path: |
            artifacts/wave-30-redundancy.json
            artifacts/wave-30-quality.json
            architecture-map.json
            docs/architecture
          if-no-files-found: error
