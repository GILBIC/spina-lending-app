name: Apply CILOG value formatter extraction

on:
  push:
    branches:
      - agent/extract-cilog-value-formatter

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile guard and regression test
        run: |
          python -m py_compile \
            tools/extract_cilog_value_formatter.py \
            tools/test_cilog_value_formatter_extraction.py
      - name: Capture current behavior
        run: |
          python tools/test_cilog_value_formatter_extraction.py \
            --write-fixture tools/fixtures/cilog_value_formatter_behavior.json
      - name: Run guarded dry-run and extraction
        run: |
          python tools/extract_cilog_value_formatter.py \
            --json /tmp/cilog-value-plan.json
          python tools/extract_cilog_value_formatter.py --apply
      - name: Validate extracted state
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/formatting.py \
            tools/extract_cilog_value_formatter.py \
            tools/test_cilog_value_formatter_extraction.py
          python tools/test_cilog_value_formatter_extraction.py
      - name: Commit generated extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/formatting.py \
            tools/fixtures/cilog_value_formatter_behavior.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract CILOG value formatter"
          git push origin HEAD:${GITHUB_REF_NAME}
