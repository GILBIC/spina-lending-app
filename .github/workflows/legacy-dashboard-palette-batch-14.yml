name: Legacy Dashboard palette batch 14
# Normal user commit to rerun final checks after the documentation-only map update.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile app, module, and tests
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            tools/extract_pure_helper_batch.py \
            tools/test_legacy_dashboard_palette_batch_14.py

      - name: Verify exact extracted state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/legacy_dashboard_palette_batch_14_manifest.json

      - name: Verify preserved legacy Dashboard palette behavior
        run: |
          PYTHONPATH=. python tools/test_legacy_dashboard_palette_batch_14.py \
            --manifest tools/fixtures/legacy_dashboard_palette_batch_14_manifest.json \
            --fixture tools/fixtures/legacy_dashboard_palette_batch_14_behavior.json
