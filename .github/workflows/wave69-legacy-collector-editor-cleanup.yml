name: Wave 69 Legacy Collector Editor Cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_wave69_legacy_collector_editor_cleanup.py"
      - "tools/patch_wave69_generated_collector_tests.py"
      - "tools/debug_wave69_structural_cleanup.py"
      - "tools/debug_wave69_protected_collectors.py"
      - ".github/workflows/wave69-legacy-collector-editor-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave69-legacy-collector-editor-cleanup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-69'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 69 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply exact guarded cleanup
        shell: cmd
        run: |
          python -m py_compile tools\apply_wave69_legacy_collector_editor_cleanup.py
          python -m tools.apply_wave69_legacy_collector_editor_cleanup >nul
          python -m py_compile tools\patch_wave69_generated_collector_tests.py
          python -m tools.patch_wave69_generated_collector_tests >nul
          python -m py_compile tools\debug_wave69_structural_cleanup.py
          python -m tools.debug_wave69_structural_cleanup
          python -m py_compile tools\debug_wave69_protected_collectors.py
          python -m tools.debug_wave69_protected_collectors

      - name: Compile final application and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\collector_dialog_presentation.py
          python -m py_compile tools\test_collector_dialog_presentation_wave_43.py
          python -m py_compile tools\test_legacy_collector_editor_cleanup_wave_69.py
          python -m py_compile tools\test_collector_editor_widget_smoke_wave_69.py
          python -m py_compile tools\test_collectors_editor_wave_26.py
          python -m compileall -q spina_app

      - name: Run Wave 69 structural cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_collector_editor_cleanup_wave_69

      - name: Run modern collector dialog exact regression
        shell: cmd
        run: python -m tools.test_collector_dialog_presentation_wave_43

      - name: Run modern collector dialog real Tkinter regression
        shell: cmd
        run: python -m tools.test_collector_editor_widget_smoke_wave_69

      - name: Run protected collectors editor regression
        shell: cmd
        run: python -m tools.test_collectors_editor_wave_26

      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-69-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-69-quality.json

      - name: Commit cleanup, tests, and maps
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add tools\test_collector_dialog_presentation_wave_43.py
          git add tools\test_legacy_collector_editor_cleanup_wave_69.py
          git add tools\test_collector_editor_widget_smoke_wave_69.py
          git add architecture-map.json docs\architecture
          git diff --cached --quiet && exit /b 1
          git commit -m "Remove redundant legacy collector editor Wave 69"
          git push origin HEAD:${{ github.head_ref }}
