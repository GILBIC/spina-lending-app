name: Extract System Data presentation Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/extract_system_data_presentation_wave_55.py"
      - ".github/workflows/extract-system-data-presentation-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out Wave 55 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-55
          fetch-depth: 0
          show-progress: false
      - name: Compile extractor
        shell: cmd
        run: python -m py_compile tools\extract_system_data_presentation_wave_55.py
      - name: Extract exact System Data presentation methods
        shell: cmd
        run: python -m tools.extract_system_data_presentation_wave_55
      - name: Compile extracted application, module, and regression
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\system_data_presentation.py
          python -m py_compile tools\test_system_data_presentation_wave_55.py
          python -m compileall -q spina_app
      - name: Run exact-source regression
        shell: cmd
        run: python -m tools.test_system_data_presentation_wave_55
      - name: Commit extracted Wave 55 boundary
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Extract System Data presentation Wave 55"
          git push origin HEAD:agent/high-volume-wave-55
