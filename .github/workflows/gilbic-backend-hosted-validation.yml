name: Gilbic backend hosted validation

on:
  pull_request:
    paths:
      - "gilbic_backend/**"
      - ".github/workflows/gilbic-backend-hosted-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Gilbic backend
        run: python -m pip install --disable-pip-version-check -e "./gilbic_backend[test]"

      - name: Compile backend
        run: python -m compileall -q gilbic_backend/src

      - name: Run backend tests
        run: python -m pytest -q gilbic_backend/tests

      - name: Require clean committed tree
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
