name: PostgreSQL compatibility helpers Wave 34 bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  extract-and-validate:
    if: github.head_ref == 'agent/postgres-compat-helpers-wave-34'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Check out Wave 34 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify local Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Apply guarded extraction
        shell: cmd
        run: python tools/apply_postgres_compat_wave_34.py

      - name: Compile extracted application
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\postgres_compat.py
          python -m py_compile tools\test_postgres_compat_wave_34.py
          python -m compileall -q spina_app

      - name: Run focused regression
        shell: cmd
        run: python -m tools.test_postgres_compat_wave_34

      - name: Commit application extraction
        shell: cmd
        run: |
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git commit -m "Extract PostgreSQL compatibility helpers Wave 34"

      - name: Regenerate architecture map
        shell: cmd
        run: |
          python tools\generate_architecture_map.py
          python -m tools.test_architecture_map

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-34-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-34-quality.json

      - name: Commit architecture refresh
        shell: cmd
        run: |
          git add architecture-map.json docs/architecture
          git commit -m "Refresh architecture map after Wave 34"

      - name: Push completed Wave 34 branch
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git push origin HEAD:agent/postgres-compat-helpers-wave-34
