name: Dashboard feature Wave 17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Dashboard feature extraction
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/tabs/__init__.py \
            spina_app/tabs/dashboard.py \
            tools/test_dashboard_feature_wave_17.py

      - name: Verify feature-level extraction and bridges
        run: |
          PYTHONPATH=. python tools/test_dashboard_feature_wave_17.py
