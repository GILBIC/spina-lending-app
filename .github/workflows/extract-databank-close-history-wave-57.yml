name: Extract Data Bank Close History presentation Wave 57

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/extract_databank_close_history_wave57_tmp.py"
      - ".github/workflows/extract-databank-close-history-wave-57.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-databank-close-history-wave-57-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-57'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 57 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-57
          fetch-depth: 0
          show-progress: false
      - name: Extract guarded Close History boundary
        shell: cmd
        run: python tools\extract_databank_close_history_wave57_tmp.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_close_history_presentation.py
          python -m py_compile tools\test_databank_close_history_presentation_wave_57.py
          python -m py_compile tools\test_databank_close_history_widget_smoke_wave_57.py
          python -m compileall -q spina_app
      - name: Run exact Close History extraction regression
        shell: cmd
        run: python -m tools.test_databank_close_history_presentation_wave_57
      - name: Run real Tkinter Close History construction test
        shell: cmd
        run: python -m tools.test_databank_close_history_widget_smoke_wave_57
      - name: Run protected Data Bank and navigation regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_databank_presentation_wave_49
          python -m tools.test_databank_widget_smoke_wave_49
          python -m tools.test_databank_import_control_wave_53
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_audit_presentation_wave_54
          python -m tools.test_system_data_presentation_wave_56
          python -m tools.test_system_data_widget_smoke_wave_56
      - name: Commit extracted application boundary
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_close_history_presentation.py tools\test_databank_close_history_presentation_wave_57.py tools\test_databank_close_history_widget_smoke_wave_57.py
          git diff --cached --quiet || git commit -m "Extract Data Bank Close History presentation Wave 57"
          git push origin HEAD:agent/high-volume-wave-57
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        shell: cmd
        run: |
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 57 architecture maps"
          git push origin HEAD:agent/high-volume-wave-57
      - name: Upload Wave 57 extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-close-history-wave-57-extraction
          path: artifacts/wave-57-close-history-extraction.json
          if-no-files-found: warn
