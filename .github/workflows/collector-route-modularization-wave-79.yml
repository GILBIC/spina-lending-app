name: Collector Route modularization Wave 79

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/collector_route_controller.py"
      - "spina_app/collector_route_report.py"
      - "spina_app/features/collector_route.py"
      - "spina_app/repositories/collector_route.py"
      - "spina_app/services/collector_route.py"
      - "spina_app/collector_refresh_presentation.py"
      - "spina_app/collector_tab_presentation.py"
      - "spina_app/collector_dialog_presentation.py"
      - "spina_app/tabs/collector_route.py"
      - "spina_app/tabs/collectors.py"
      - "tools/apply_collector_route_modularization_wave_79.py"
      - "tools/run_collector_route_modularization_wave_79.py"
      - "tools/test_collector_route_layers_wave_79.py"
      - "tools/test_collector_route_feature_wave_79.py"
      - "tools/test_collector_route_extraction_wave_79.py"
      - "tools/test_collector_route_legacy_compat_wave_79.py"
      - "docs/collector-route-modularization-wave-79.md"
      - ".github/workflows/collector-route-modularization-wave-79.yml"
  workflow_dispatch:

concurrency:
  group: collector-route-wave-79-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact Wave 79 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compile committed Collector Route architecture
        shell: cmd
        run: |
          python -m py_compile spina_app\collector_route_controller.py
          python -m py_compile spina_app\collector_route_report.py
          python -m py_compile spina_app\features\collector_route.py
          python -m py_compile spina_app\repositories\collector_route.py
          python -m py_compile spina_app\services\collector_route.py
          python -m py_compile tools\apply_collector_route_modularization_wave_79.py
          python -m py_compile tools\run_collector_route_modularization_wave_79.py
          python -m py_compile tools\test_collector_route_layers_wave_79.py
          python -m py_compile tools\test_collector_route_feature_wave_79.py
          python -m py_compile tools\test_collector_route_extraction_wave_79.py
          python -m py_compile tools\test_collector_route_legacy_compat_wave_79.py
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py

      - name: Require committed Collector Route architecture
        shell: cmd
        run: |
          python -c "from pathlib import Path; source=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py').read_text(encoding='utf-8'); assert source.count('# --- BEGIN: Collector Route feature installer Wave 79 ---') == 1; assert '# --- BEGIN: v25 Modern Collector Route UI ---' not in source; assert '# --- BEGIN: v27 Modern Collector Route Overview + Better Route Editor ---' not in source; assert 'def print_collector_route_daily_ledger(' not in source; assert 'def print_full_daily_ledger(' not in source"

      - name: Run Collector Route repository and service regressions
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_collector_route_layers_wave_79.py

      - name: Run committed Collector Route extraction regression
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_collector_route_extraction_wave_79.py

      - name: Run Collector Route installer regression
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_collector_route_feature_wave_79.py

      - name: Run Collector Route legacy capability regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_collector_route_legacy_compat_wave_79.py
          set "PYTHONPATH=%CD%" && python tools\test_collector_tab_widget_smoke_wave_44.py

      - name: Run Client Info Logs Wave 78 regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_layers_wave_78.py
          set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_feature_wave_78.py
          set "PYTHONPATH=%CD%" && python tools\test_client_info_logs_extraction_wave_78.py

      - name: Run Cash Control Wave 77 regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_layers_wave_77.py
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_feature_wave_77.py
          set "PYTHONPATH=%CD%" && python tools\test_cash_control_extraction_wave_77.py

      - name: Run Dashboard Wave 76 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_full_dashboard_modularization_wave_76.py

      - name: Run Wave 75 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py

      - name: Run Wave 74 compatibility
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py

      - name: Check clean committed tree
        shell: cmd
        run: |
          git diff --check
          git diff --exit-code
