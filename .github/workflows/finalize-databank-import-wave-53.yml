name: Finalize Data Bank import repair Wave 53

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "spina_app/databank_presentation.py"
      - "tools/test_databank_import_control_wave_53.py"
      - ".github/workflows/finalize-databank-import-wave-53.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-databank-import-wave-53-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-53'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Wave 53 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          show-progress: false

      - name: Correct metadata and refresh architecture map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('spina_app/databank_presentation.py')
          text = path.read_text(encoding='utf-8')
          wrong = '55f92454aaf29af7e5f2a8995769ff109a9153c50835132a337bac5e86248212'
          correct = '55f92454aaf29af7e3f2a8995769ff109a9153c50835132a337bac5e86248212'
          assert text.count(wrong) == 1, text.count(wrong)
          path.write_text(text.replace(wrong, correct), encoding='utf-8')
          PY
          python -m py_compile spina_app/databank_presentation.py
          python -m py_compile tools/test_databank_import_control_wave_53.py
          python tools/test_databank_presentation_wave_49.py
          python tools/generate_architecture_map.py

      - name: Commit finalized repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-databank-import-wave-53.yml
          git add spina_app/databank_presentation.py architecture-map.json docs/architecture .github/workflows
          git commit -m "Finalize Data Bank import repair"
          git push origin HEAD:refs/heads/agent/high-volume-wave-53
