name: Patch Clients palette dependency Wave 19

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/clients-feature-module-wave-19'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out Wave 19 branch
        uses: actions/checkout@v4
        with:
          ref: agent/clients-feature-module-wave-19
          fetch-depth: 0

      - name: Correct Clients palette dependency bridge
        shell: cmd
        run: python tools\patch_clients_palette_dependency_wave_19.py

      - name: Commit correction and remove temporary guard tools
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools\apply_clients_feature_wave_19.py
          git rm .github\workflows\patch-clients-feature-wave-19-guard.yml
          git rm .github\workflows\patch-clients-palette-wave-19.yml
          git rm tools\patch_clients_feature_wave_19_guard.py
          git rm tools\report_clients_feature_wave_19_guard.py
          git rm tools\patch_clients_palette_dependency_wave_19.py
          git commit -m "Correct Clients palette bridge and clean temporary guards"
          git push origin HEAD:agent/clients-feature-module-wave-19
