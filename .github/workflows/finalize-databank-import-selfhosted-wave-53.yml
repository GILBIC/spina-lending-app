name: Finalize Data Bank import on SPINA runner Wave 53

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "spina_app/databank_presentation.py"
      - "tools/test_databank_import_control_wave_53.py"
      - ".github/workflows/finalize-databank-import-wave-53.yml"
      - ".github/workflows/finalize-databank-import-selfhosted-wave-53.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-databank-import-selfhosted-wave-53
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-53'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact Wave 53 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          show-progress: false

      - name: Correct metadata and verify source
        shell: cmd
        run: |
          python -c "from pathlib import Path; p=Path(r'spina_app/databank_presentation.py'); t=p.read_text(encoding='utf-8'); w='55f92454aaf29af7e5f2a8995769ff109a9153c50835132a337bac5e86248212'; c='55f92454aaf29af7e3f2a8995769ff109a9153c50835132a337bac5e86248212'; assert t.count(w)==1, t.count(w); p.write_text(t.replace(w,c), encoding='utf-8')"
          python -m py_compile spina_app\databank_presentation.py
          python -m py_compile tools\test_databank_import_control_wave_53.py
          python tools\test_databank_presentation_wave_49.py

      - name: Refresh architecture map
        shell: cmd
        run: python tools\generate_architecture_map.py

      - name: Commit finalized repair
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          del .github\workflows\finalize-databank-import-wave-53.yml
          del .github\workflows\finalize-databank-import-selfhosted-wave-53.yml
          git add spina_app\databank_presentation.py architecture-map.json docs\architecture .github\workflows
          git commit -m "Finalize Data Bank import repair"
          git push origin HEAD:refs/heads/agent/high-volume-wave-53
