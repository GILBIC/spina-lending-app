name: ECL methodology source policy live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0069_add_ecl_methodology_source_policy.sql'
      - 'docs/accounting/ecl-methodology-source-policy.md'
      - 'tools/apply_ecl_methodology_source_policy_migration.py'
      - '.github/workflows/ecl-methodology-source-policy-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0069_add_ecl_methodology_source_policy.sql'
      - 'docs/accounting/ecl-methodology-source-policy.md'
      - 'tools/apply_ecl_methodology_source_policy_migration.py'
      - '.github/workflows/ecl-methodology-source-policy-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecl-methodology-source-policy-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ecl-methodology-source-policy-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-methodology-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-methodology-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_ecl_methodology_source_policy_migration.py || exit /b 1

      - name: Verify PR remains policy-only and fail closed
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0069_add_ecl_methodology_source_policy.sql').read_text(encoding='utf-8'); u=s.upper(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'PROBABILITY_WEIGHTED_DISCOUNTED_EXPECTED_CASH_SHORTFALL' in u; assert 'TRUE AS METHODOLOGY_APPROVED' in u; assert 'FALSE AS NUMERIC_PD_ENABLED' in u; assert 'FALSE AS NUMERIC_LGD_ENABLED' in u; assert 'FALSE AS ECL_CALCULATION_ENABLED' in u; assert 'FALSE AS ACCOUNT_1190_POSTING_ENABLED' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u; assert 'CREATE TABLE' not in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u" || exit /b 1

      - name: Require the live database runner for non-PR execution
        if: github.event_name != 'pull_request'
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SPINA-WINDOWS') {
            throw "Live ECL methodology/source-policy migration requires SPINA-WINDOWS because the approved database env files are local to that runner; current runner is $env:RUNNER_NAME."
          }

      - name: Install and verify ECL methodology source policy on live database
        if: github.event_name != 'pull_request'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-ecl-methodology-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_ecl_methodology_source_policy_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree when Git metadata is available
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git -and (Test-Path '.git')) {
            & $git.Source diff --check
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
            & $git.Source diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Working tree changed during verification.' }
            & $git.Source diff --cached --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Index changed during verification.' }
          }
          else {
            Write-Host 'Git metadata is unavailable on this secondary self-hosted runner; actions/checkout exact-revision archive was used and PR verification is read-only.'
          }
