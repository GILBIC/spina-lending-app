name: Clean Tk shutdown maps Wave 46
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/test_tk_shutdown_wave_46.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/inspect-tk-shutdown-wave-46.yml"
permissions:
  contents: write
jobs:
  clean:
    if: github.head_ref == 'agent/account-header-presentation-wave-46'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile application and Wave 46 tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/account_header_presentation.py
          python -m py_compile tools/test_account_header_presentation_wave_46.py
          python -m py_compile tools/test_account_header_widget_smoke_wave_46.py
          python -m py_compile tools/test_tk_shutdown_wave_46.py
          python -m compileall -q spina_app
      - name: Run Wave 46 regressions
        shell: cmd
        run: |
          python tools/test_account_header_presentation_wave_46.py
          python tools/test_account_header_widget_smoke_wave_46.py
          python tools/test_tk_shutdown_wave_46.py
      - name: Regenerate clean architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-46-shutdown-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-46-shutdown-quality.json
      - name: Commit clean architecture maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh clean Wave 46 architecture maps [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
