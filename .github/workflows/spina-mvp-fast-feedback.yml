name: SPINA MVP Fast Feedback

on:
  pull_request:
    paths:
      - "gilbic_mobile/**"
      - "gilbic_backend/tests/test_cross_platform_bootstrap_contract.py"
      - ".github/workflows/spina-mvp-fast-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spina-mvp-fast-feedback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route-cache-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove four-platform bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "pytest>=8,<9"
          python -m pytest -q \
            gilbic_backend/tests/test_cross_platform_bootstrap_contract.py

      - name: Install Flutter stable from the official repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        working-directory: gilbic_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter --version
          flutter pub get

      - name: Run cross-platform cache and app-composition tests
        working-directory: gilbic_mobile
        shell: bash
        run: |
          flutter test \
            test/collector_route_cache_policy_test.dart \
            test/collector_route_cache_factory_test.dart \
            test/collector_route_cache_test.dart \
            test/collector_route_loader_test.dart \
            test/app_default_route_cache_test.dart

      - name: Generate and compile the Web client
        working-directory: gilbic_mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter create \
            --platforms=web \
            --org com.gilbic \
            --project-name gilbic_mobile \
            .
          rm -f test/widget_test.dart
          flutter build web --debug \
            --dart-define=GILBIC_API_URL=https://mvp-api.invalid
          test -f build/web/index.html
