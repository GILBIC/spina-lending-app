# Final exact-head validation after corrected architecture-map refresh.
name: Settings Dialog Presentation Wave 65

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/settings_dialog_presentation.py"
      - "tools/test_settings_dialog_presentation_wave_65.py"
      - "tools/test_settings_dialog_widget_smoke_wave_65.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/settings-dialog-presentation-wave-65.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-dialog-presentation-wave-65-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-65'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\settings_dialog_presentation.py
          python -m py_compile tools\test_settings_dialog_presentation_wave_65.py
          python -m py_compile tools\test_settings_dialog_widget_smoke_wave_65.py
          python -m compileall -q spina_app

      - name: Run Wave 65 exact extraction regression
        shell: cmd
        run: python -m tools.test_settings_dialog_presentation_wave_65

      - name: Run Wave 65 real Tkinter regression
        shell: cmd
        run: python -m tools.test_settings_dialog_widget_smoke_wave_65

      - name: Run protected theme and navigation regressions
        shell: cmd
        run: |
          python tools\test_theme_presentation_wave_35.py
          python tools\test_navigation_databank_shell_wave_29.py
          python tools\test_side_navigation_presentation_wave_48.py
          python tools\test_side_navigation_widget_smoke_wave_48.py

      - name: Run protected Reports and Data Bank regressions
        shell: cmd
        run: |
          python -m tools.test_reports_tab_presentation_wave_64
          python -m tools.test_reports_tab_widget_smoke_wave_64
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_delete_day_password_gate_wave_63

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-65-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-65-quality.json

      - name: Upload Wave 65 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-dialog-presentation-wave-65-reports
          path: artifacts/wave-65-*.json
          if-no-files-found: warn
