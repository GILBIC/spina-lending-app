name: Apply Dashboard presentation Wave 28

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/dashboard-presentation-wave-28'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Check out Wave 28 branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-presentation-wave-28
          fetch-depth: 0

      - name: Verify Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Correct Dashboard import selector
        shell: cmd
        run: python -m tools.patch_dashboard_presentation_wave_28_import_selector

      - name: Compile guarded extractor
        shell: cmd
        run: python -m py_compile tools\apply_dashboard_presentation_wave_28.py

      - name: Apply guarded 449-line extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m tools.apply_dashboard_presentation_wave_28 > artifacts\dashboard-presentation-wave-28-apply.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\dashboard-presentation-wave-28-apply.log
          exit /b %CODE%

      - name: Upload extractor diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-presentation-wave-28-apply-diagnostic
          path: artifacts/dashboard-presentation-wave-28-apply.log
          if-no-files-found: error

      - name: Compile application, Dashboard module, and focused test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\tabs\dashboard.py
          python -m py_compile tools\test_dashboard_presentation_wave_28.py
          python -m compileall -q spina_app

      - name: Run Dashboard presentation regression
        shell: cmd
        run: python -m tools.test_dashboard_presentation_wave_28

      - name: Run redundancy audit
        shell: cmd
        run: python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json redundancy-report.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json quality-report.json

      - name: Remove temporary Wave 28 tooling
        shell: cmd
        run: |
          del tools\apply_dashboard_presentation_wave_28.py
          del tools\inventory_dashboard_presentation_wave_28.py
          del tools\patch_dashboard_presentation_wave_28_import_selector.py
          del .github\workflows\apply-dashboard-presentation-wave-28.yml
          del .github\workflows\dashboard-presentation-wave-28-inventory.yml

      - name: Commit guarded application extraction locally
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add spina_app\tabs\dashboard.py
          git add tools\test_dashboard_presentation_wave_28.py
          git add .github\workflows\dashboard-presentation-wave-28.yml
          git add -u tools .github\workflows
          git diff --cached --check
          git commit -m "Modularize Dashboard presentation Wave 28"

      - name: Regenerate architecture map from committed application state
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs\architecture
          git diff --cached --check
          git commit -m "Refresh architecture map for Wave 28"

      - name: Push Wave 28 commits
        shell: cmd
        run: git push origin HEAD:agent/dashboard-presentation-wave-28
