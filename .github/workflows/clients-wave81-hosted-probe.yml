name: Clients Wave 81 hosted probe

on:
  pull_request:
    paths:
      - ".github/workflows/clients-wave81-hosted-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted Linux
        run: echo "Hosted Linux is available for Wave 81"
