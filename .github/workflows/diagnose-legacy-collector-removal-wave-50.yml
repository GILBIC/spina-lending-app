name: Diagnose legacy collector removal Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/remove_legacy_collector_presentation_wave_50.py"
      - "tools/diagnose_legacy_collector_removal_wave_50.py"
      - ".github/workflows/diagnose-legacy-collector-removal-wave-50.yml"
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'agent/high-volume-presentation-wave-50'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile diagnostic
        shell: cmd
        run: |
          python -m py_compile tools/remove_legacy_collector_presentation_wave_50.py
          python -m py_compile tools/diagnose_legacy_collector_removal_wave_50.py
      - name: Diagnose exact removal assertion
        continue-on-error: true
        shell: cmd
        run: python tools/diagnose_legacy_collector_removal_wave_50.py
      - name: Upload Wave 50 removal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-collector-removal-diagnostic
          path: artifacts/wave-50-collector-removal-diagnostic.json
          if-no-files-found: error
