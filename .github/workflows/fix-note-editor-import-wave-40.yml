name: Fix note editor runtime import Wave 40
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'agent/note-editor-presentation-wave-40'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply runtime import fix
        shell: cmd
        run: python .github\scripts\fix_note_editor_import_wave_40.py
      - name: Compile and run Wave 40 regression
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\note_editor_presentation.py
          python -m py_compile tools\test_note_editor_presentation_wave_40.py
          python -m compileall -q spina_app
          python tools\test_note_editor_presentation_wave_40.py
      - name: Refresh architecture maps and audits
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-40-import-fix-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-40-import-fix-quality.json
      - name: Commit runtime import fix
        shell: pwsh
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add spina_app/note_editor_presentation.py
          git add tools/test_note_editor_presentation_wave_40.py
          git add architecture-map.json
          git add docs/architecture
          git commit -m "Fix note editor runtime import Wave 40"
      - name: Configure runner GitHub authentication
        shell: pwsh
        run: gh auth setup-git
      - name: Push runtime import fix
        shell: pwsh
        run: |
          $branch = "${{ github.head_ref }}"
          git push origin "HEAD:refs/heads/$branch"
