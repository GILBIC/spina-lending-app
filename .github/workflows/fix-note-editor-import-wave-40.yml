name: Fix note editor runtime import Wave 40
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'agent/note-editor-presentation-wave-40'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply and verify runtime import fix
        shell: cmd
        run: |
          python .github\scripts\fix_note_editor_import_wave_40.py
          python -m py_compile spina_app\note_editor_presentation.py
          python tools\test_note_editor_presentation_wave_40.py
      - name: Commit runtime import fix
        shell: cmd
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add spina_app\note_editor_presentation.py tools\test_note_editor_presentation_wave_40.py
          git status --short
          git diff --cached --stat
          git commit -m "Fix note editor runtime import Wave 40"
      - name: Configure runner GitHub authentication
        shell: cmd
        run: gh auth setup-git
      - name: Push runtime import fix
        shell: cmd
        run: git push origin HEAD:refs/heads/${{ github.head_ref }}
