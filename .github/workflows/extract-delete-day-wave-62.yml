name: Extract Delete Day Wave 62

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/extract-delete-day-wave-62.yml"
      - "tools/extract_delete_day_wave62_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-delete-day-wave-62-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-62'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out Wave 62 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Extract exact Delete Day boundary
        shell: cmd
        run: python tools\extract_delete_day_wave62_tmp.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_delete_day.py
          python -m py_compile tools\test_databank_delete_day_wave_62.py
          python -m py_compile tools\test_databank_delete_day_behavior_wave_62.py
          python -m compileall -q spina_app
      - name: Run exact Delete Day extraction regression
        shell: cmd
        run: python -m tools.test_databank_delete_day_wave_62
      - name: Run real Tkinter destructive-flow behavior
        shell: cmd
        run: python -m tools.test_databank_delete_day_behavior_wave_62
      - name: Run protected Data Bank and System Data regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_databank_presentation_wave_49
          python -m tools.test_databank_widget_smoke_wave_49
          python -m tools.test_ui_button_factories_wave_50
          python -m tools.test_databank_import_control_wave_53
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_audit_presentation_wave_54
          python -m tools.test_system_data_presentation_wave_56
          python -m tools.test_system_data_widget_smoke_wave_56
          python -m tools.test_databank_close_history_presentation_wave_57
          python -m tools.test_system_data_summary_presentation_wave_58
          python -m tools.test_system_data_summary_widget_smoke_wave_58
          python -m tools.test_databank_grid_presentation_wave_59
          python -m tools.test_databank_grid_widget_smoke_wave_59
          python -m tools.test_databank_editor_presentation_wave_60
          python -m tools.test_databank_editor_widget_smoke_wave_60
          python -m tools.test_databank_cell_writes_wave_61
          python -m tools.test_databank_cell_writes_behavior_wave_61
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-62-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-62-quality.json
      - name: Commit extraction and generated maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\databank_delete_day.py tools\test_databank_delete_day_wave_62.py tools\test_databank_delete_day_behavior_wave_62.py architecture-map.json docs\architecture
          git commit -m "Extract Data Bank Delete Day for Wave 62"
          git push origin HEAD:agent/high-volume-wave-62
      - name: Upload Wave 62 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: databank-delete-day-wave-62-extraction-reports
          path: artifacts/wave-62-*.json
          if-no-files-found: warn
