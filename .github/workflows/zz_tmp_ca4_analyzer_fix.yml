name: Temporary CA4 analyzer fix

on:
  push:
    branches:
      - mobile/ca4-collector-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Patch route receipt UI
        shell: cmd
        run: python tools\tmp_patch_ca4_receipt_ui.py
