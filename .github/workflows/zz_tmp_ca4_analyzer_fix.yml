name: Temporary CA4 analyzer fix

on:
  push:
    branches:
      - mobile/ca4-collector-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
      - name: Patch and upload exact analyzer fix
        shell: C:\WINDOWS\System32\WindowsPowerShell\v1.0\powershell.EXE -NoProfile -ExecutionPolicy Bypass -File "{0}"
        run: |
          $ErrorActionPreference = 'Stop'
          $branch = 'mobile/ca4-collector-ui'
          $repo = 'GILBIC/spina-lending-app'
          $codePath = 'gilbic_mobile/lib/src/features/collector/collector_route_page.dart'
          $workflowPath = '.github/workflows/zz_tmp_ca4_analyzer_fix.yml'
          $localPath = Join-Path $env:GITHUB_WORKSPACE $codePath

          $text = [System.IO.File]::ReadAllText($localPath)
          $old = 'status == null || status == 429 || (status != null && status >= 500);'
          $new = 'status == null || status == 429 || status >= 500;'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one analyzer target, found $count" }
          [System.IO.File]::WriteAllText(
            $localPath,
            $text.Replace($old, $new),
            (New-Object System.Text.UTF8Encoding($false))
          )

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escapedBranch = [uri]::EscapeDataString($branch)

          $codeUrl = "https://api.github.com/repos/$repo/contents/$codePath?ref=$escapedBranch"
          $codeMeta = Invoke-RestMethod -Headers $headers -Uri $codeUrl
          $codeContent = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($localPath))
          $putBody = @{
            message = 'Mobile: fix direct Pay analyzer warning'
            content = $codeContent
            sha = $codeMeta.sha
            branch = $branch
          } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$codePath" -ContentType 'application/json' -Body $putBody | Out-Null

          $workflowUrl = "https://api.github.com/repos/$repo/contents/$workflowPath?ref=$escapedBranch"
          $workflowMeta = Invoke-RestMethod -Headers $headers -Uri $workflowUrl
          $deleteBody = @{
            message = 'CI: remove temporary Collector analyzer workflow'
            sha = $workflowMeta.sha
            branch = $branch
          } | ConvertTo-Json
          Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$workflowPath" -ContentType 'application/json' -Body $deleteBody | Out-Null
