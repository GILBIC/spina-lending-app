name: Temporary CA4 analyzer fix

on:
  push:
    branches:
      - mobile/ca4-collector-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/ca4-collector-ui
          fetch-depth: 0
      - name: Apply exact analyzer fix
        shell: cmd
        run: >-
          python -c "from pathlib import Path; p=Path(r'gilbic_mobile/lib/src/features/collector/collector_route_page.dart'); s=p.read_text(encoding='utf-8'); old='status == null || status == 429 || (status != null && status >= 500);'; new='status == null || status == 429 || status >= 500;'; assert s.count(old)==1, f'Expected exactly one analyzer target, found {s.count(old)}'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Remove temporary workflow and commit
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz_tmp_ca4_analyzer_fix.yml
          git add gilbic_mobile/lib/src/features/collector/collector_route_page.dart
          git commit -m "Mobile: fix direct Pay analyzer warning"
          git push origin HEAD:mobile/ca4-collector-ui
