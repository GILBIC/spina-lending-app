name: Apply UI card constructor batch 08

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guarded tools
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_cards.py \
            tools/extract_pure_helper_batch.py \
            tools/test_ui_card_constructor_batch_08.py

      - name: Verify exact source state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/ui_card_constructor_batch_08_manifest.json \
            --json ui-card-before.json

      - name: Capture original behavior
        run: |
          python tools/test_ui_card_constructor_batch_08.py \
            --manifest tools/fixtures/ui_card_constructor_batch_08_manifest.json \
            --fixture tools/fixtures/ui_card_constructor_batch_08_behavior.json \
            --write-fixture

      - name: Apply guarded extraction
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/ui_card_constructor_batch_08_manifest.json \
            --apply \
            --json ui-card-after.json

      - name: Compile extracted state
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_cards.py \
            tools/test_ui_card_constructor_batch_08.py

      - name: Compare extracted behavior
        run: |
          PYTHONPATH=. python tools/test_ui_card_constructor_batch_08.py \
            --manifest tools/fixtures/ui_card_constructor_batch_08_manifest.json \
            --fixture tools/fixtures/ui_card_constructor_batch_08_behavior.json

      - name: Run focused audits
        run: |
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json ui-card-redundancy.json
          python tools/spina_quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json ui-card-quality.json

      - name: Commit verified extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/ui_cards.py \
            tools/fixtures/ui_card_constructor_batch_08_behavior.json
          if git diff --cached --quiet; then
            echo "No extraction changes to commit."
          else
            git commit -m "Extract UI card constructors"
            git push origin HEAD:${{ github.head_ref }}
          fi
