name: SPINA code quality baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: spina-code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 50

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated quality environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-code-quality-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          echo QUALITY_VENV=%VENV%>>"%GITHUB_ENV%"
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1

      - name: Install quality and test dependencies
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "ruff>=0.11,<1" "bandit>=1.8,<2" "pip-audit>=2.8,<3" "pyright>=1.1,<2" "pytest-cov>=6,<8" || exit /b 1
          "%QUALITY_VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\spina_backend_mobile[test]" -e ".\gilbic_backend[test]" || exit /b 1
          if not exist quality-artifacts mkdir quality-artifacts

      # Baseline mode reports existing findings without making them blockers yet.
      # Scanner/runtime failures still fail the job.
      - name: Ruff lint baseline
        id: ruff_lint
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\ruff.exe" check gilbic_backend\src gilbic_backend\tests spina_backend_mobile\src spina_backend_mobile\tests --output-format json --output-file quality-artifacts\ruff.json
          set "CODE=%ERRORLEVEL%"
          echo exit_code=%CODE%>>"%GITHUB_OUTPUT%"
          if %CODE% GTR 1 exit /b %CODE%
          exit /b 0

      - name: Ruff format baseline
        id: ruff_format
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\ruff.exe" format --check gilbic_backend\src gilbic_backend\tests spina_backend_mobile\src spina_backend_mobile\tests > quality-artifacts\ruff-format.txt 2>&1
          set "CODE=%ERRORLEVEL%"
          echo exit_code=%CODE%>>"%GITHUB_OUTPUT%"
          if %CODE% GTR 1 type quality-artifacts\ruff-format.txt & exit /b %CODE%
          exit /b 0

      - name: Bandit security baseline
        id: bandit
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\bandit.exe" -r gilbic_backend\src spina_backend_mobile\src -f json -o quality-artifacts\bandit.json
          set "CODE=%ERRORLEVEL%"
          echo exit_code=%CODE%>>"%GITHUB_OUTPUT%"
          if %CODE% GTR 1 exit /b %CODE%
          exit /b 0

      - name: Pyright typed-code baseline
        id: pyright
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\pyright.exe" --outputjson gilbic_backend\src\gilbic_backend spina_backend_mobile\src\spina_mobile_collections > quality-artifacts\pyright.json
          set "CODE=%ERRORLEVEL%"
          echo exit_code=%CODE%>>"%GITHUB_OUTPUT%"
          if %CODE% GTR 1 type quality-artifacts\pyright.json & exit /b %CODE%
          exit /b 0

      - name: Dependency vulnerability baseline
        id: pip_audit
        shell: cmd
        run: |
          "%QUALITY_VENV%\Scripts\pip-audit.exe" --local --skip-editable -f json -o quality-artifacts\pip-audit.json
          set "CODE=%ERRORLEVEL%"
          echo exit_code=%CODE%>>"%GITHUB_OUTPUT%"
          if %CODE% GTR 1 exit /b %CODE%
          exit /b 0

      - name: Gitleaks secret baseline
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Run backend tests with coverage
        shell: cmd
        env:
          GILBIC_TEST_DATABASE_URL: ""
        run: |
          "%QUALITY_VENV%\Scripts\python.exe" -m pytest -q gilbic_backend\tests spina_backend_mobile\tests --cov=gilbic_backend --cov=spina_mobile_collections --cov-report=term-missing --cov-report=xml:quality-artifacts\coverage.xml --cov-report=json:quality-artifacts\coverage.json || exit /b 1

      - name: Write code-quality summary
        if: always()
        shell: cmd
        env:
          RUFF_LINT_EXIT: ${{ steps.ruff_lint.outputs.exit_code }}
          RUFF_FORMAT_EXIT: ${{ steps.ruff_format.outputs.exit_code }}
          BANDIT_EXIT: ${{ steps.bandit.outputs.exit_code }}
          PYRIGHT_EXIT: ${{ steps.pyright.outputs.exit_code }}
          PIP_AUDIT_EXIT: ${{ steps.pip_audit.outputs.exit_code }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: |
          if not exist quality-artifacts mkdir quality-artifacts
          echo ## SPINA code quality baseline>quality-artifacts\summary.md
          echo.>>quality-artifacts\summary.md
          echo Baseline mode reports existing findings without making them strict blockers yet.>>quality-artifacts\summary.md
          echo.>>quality-artifacts\summary.md
          echo - Ruff lint exit: %RUFF_LINT_EXIT%>>quality-artifacts\summary.md
          echo - Ruff format exit: %RUFF_FORMAT_EXIT%>>quality-artifacts\summary.md
          echo - Bandit exit: %BANDIT_EXIT%>>quality-artifacts\summary.md
          echo - Pyright exit: %PYRIGHT_EXIT%>>quality-artifacts\summary.md
          echo - pip-audit exit: %PIP_AUDIT_EXIT%>>quality-artifacts\summary.md
          echo - Gitleaks outcome: %GITLEAKS_OUTCOME%>>quality-artifacts\summary.md
          type quality-artifacts\summary.md>>"%GITHUB_STEP_SUMMARY%"

      - name: Upload code-quality baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spina-code-quality-${{ github.sha }}
          path: quality-artifacts
          if-no-files-found: warn
          retention-days: 14
