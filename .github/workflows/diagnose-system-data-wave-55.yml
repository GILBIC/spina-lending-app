name: Diagnose System Data Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/diagnose-system-data-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Run concise widget diagnostic at exact branch head
        shell: cmd
        run: |
          cd /d %GITHUB_WORKSPACE%
          git fetch -q origin agent/high-volume-wave-55
          git reset --hard -q origin/agent/high-volume-wave-55
          python -m tools.test_system_data_widget_smoke_wave_55
