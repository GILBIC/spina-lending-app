name: Plan Data Bank editor Wave 60

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/plan_databank_editor_wave60_tmp.py"
      - ".github/workflows/plan-databank-editor-wave-60.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-databank-editor-wave-60-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-60'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out Wave 60 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Compile analyzer
        shell: cmd
        run: python -m py_compile tools\plan_databank_editor_wave60_tmp.py
      - name: Analyze Data Bank editor boundary
        shell: cmd
        run: python -m tools.plan_databank_editor_wave60_tmp
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: databank-editor-wave-60-candidates
          path: |
            artifacts/wave-60-databank-editor-candidates.json
            artifacts/wave-60-databank-editor-sources/*.py
          if-no-files-found: error
