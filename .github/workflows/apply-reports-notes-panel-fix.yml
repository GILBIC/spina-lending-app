name: Inspect Reports notes panel source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-reports-notes-panel-visible
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact toggle sources
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          app = Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py')
          source = app.read_text(encoding='utf-8')
          lines = source.splitlines()
          tree = ast.parse(source)
          matches = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.FunctionDef) and node.name == '_toggle_reports_notes_panel'
          ]
          if not matches:
              raise RuntimeError('No Reports notes toggle function found')
          entries = []
          for node in matches:
              chunk = lines[node.lineno - 1:node.end_lineno]
              text = '\n'.join(chunk)
              entries.append({
                  'line': node.lineno,
                  'end_line': node.end_lineno,
                  'contains_modern_hide_label': 'self.report_notes_btn.configure(text="Hide Notes")' in text,
                  'source': text,
                  'repr_lines': [repr(line) for line in chunk],
              })
          report = {'count': len(entries), 'matches': entries}
          output = Path('tools/fixtures/reports_notes_toggle_source.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit source report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/reports_notes_toggle_source.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect Reports notes toggle sources"
          git push origin HEAD:agent/fix-reports-notes-panel-visible
