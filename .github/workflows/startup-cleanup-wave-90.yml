name: Startup cleanup Wave 90

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/features/startup_runtime.py"
      - "spina_app/account_header_presentation.py"
      - "tools/apply_startup_cleanup_wave_90.py"
      - "tools/test_startup_cleanup_wave_90.py"
      - "tools/test_startup_runtime_wave_89.py"
      - "tools/test_login_cancel_startup_wave_46.py"
      - "docs/startup-cleanup-wave-90.md"
      - ".github/workflows/startup-cleanup-wave-90.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70

    steps:
      - name: Check out exact Wave 90 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply obsolete startup cleanup
        shell: cmd
        run: python tools\apply_startup_cleanup_wave_90.py

      - name: Compile cleaned startup architecture
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py || exit /b 1
          python -m py_compile spina_app\features\startup_runtime.py || exit /b 1
          python -m py_compile spina_app\account_header_presentation.py || exit /b 1
          python -m py_compile tools\apply_startup_cleanup_wave_90.py || exit /b 1
          python -m py_compile tools\test_startup_cleanup_wave_90.py || exit /b 1
          python -m py_compile tools\test_startup_runtime_wave_89.py || exit /b 1
          python -m py_compile tools\test_login_cancel_startup_wave_46.py || exit /b 1

      - name: Run Waves 90 and 89 startup regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_startup_cleanup_wave_90.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_startup_runtime_wave_89.py || exit /b 1

      - name: Run protected startup and account shell regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_login_cancel_startup_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_tk_shutdown_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_account_header_presentation_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_account_header_widget_smoke_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_feature_wave_83.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_validation_wave_85.py || exit /b 1

      - name: Run sidebar and navigation compatibility
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_validation_wave_88.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_cleanup_wave_87.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_side_navigation_feature_wave_86.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_navigation_compatibility_wave_86.py || exit /b 1

      - name: Run permanent architecture map
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python -m tools.test_architecture_map

      - name: Check generated diff
        shell: cmd
        run: git diff --check

      - name: Commit validated cleanup to PR branch
        shell: cmd
        run: |
          git add -- OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git diff --cached --quiet
          if errorlevel 1 (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply startup cleanup Wave 90"
            git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
          ) else (
            echo Wave 90 startup cleanup is already committed.
          )
