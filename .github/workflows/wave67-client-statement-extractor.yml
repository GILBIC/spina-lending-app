name: Wave 67 Client Statement Generation Extractor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_wave67_client_statement_generation_extraction.py"
      - ".github/workflows/wave67-client-statement-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave67-client-statement-extractor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-67'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 67 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 258-line extraction
        shell: cmd
        run: python tools\apply_wave67_client_statement_generation_extraction.py

      - name: Compile extracted application and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\client_statement_generation.py
          python -m py_compile tools\test_client_statement_generation_wave_67.py
          python -m py_compile tools\test_client_statement_generation_behavior_wave_67.py
          python -m compileall -q spina_app

      - name: Run Wave 67 focused regressions
        shell: cmd
        run: |
          python -m tools.test_client_statement_generation_wave_67
          python -m tools.test_client_statement_generation_behavior_wave_67

      - name: Commit extracted source and permanent tests
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\client_statement_generation.py tools\test_client_statement_generation_wave_67.py tools\test_client_statement_generation_behavior_wave_67.py
          git diff --cached --quiet || git commit -m "Extract Wave 67 client statement generation"

      - name: Regenerate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 67 architecture maps"

      - name: Push Wave 67 extraction
        shell: cmd
        run: git push origin HEAD:agent/high-volume-wave-67
