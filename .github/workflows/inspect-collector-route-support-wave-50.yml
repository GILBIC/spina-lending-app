name: Inspect collector route support Wave 50
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/collector_tab_presentation.py"
      - "tools/inspect_collector_route_support_wave_50.py"
      - ".github/workflows/inspect-collector-route-support-wave-50.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/presentation-batch-wave-50'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        run: python -m py_compile tools/inspect_collector_route_support_wave_50.py
      - name: Inspect active collector route support boundary
        run: python tools/inspect_collector_route_support_wave_50.py
      - name: Upload Wave 50 boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-50-collector-route-support-boundary
          path: artifacts/wave-50-collector-route-support-boundary.json
