name: Dashboard feature Wave 17 visible runner

on:
  pull_request:

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/dashboard-feature-module-wave-17'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/dashboard-feature-module-wave-17
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover reviewed extraction script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/dashboard-feature-wave-17-apply.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          prefix = '          '
          recovered = [line[len(prefix):] if line.startswith(prefix) else line for line in lines[start:end]]
          code = '\n'.join(recovered) + '\n'
          Path('/tmp/dashboard_wave_17_apply.py').write_text(code, encoding='utf-8')
          PY

      - name: Run extraction with captured log
        id: extraction
        continue-on-error: true
        run: |
          set -o pipefail
          python /tmp/dashboard_wave_17_apply.py 2>&1 | tee dashboard-wave-17-extraction.log

      - name: Upload complete extraction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-wave-17-extraction-log
          path: dashboard-wave-17-extraction.log
          if-no-files-found: error

      - name: Stop after extraction failure
        if: steps.extraction.outcome != 'success'
        run: |
          echo "Dashboard extraction failed; inspect dashboard-wave-17-extraction-log."
          exit 1

      - name: Compile and test extracted Dashboard feature
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m py_compile \
              OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
              spina_app/tabs/__init__.py \
              spina_app/tabs/dashboard.py \
              tools/test_dashboard_feature_wave_17.py
            PYTHONPATH=. python tools/test_dashboard_feature_wave_17.py
          } 2>&1 | tee dashboard-wave-17-validation.log

      - name: Upload complete validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-wave-17-validation-log
          path: dashboard-wave-17-validation.log
          if-no-files-found: error

      - name: Stop after validation failure
        if: steps.validation.outcome != 'success'
        run: |
          echo "Dashboard validation failed; inspect dashboard-wave-17-validation-log."
          exit 1

      - name: Commit verified extraction and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-feature-wave-17-apply.yml
          git rm .github/workflows/dashboard-feature-wave-17-inventory.yml
          git rm .github/workflows/dashboard-feature-wave-17-pr-runner.yml
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/tabs/__init__.py \
            spina_app/tabs/dashboard.py \
            tools/fixtures/dashboard_feature_wave_17_manifest.json \
            tools/test_dashboard_feature_wave_17.py \
            .github/workflows/dashboard-feature-wave-17.yml
          git commit -m "Extract legacy Dashboard feature module"
          git push origin HEAD:agent/dashboard-feature-module-wave-17
