name: Inspect pure display helper batch 04 simple

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pure-display-helper-batch-04-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run helper inspection
        run: python tools/inspect_pure_display_helper_batch_04.py
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/pure_display_helper_batch_04_candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record broad pure helper candidates"
          git push origin HEAD:agent/pure-display-helper-batch-04-work
