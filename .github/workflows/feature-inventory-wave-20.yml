name: Feature inventory Wave 20

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/feature-module-wave-20'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out Wave 20 branch
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile inventory tool
        shell: cmd
        run: python -m py_compile tools\inventory_feature_wave_20.py

      - name: Generate exact feature inventory
        shell: cmd
        run: python tools\inventory_feature_wave_20.py

      - name: Upload feature inventory
        uses: actions/upload-artifact@v4
        with:
          name: feature-inventory-wave-20
          path: artifacts/feature-inventory-wave-20.json
