name: Apply CI acceleration cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/ci-acceleration'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out acceleration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ci-acceleration
          fetch-depth: 0

      - name: Verify local Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Archive completed workflows
        shell: cmd
        run: |
          python -m py_compile tools\apply_ci_acceleration_cleanup.py
          python -m tools.apply_ci_acceleration_cleanup

      - name: Validate final workflow state
        shell: cmd
        run: |
          python -m py_compile tools\test_ci_acceleration.py
          python -m tools.test_ci_acceleration

      - name: Commit and push CI-only cleanup
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Archive completed automatic workflows"
          git push origin HEAD:agent/ci-acceleration
