name: Extract System Data presentation Wave 56

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/extract_system_data_wave56_tmp.py"
      - ".github/workflows/extract-system-data-wave-56.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-system-data-wave-56-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-56'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    steps:
      - name: Check out Wave 56 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-56
          fetch-depth: 0
          show-progress: false
      - name: Extract guarded System Data boundary
        shell: cmd
        run: python tools\extract_system_data_wave56_tmp.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\system_data_presentation.py
          python -m py_compile tools\test_system_data_presentation_wave_56.py
          python -m py_compile tools\test_system_data_widget_smoke_wave_56.py
          python -m compileall -q spina_app
      - name: Run exact extraction regression
        shell: cmd
        run: python -m tools.test_system_data_presentation_wave_56
      - name: Run real Tkinter construction test
        shell: cmd
        run: python -m tools.test_system_data_widget_smoke_wave_56
      - name: Run protected Data Bank and navigation regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_audit_presentation_wave_54
      - name: Commit extracted application boundary
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app\system_data_presentation.py tools\test_system_data_presentation_wave_56.py tools\test_system_data_widget_smoke_wave_56.py
          git diff --cached --quiet || git commit -m "Extract System Data presentation Wave 56"
          git push origin HEAD:agent/high-volume-wave-56
      - name: Regenerate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit refreshed architecture maps
        shell: cmd
        run: |
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 56 architecture maps"
          git push origin HEAD:agent/high-volume-wave-56
      - name: Upload Wave 56 extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-data-wave-56-extraction
          path: artifacts/wave-56-system-data-extraction.json
          if-no-files-found: warn
