name: High-volume Wave 26 inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/high-volume-wave-26'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile inventory tool
        shell: cmd
        run: python -m py_compile tools\inventory_high_volume_wave_26.py

      - name: Rank larger low-risk batches
        shell: cmd
        run: python -m tools.inventory_high_volume_wave_26

      - name: Upload high-volume inventory
        uses: actions/upload-artifact@v4
        with:
          name: high-volume-wave-26-inventory
          path: high-volume-wave-26-inventory.json
          if-no-files-found: error
