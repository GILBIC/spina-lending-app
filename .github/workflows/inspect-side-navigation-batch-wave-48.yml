name: Inspect side navigation batch Wave 48
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/inspect_side_navigation_batch_wave_48.py"
      - ".github/workflows/inspect-side-navigation-batch-wave-48.yml"
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'agent/login-account-presentation-batch-wave-48'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile inspector
        run: python -m py_compile tools/inspect_side_navigation_batch_wave_48.py
      - name: Inspect side navigation boundary
        run: python tools/inspect_side_navigation_batch_wave_48.py
      - name: Upload Wave 48 boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-48-side-navigation-boundary
          path: artifacts/wave-48-side-navigation-boundary.json
