name: Refresh Wave 45 smoke maps
on:
  push:
    branches:
      - agent/modularization-wave-45
    paths:
      - tools/test_login_dialog_widget_smoke_wave_45.py
permissions:
  contents: write
concurrency:
  group: refresh-wave-45-smoke-maps
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Compile and run login dialog smoke test
        shell: cmd
        run: |
          python -m py_compile tools/test_login_dialog_widget_smoke_wave_45.py
          python tools/test_login_dialog_widget_smoke_wave_45.py
      - name: Generate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Commit and push refreshed maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 45 maps for login smoke test"
          git push origin HEAD:agent/modularization-wave-45
