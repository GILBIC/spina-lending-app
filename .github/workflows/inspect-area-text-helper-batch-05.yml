name: Inspect area text helper batch 05

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/area-text-helper-batch-05-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact area helpers
        run: python tools/inspect_area_text_helper_batch_05.py
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/area_text_helper_batch_05_inspection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Inspect area text helper batch"
          git push origin HEAD:agent/area-text-helper-batch-05-work
