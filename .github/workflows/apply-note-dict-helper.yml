name: Apply note dictionary helper extraction

on:
  push:
    branches:
      - agent/extract-note-dict-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile guard and regression test
        run: |
          python -m py_compile \
            tools/extract_note_dict_helper.py \
            tools/test_note_dict_helper_extraction.py
      - name: Capture current behavior
        run: |
          python tools/test_note_dict_helper_extraction.py \
            --write-fixture tools/fixtures/note_dict_helper_behavior.json
      - name: Run guarded extraction
        run: |
          python tools/extract_note_dict_helper.py --json /tmp/note-dict-plan.json
          python tools/extract_note_dict_helper.py --apply
      - name: Validate extracted state
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/notes.py \
            tools/extract_note_dict_helper.py \
            tools/test_note_dict_helper_extraction.py
          python tools/test_note_dict_helper_extraction.py
      - name: Commit generated extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/notes.py \
            tools/fixtures/note_dict_helper_behavior.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract note dictionary helper"
          git push origin HEAD:${GITHUB_REF_NAME}
