name: Sidebar architecture validation Wave 88

on:
  pull_request:
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/features/side_navigation.py"
      - "spina_app/side_navigation_presentation.py"
      - "spina_app/account_header_presentation.py"
      - "tools/test_sidebar_validation_wave_88.py"
      - "tools/test_sidebar_cleanup_wave_87.py"
      - "tools/test_side_navigation_feature_wave_86.py"
      - "tools/test_side_navigation_presentation_wave_48.py"
      - "tools/test_navigation_compatibility_wave_86.py"
      - "tools/test_login_cancel_startup_wave_46.py"
      - "docs/sidebar-cleanup-wave-87.md"
      - ".github/workflows/sidebar-cleanup-wave-87.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70

    steps:
      - name: Check out exact Wave 88 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compile sidebar architecture
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py || exit /b 1
          python -m py_compile spina_app\features\side_navigation.py || exit /b 1
          python -m py_compile spina_app\side_navigation_presentation.py || exit /b 1
          python -m py_compile spina_app\account_header_presentation.py || exit /b 1
          python -m py_compile tools\test_sidebar_validation_wave_88.py || exit /b 1
          python -m py_compile tools\test_sidebar_cleanup_wave_87.py || exit /b 1
          python -m py_compile tools\test_side_navigation_feature_wave_86.py || exit /b 1
          python -m py_compile tools\test_side_navigation_presentation_wave_48.py || exit /b 1
          python -m py_compile tools\test_navigation_compatibility_wave_86.py || exit /b 1
          python -m py_compile tools\test_login_cancel_startup_wave_46.py || exit /b 1

      - name: Run permanent sidebar architecture regressions
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_validation_wave_88.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_sidebar_cleanup_wave_87.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_side_navigation_feature_wave_86.py || exit /b 1

      - name: Run protected navigation compatibility
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_side_navigation_presentation_wave_48.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_navigation_compatibility_wave_86.py || exit /b 1

      - name: Run account shell and startup compatibility
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_account_header_presentation_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_account_header_widget_smoke_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_login_cancel_startup_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_tk_shutdown_wave_46.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_feature_wave_83.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_cleanup_wave_84.py || exit /b 1
          set "PYTHONPATH=%CD%" && python tools\test_accounts_validation_wave_85.py || exit /b 1

      - name: Run permanent architecture map
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python -m tools.test_architecture_map

      - name: Require clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
