name: Extract side navigation batch Wave 48
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "tools/extract_side_navigation_batch_wave_48.py"
      - "tools/run_side_navigation_extractor_wave_48.py"
      - ".github/workflows/extract-side-navigation-batch-wave-48.yml"
permissions:
  contents: write
jobs:
  extract:
    if: github.head_ref == 'agent/login-account-presentation-batch-wave-48'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Compile guarded extractor
        shell: cmd
        run: |
          python -m py_compile tools/extract_side_navigation_batch_wave_48.py
          python -m py_compile tools/run_side_navigation_extractor_wave_48.py
      - name: Apply guarded extraction
        shell: cmd
        run: python tools/run_side_navigation_extractor_wave_48.py
      - name: Compile application, module, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/side_navigation_presentation.py
          python -m py_compile tools/test_side_navigation_presentation_wave_48.py
          python -m py_compile tools/test_side_navigation_widget_smoke_wave_48.py
          python -m compileall -q spina_app
      - name: Run exact Wave 48 regression
        shell: cmd
        run: python tools/test_side_navigation_presentation_wave_48.py
      - name: Run real Tkinter side-navigation smoke test
        shell: cmd
        run: python tools/test_side_navigation_widget_smoke_wave_48.py
      - name: Run protected navigation and theme regressions
        shell: cmd
        run: |
          python tools/test_navigation_databank_shell_wave_29.py
          python tools/test_theme_presentation_wave_35.py
      - name: Run protected login and lifecycle regressions
        shell: cmd
        run: |
          python tools/test_login_dialog_presentation_wave_45.py
          python tools/test_account_header_presentation_wave_46.py
          python tools/test_tk_shutdown_wave_46.py
          python tools/test_login_cancel_startup_wave_46.py
          python tools/test_account_permission_presentation_wave_47.py
      - name: Remove temporary Wave 48 files
        shell: cmd
        run: |
          git rm tools/inspect_login_account_batch_wave_48.py
          git rm tools/inspect_login_account_batch_wave_48_v2.py
          git rm tools/plan_high_volume_batch_wave_48.py
          git rm tools/inspect_side_navigation_batch_wave_48.py
          git rm tools/extract_side_navigation_batch_wave_48.py
          git rm tools/run_side_navigation_extractor_wave_48.py
          git rm .github/workflows/inspect-login-account-batch-wave-48.yml
          git rm .github/workflows/plan-high-volume-wave-48.yml
          git rm .github/workflows/inspect-side-navigation-batch-wave-48.yml
          git rm .github/workflows/extract-side-navigation-batch-wave-48.yml
      - name: Generate and validate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-48-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-48-quality.json
      - name: Commit guarded Wave 48 extraction
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/side_navigation_presentation.py tools/test_side_navigation_presentation_wave_48.py tools/test_side_navigation_widget_smoke_wave_48.py architecture-map.json docs/architecture
          git commit -m "Extract side navigation presentation batch Wave 48"
          git push origin HEAD:${{ github.head_ref }}
