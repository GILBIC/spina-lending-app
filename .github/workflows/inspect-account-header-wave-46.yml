name: Inspect account header Wave 46
on:
  push:
    branches:
      - agent/account-header-presentation-wave-46
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Compile inspector
        shell: cmd
        run: python -m py_compile tools/inspect_account_header_wave_46.py
      - name: Inspect active account header targets
        shell: cmd
        run: python tools/inspect_account_header_wave_46.py
      - name: Upload Wave 46 candidate report
        uses: actions/upload-artifact@v4
        with:
          name: wave-46-account-header-candidates
          path: artifacts/wave-46-account-header-candidates.json
