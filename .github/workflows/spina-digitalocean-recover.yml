name: Spina DigitalOcean Final Recovery

on:
  push:
    branches:
      - ops/digitalocean-production
    paths:
      - .github/workflows/spina-digitalocean-recover.yml

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: spina-digitalocean-final-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_DROPLET_ID: '597449345'
      TARGET_HOST: 157.230.250.111
      TARGET_HOSTNAME: spina.157-230-250-111.sslip.io
      RECOVERY_BROKER_URL: https://lnixxnckhitbzqtjvked.supabase.co/functions/v1/spina-github-recovery-secrets

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Recover final production server
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          cleanup() {
            set +e
            for file in \
              /tmp/spina-owner-key.enc \
              /tmp/spina-owner-key \
              /tmp/spina-oidc.json \
              /tmp/spina-recovery-secrets.json \
              /tmp/spina-runtime-secrets.json \
              /tmp/spina-target.json \
              /tmp/spina.env \
              /tmp/spina-release.tar.gz \
              /tmp/spina-live.json \
              /tmp/spina-ready.json \
              /tmp/spina-root.html \
              /tmp/spina-known-hosts \
              /tmp/spina-recovery-comment.md; do
              if [[ -f "$file" ]]; then
                shred -u "$file" 2>/dev/null || rm -f "$file"
              fi
            done
          }
          trap cleanup EXIT

          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=spina-digitalocean-recovery" \
            > /tmp/spina-oidc.json
          OIDC_TOKEN="$(jq -er '.value' /tmp/spina-oidc.json)"
          echo "::add-mask::$OIDC_TOKEN"

          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$RECOVERY_BROKER_URL" \
            > /tmp/spina-recovery-secrets.json

          for field in owner_key_b64 owner_key_passphrase database_pooler_url supabase_url supabase_publishable_key supabase_secret_key; do
            value="$(jq -er --arg field "$field" '.[$field]' /tmp/spina-recovery-secrets.json)"
            echo "::add-mask::$value"
          done

          OWNER_KEY_B64="$(jq -er '.owner_key_b64' /tmp/spina-recovery-secrets.json)"
          OWNER_KEY_PASSPHRASE="$(jq -er '.owner_key_passphrase' /tmp/spina-recovery-secrets.json)"
          printf '%s' "$OWNER_KEY_B64" | base64 -d > /tmp/spina-owner-key.enc
          export OWNER_KEY_PASSPHRASE
          openssl pkey \
            -in /tmp/spina-owner-key.enc \
            -passin env:OWNER_KEY_PASSPHRASE \
            -out /tmp/spina-owner-key
          chmod 600 /tmp/spina-owner-key
          ssh-keygen -lf /tmp/spina-owner-key -E sha256 | grep -F 'SHA256:P2GTOF9D0lOtAK+VuGz5t7oXZreC9dMiPlT3o9kZVY0' >/dev/null
          unset OWNER_KEY_B64 OWNER_KEY_PASSPHRASE

          jq -n \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson droplet_id "$TARGET_DROPLET_ID" \
            --arg host "$TARGET_HOST" \
            --arg hostname "$TARGET_HOSTNAME" \
            '{run_id:$run_id,droplet_id:$droplet_id,host:$host,hostname:$hostname}' \
            > /tmp/spina-target.json

          jq '{database_pooler_url,supabase_url,supabase_publishable_key,supabase_secret_key}' \
            /tmp/spina-recovery-secrets.json \
            > /tmp/spina-runtime-secrets.json

          python ops/digitalocean/workflow_helper.py write-env \
            --secrets /tmp/spina-runtime-secrets.json \
            --target /tmp/spina-target.json \
            --output /tmp/spina.env

          python tools/test_digitalocean_deployment_contract.py
          bash -n ops/digitalocean/bootstrap.sh
          npm install --ignore-scripts
          npm run build

          tar -czf /tmp/spina-release.tar.gz \
            dist \
            gilbic_backend \
            spina_backend_mobile \
            requirements.txt \
            ops/digitalocean/bootstrap.sh

          : > /tmp/spina-known-hosts
          ssh_ready=false
          for _ in $(seq 1 120); do
            if ssh-keyscan -T 5 -H "$TARGET_HOST" > /tmp/spina-known-hosts 2>/dev/null \
              && [[ -s /tmp/spina-known-hosts ]]; then
              ssh_ready=true
              break
            fi
            sleep 5
          done
          [[ "$ssh_ready" == true ]] || { echo "SSH did not become ready." >&2; exit 1; }

          SSH_OPTIONS=(
            -i /tmp/spina-owner-key
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile=/tmp/spina-known-hosts
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          ssh_with_retry() {
            local attempt
            for attempt in $(seq 1 8); do
              if ssh "${SSH_OPTIONS[@]}" root@"$TARGET_HOST" "$@"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          scp_with_retry() {
            local source="$1"
            local destination="$2"
            local attempt
            for attempt in $(seq 1 8); do
              if scp "${SSH_OPTIONS[@]}" "$source" root@"$TARGET_HOST":"$destination"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          start_remote_bootstrap() {
            ssh_with_retry "install -d -m 0700 /var/lib/spina; rm -f /var/lib/spina-bootstrap.exit /var/log/spina-bootstrap.log; (nohup bash /tmp/spina-bootstrap.sh '$GITHUB_SHA' '$TARGET_HOSTNAME' > /var/log/spina-bootstrap.log 2>&1 < /dev/null; printf '%s\\n' \$? > /var/lib/spina-bootstrap.exit) >/dev/null 2>&1 &"
          }

          poll_remote_bootstrap() {
            local status
            local attempt
            for attempt in $(seq 1 180); do
              status="$(ssh "${SSH_OPTIONS[@]}" root@"$TARGET_HOST" "cat /var/lib/spina-bootstrap.exit 2>/dev/null || true" 2>/dev/null | tr -d '\r\n' || true)"
              if [[ "$status" == "0" ]]; then
                return 0
              fi
              if [[ "$status" =~ ^[1-9][0-9]*$ ]]; then
                ssh_with_retry "tail -n 250 /var/log/spina-bootstrap.log >&2 || true; journalctl -u spina-api --no-pager -n 150 >&2 || true" || true
                return 1
              fi
              sleep 10
            done
            ssh_with_retry "tail -n 250 /var/log/spina-bootstrap.log >&2 || true; journalctl -u spina-api --no-pager -n 150 >&2 || true" || true
            return 1
          }

          scp_with_retry /tmp/spina-release.tar.gz /tmp/spina-release.tar.gz
          scp_with_retry /tmp/spina.env /tmp/spina.env
          scp_with_retry ops/digitalocean/bootstrap.sh /tmp/spina-bootstrap.sh
          start_remote_bootstrap
          poll_remote_bootstrap

          public_ready=false
          for _ in $(seq 1 120); do
            if curl --fail --silent --show-error --max-time 15 "https://$TARGET_HOSTNAME/health/live" > /tmp/spina-live.json \
              && curl --fail --silent --show-error --max-time 15 "https://$TARGET_HOSTNAME/health/ready" > /tmp/spina-ready.json \
              && curl --fail --silent --show-error --max-time 15 "https://$TARGET_HOSTNAME/" > /tmp/spina-root.html \
              && jq -e '.status == "ok"' /tmp/spina-live.json >/dev/null \
              && jq -e '.status == "ready" and .database == "ok"' /tmp/spina-ready.json >/dev/null \
              && grep -q '<title>Spina</title>' /tmp/spina-root.html; then
              public_ready=true
              break
            fi
            sleep 5
          done
          [[ "$public_ready" == true ]] || { echo "Public HTTPS verification failed." >&2; exit 1; }

          ssh_with_retry "set -Eeuo pipefail; temporary=\$(mktemp); grep -vF 'spina-digitalocean-run-' /root/.ssh/authorized_keys > \"\$temporary\" || true; grep -F 'spina-owner-recovery-2026-09-03-final' \"\$temporary\" >/dev/null; install -m 0600 -o root -g root \"\$temporary\" /root/.ssh/authorized_keys; rm -f \"\$temporary\"; ! grep -F 'spina-digitalocean-run-' /root/.ssh/authorized_keys"

          python ops/digitalocean/workflow_helper.py write-evidence \
            --target /tmp/spina-target.json \
            --output /tmp/spina-recovery-evidence.json \
            --git-sha "$GITHUB_SHA"
          python ops/digitalocean/workflow_helper.py write-comment \
            --target /tmp/spina-target.json \
            --output /tmp/spina-recovery-comment.md \
            --git-sha "$GITHUB_SHA"
          printf '\n- Recovery path: passphrase-protected owner key; transient deploy keys removed.\n' >> /tmp/spina-recovery-comment.md
          gh issue comment 296 --repo "$GITHUB_REPOSITORY" --body-file /tmp/spina-recovery-comment.md

      - name: Upload non-secret recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spina-digitalocean-recovery-${{ github.sha }}
          path: /tmp/spina-recovery-evidence.json
          if-no-files-found: ignore
          retention-days: 30
