name: Linked client queries Wave 32

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/linked-client-queries-wave-32'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile application, module, and test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/linked_client_queries.py
          python -m py_compile tools/test_linked_client_queries_wave_32.py
          python -m compileall -q spina_app

      - name: Run linked-client read-query regression
        shell: cmd
        run: python -m tools.test_linked_client_queries_wave_32

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run redundancy audit
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-32-redundancy.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-32-quality.json

      - name: Upload Wave 32 reports
        uses: actions/upload-artifact@v4
        with:
          name: linked-client-queries-wave-32-reports
          path: |
            artifacts/wave-32-redundancy.json
            artifacts/wave-32-quality.json
            architecture-map.json
            docs/architecture
          if-no-files-found: error
