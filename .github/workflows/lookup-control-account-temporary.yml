name: Temporary control account lookup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/lookup-control-account-temporary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-54'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Inspect account defaults
        shell: cmd
        run: |
          python -c "from pathlib import Path; p=Path('OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py'); ls=p.read_text(encoding='utf-8').splitlines(); keys=('control','system123','control123','default_password','must_change_password'); [print(f'{i+1}: {line}') for i,line in enumerate(ls) if any(k in line.lower() for k in keys)]"
