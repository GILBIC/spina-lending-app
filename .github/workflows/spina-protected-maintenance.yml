name: SPINA Protected Maintenance (manual only)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Protected maintenance operation
        required: true
        type: choice
        options:
          - ecl-credit-risk-labels
          - v1-tax-accounting
          - stage5e2-history-import
          - stage5e3-outcome-review
          - stage5e41-contractual-dpd
          - stage5e43-contract-registration
          - stage5e46a-contract-activation
      confirm_protected_live_database:
        description: I explicitly authorize this protected live-database maintenance run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: spina-protected-maintenance
  cancel-in-progress: false

jobs:
  protected-maintenance:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Require explicit main-branch authorization
        shell: cmd
        run: |
          if not "${{ github.ref }}"=="refs/heads/main" exit /b 1
          if not "${{ inputs.confirm_protected_live_database }}"=="true" exit /b 1

      - name: Require approved protected runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'SPINA-WINDOWS') {
            throw "Protected maintenance requires SPINA-WINDOWS; current runner is $env:RUNNER_NAME."
          }

      - name: Check out exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the selected legacy one-time marker
        if: startsWith(inputs.operation, 'stage5e')
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $markers = @{
            'stage5e2-history-import' = 'tools\stage5e2-import.once'
            'stage5e3-outcome-review' = 'tools\stage5e3-live-migration.once'
            'stage5e41-contractual-dpd' = 'tools\stage5e41-live-migration.once'
            'stage5e43-contract-registration' = 'tools\stage5e43-live-migration.once'
            'stage5e46a-contract-activation' = 'tools\stage5e46a-live-migration.once'
          }
          $operation = '${{ inputs.operation }}'
          $marker = $markers[$operation]
          if ([string]::IsNullOrWhiteSpace($marker) -or -not (Test-Path -LiteralPath $marker)) {
            throw "The selected protected maintenance operation is missing its committed one-time marker: $operation"
          }

      - name: Create isolated maintenance environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-protected-maintenance-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          echo PROTECTED_MAINTENANCE_VENV=%VENV%>>"%GITHUB_ENV%"
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check -e ".\gilbic_backend[test]" || exit /b 1

      - name: Run protected ECL migration and verification
        if: inputs.operation == 'ecl-credit-risk-labels'
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_ecl_live_migrations_version_aware.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Run protected V1 tax accounting migration and verification
        if: inputs.operation == 'v1-tax-accounting'
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_v1_tax_accounting_migrations.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Manual Stage 5E.2 live historical import
        if: inputs.operation == 'stage5e2-history-import' && hashFiles('tools/stage5e2-import.once') != ''
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\import_ecl_history.py --find-source-name "loans(20260808-080255).db" --search-root "C:\Users\pc" --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL --expected-sha256 3ef840b6221c9d94327c3e5beb10318899f7a5ee96643df87a49b02312d77260 --expected-episodes 992 || exit /b 1

      - name: Manual Stage 5E.3 live outcome-review migration
        if: inputs.operation == 'stage5e3-outcome-review' && hashFiles('tools/stage5e3-live-migration.once') != ''
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_stage5e3_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL --expected-episodes 992 --expected-usable 919 || exit /b 1

      - name: Manual Stage 5E.4.1 live contractual DPD migration
        if: inputs.operation == 'stage5e41-contractual-dpd' && hashFiles('tools/stage5e41-live-migration.once') != ''
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_stage5e41_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Manual Stage 5E.4.3 live verified contract registration migration
        if: inputs.operation == 'stage5e43-contract-registration' && hashFiles('tools/stage5e43-live-migration.once') != ''
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_stage5e43_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Manual Stage 5E.4.6A live per-loan activation schema migration
        if: inputs.operation == 'stage5e46a-contract-activation' && hashFiles('tools/stage5e46a-live-migration.once') != ''
        shell: cmd
        run: |
          "%PROTECTED_MAINTENANCE_VENV%\Scripts\python.exe" tools\apply_stage5e46a_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree
        if: always()
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
