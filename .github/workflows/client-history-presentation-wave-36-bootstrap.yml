name: Client history presentation Wave 36 bootstrap
on: [pull_request]
permissions:
  contents: write
jobs:
  extract-and-validate:
    if: github.head_ref == 'agent/client-history-presentation-wave-36'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out Wave 36 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify local Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh auth status
      - name: Apply guarded client-history extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/apply_client_history_presentation_wave_36.py > artifacts\wave-36-extractor.log 2>&1
          set "RC=%ERRORLEVEL%"
          type artifacts\wave-36-extractor.log
          exit /b %RC%
      - name: Upload extractor diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-36-extractor-diagnostic
          path: artifacts/wave-36-extractor.log
          if-no-files-found: error
      - name: Compile application, module, and test
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/client_history_presentation.py
          python -m py_compile tools/test_client_history_presentation_wave_36.py
          python -m compileall -q spina_app
      - name: Run exact client-history regression
        shell: cmd
        run: python tools/test_client_history_presentation_wave_36.py
      - name: Commit application extraction
        shell: cmd
        run: |
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git commit -m "Extract client history presentation Wave 36"
      - name: Regenerate architecture map
        shell: cmd
        run: |
          python tools/generate_architecture_map.py
          python tools/test_architecture_map.py
      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-36-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-36-quality.json
      - name: Commit architecture refresh
        shell: cmd
        run: |
          git add architecture-map.json docs/architecture
          git commit -m "Refresh architecture map after Wave 36"
      - name: Push completed Wave 36 branch
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git push origin HEAD:agent/client-history-presentation-wave-36
