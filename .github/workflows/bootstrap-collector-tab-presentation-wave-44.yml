name: Bootstrap collector tab presentation Wave 44
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: bootstrap-collector-tab-presentation-wave-44-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  extract:
    if: github.head_ref == 'agent/collector-tab-presentation-wave-44'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify source and patch temporary guards
        shell: cmd
        run: python .github/scripts/patch_collector_tab_wave_44_detector.py
      - name: Extract guarded collector-tab presentation
        shell: cmd
        run: python .github/scripts/extract_collector_tab_presentation_wave_44.py
      - name: Patch generated import paths
        shell: cmd
        run: python .github/scripts/patch_generated_collector_tab_wave_44_imports.py
      - name: Compile generated application
        shell: cmd
        run: python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
      - name: Compile generated module and tests
        shell: cmd
        run: |
          python -m py_compile spina_app/collector_tab_presentation.py
          python -m py_compile tools/test_collector_tab_presentation_wave_44.py
          python -m py_compile .github/scripts/diagnose_collector_tab_wave_44.py
          python -m py_compile .github/scripts/patch_generated_collector_tab_wave_44_imports.py
          python -m compileall -q spina_app
      - name: Check Wave 44 metadata
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py metadata
      - name: Check Wave 44 module source
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py module-source
      - name: Check Wave 44 safety boundary
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py safety
      - name: Check Wave 44 desktop structure
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py desktop-structure
      - name: Check Wave 44 import wiring
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py imports
      - name: Check Wave 44 runtime bindings
        shell: cmd
        run: python .github/scripts/diagnose_collector_tab_wave_44.py bindings
      - name: Run exact Wave 44 regression
        shell: cmd
        run: python -m tools.test_collector_tab_presentation_wave_44
      - name: Run repository audits before commit
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-44-bootstrap-redundancy.json
          python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-44-bootstrap-quality.json
      - name: Commit permanent extraction and clean architecture maps
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py spina_app/collector_tab_presentation.py tools/test_collector_tab_presentation_wave_44.py .github/workflows/collector-tab-presentation-wave-44.yml
          git diff --cached --quiet || git commit -m "Extract active collector tab presentation Wave 44"
          git rm -f .github/scripts/extract_collector_tab_presentation_wave_44.py .github/scripts/patch_collector_tab_wave_44_detector.py .github/scripts/diagnose_collector_tab_wave_44.py .github/scripts/patch_generated_collector_tab_wave_44_imports.py .github/workflows/bootstrap-collector-tab-presentation-wave-44.yml
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs/architecture
          git diff --cached --quiet || git commit -m "Refresh architecture maps for Wave 44"
          gh auth setup-git
          git push origin HEAD:${{ github.head_ref }}
