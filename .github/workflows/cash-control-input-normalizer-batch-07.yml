name: Cash Control input normalizer batch 07

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile app, module, and tests
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/numbers.py \
            tools/extract_pure_helper_batch.py \
            tools/test_cash_control_input_normalizer_batch_07.py

      - name: Verify exact extracted state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cash_control_input_normalizer_batch_07_manifest.json

      - name: Verify preserved input-normalizer behavior
        run: |
          PYTHONPATH=. python tools/test_cash_control_input_normalizer_batch_07.py \
            --manifest tools/fixtures/cash_control_input_normalizer_batch_07_manifest.json \
            --fixture tools/fixtures/cash_control_input_normalizer_batch_07_behavior.json
