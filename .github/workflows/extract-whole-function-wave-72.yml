name: Extract Whole Function Wave 72

on:
  pull_request:
    branches:
      - main
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/theme_application.py"
      - "tools/test_theme_application_wave_72.py"
      - "tools/extract_whole_function_wave_72.py"
      - ".github/workflows/extract-whole-function-wave-72.yml"
  push:
    branches:
      - agent/high-volume-wave-72
    paths:
      - "spina_app/theme_application.py"
      - "tools/test_theme_application_wave_72.py"
      - "tools/extract_whole_function_wave_72.py"
      - ".github/workflows/extract-whole-function-wave-72.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-whole-function-wave-72-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out Wave 72 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-72
          fetch-depth: 0
          show-progress: false

      - name: Compile extraction tools and permanent module
        run: |
          python -m py_compile tools\inspect_whole_function_wave_72.py
          python -m py_compile tools\extract_whole_function_wave_72.py
          python -m py_compile spina_app\theme_application.py
          python -m py_compile tools\test_theme_application_wave_72.py

      - name: Reconfirm exact complete function
        run: python tools\inspect_whole_function_wave_72.py

      - name: Remove only the inspected complete function and bind module
        run: python tools\extract_whole_function_wave_72.py

      - name: Compile cleaned application and modules
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\theme_application.py
          python -m py_compile spina_app\theme_presentation.py
          python -m compileall -q spina_app

      - name: Run Wave 72 complete-function regressions
        run: python -m tools.test_theme_application_wave_72

      - name: Run protected Wave 35 theme regressions
        run: python -m tools.test_theme_presentation_wave_35

      - name: Regenerate and validate architecture maps
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Run repository audits
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-72-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-72-quality.json

      - name: Commit validated whole-function extraction
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py architecture-map.json docs\architecture
          git diff --cached --quiet
          if %ERRORLEVEL% EQU 0 exit /b 0
          git commit -m "Extract complete theme function Wave 72"
          git push origin HEAD:agent/high-volume-wave-72

      - name: Upload Wave 72 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave72-whole-function-reports
          path: |
            wave72_whole_function_report.json
            artifacts/wave-72-*.json
          if-no-files-found: warn
