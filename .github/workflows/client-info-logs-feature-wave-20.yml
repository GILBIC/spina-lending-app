name: Client Information Log feature Wave 20

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/feature-module-wave-20'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify local Python
        shell: cmd
        run: |
          where python
          python --version

      - name: Compile application and CILog module
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\tabs\client_info_logs.py
          python -m py_compile tools\test_client_info_logs_feature_wave_20.py

      - name: Run CILog feature regression
        shell: cmd
        run: python -m tools.test_client_info_logs_feature_wave_20

      - name: Run redundancy audit
        shell: cmd
        run: python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json redundancy-report.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json quality-report.json

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: client-info-logs-wave-20-audits
          path: |
            redundancy-report.json
            quality-report.json
