name: Apply Navigation and Data Bank shell Wave 29

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/navigation-databank-shell-wave-29'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Check out Wave 29 branch
        uses: actions/checkout@v4
        with:
          ref: agent/navigation-databank-shell-wave-29
          fetch-depth: 0

      - name: Verify Python and GitHub CLI
        shell: cmd
        run: |
          where python
          python --version
          where gh
          gh --version
          gh auth status

      - name: Apply guarded 546-line extraction
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools/patch_wave29_override_guard.py > artifacts\wave-29-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-29-apply.log & exit /b 1
          python -m tools.patch_wave29_override_guard >> artifacts\wave-29-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-29-apply.log & exit /b 1
          python -m py_compile tools/apply_navigation_databank_shell_wave_29.py >> artifacts\wave-29-apply.log 2>&1
          if errorlevel 1 type artifacts\wave-29-apply.log & exit /b 1
          python -m tools.apply_navigation_databank_shell_wave_29 >> artifacts\wave-29-apply.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\wave-29-apply.log
          exit /b %CODE%

      - name: Upload Wave 29 apply diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-databank-shell-wave-29-apply-diagnostic
          path: artifacts/wave-29-apply.log
          if-no-files-found: warn

      - name: Compile extracted application and modules
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app/navigation.py
          python -m py_compile spina_app/tabs/data_bank_shell.py
          python -m py_compile tools/test_navigation_databank_shell_wave_29.py
          python -m compileall -q spina_app

      - name: Run focused Wave 29 regression
        shell: cmd
        run: |
          python -m tools.test_navigation_databank_shell_wave_29 > artifacts\wave-29-regression.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\wave-29-regression.log
          exit /b %CODE%

      - name: Upload Wave 29 regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-databank-shell-wave-29-regression-diagnostic
          path: artifacts/wave-29-regression.log
          if-no-files-found: warn

      - name: Run redundancy audit
        shell: cmd
        run: python tools/redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-29-redundancy.json

      - name: Run SPINA quality audit
        shell: cmd
        run: python tools/spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts/wave-29-quality.json

      - name: Remove temporary Wave 29 tooling
        shell: cmd
        run: |
          del tools\inventory_navigation_databank_shell_wave_29.py
          del tools\inspect_navigation_databank_shell_wave_29_sources.py
          del tools\apply_navigation_databank_shell_wave_29.py
          del tools\patch_wave29_override_guard.py
          del .github\workflows\navigation-databank-shell-wave-29-inventory.yml
          del .github\workflows\apply-navigation-databank-shell-wave-29.yml
          rmdir /S /Q artifacts

      - name: Commit Wave 29 extraction locally
        shell: cmd
        run: |
          git config --local --unset-all http.https://github.com/.extraheader 2>nul || ver >nul
          gh auth setup-git
          git config user.name "GILBIC"
          git config user.email "267608671+GILBIC@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Modularize navigation and Data Bank shell Wave 29"

      - name: Refresh permanent architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map
          git add architecture-map.json docs/architecture
          git diff --cached --check
          git commit -m "Refresh architecture map after Wave 29"

      - name: Push completed Wave 29 branch
        shell: cmd
        run: git push origin HEAD:agent/navigation-databank-shell-wave-29
