name: Clients form formatter binding hotfix

on:
  pull_request:
    paths:
      - "spina_app/features/clients.py"
      - "spina_app/client_application.py"
      - "tools/test_clients_form_formatters_hotfix.py"
      - ".github/workflows/clients-form-formatters-hotfix.yml"
  workflow_dispatch:

concurrency:
  group: clients-form-formatters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner))
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Check out exact hotfix head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compile Clients form and regressions
        shell: cmd
        run: |
          python -m py_compile spina_app\features\clients.py
          python -m py_compile spina_app\client_application.py
          python -m py_compile tools\test_clients_form_formatters_hotfix.py
          python -m py_compile tools\test_clients_feature_wave_81.py

      - name: Reproduce and verify form formatter binding
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_clients_form_formatters_hotfix.py

      - name: Run complete Clients Wave 81 regressions
        shell: cmd
        run: set "PYTHONPATH=%CD%" && python tools\test_clients_feature_wave_81.py

      - name: Run Reports Collector Route and financial compatibility
        shell: cmd
        run: |
          set "PYTHONPATH=%CD%" && python tools\test_reports_feature_wave_80.py
          set "PYTHONPATH=%CD%" && python tools\test_collector_route_feature_wave_79.py
          set "PYTHONPATH=%CD%" && python tools\test_wave75_compat_under_wave76.py
          set "PYTHONPATH=%CD%" && python tools\test_wave74_compat_under_wave76.py
          set "PYTHONPATH=%CD%" && python tools\test_x7_fixed_interest_basis_wave_74.py

      - name: Check clean diff
        shell: cmd
        run: git diff --check
