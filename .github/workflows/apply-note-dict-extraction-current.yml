name: Apply current note dictionary extraction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-note-dict-helper-current
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source behavior
        run: |
          python tools/extract_note_dict_helper.py
          python tools/test_note_dict_helper_extraction.py
      - name: Apply guarded extraction
        run: python tools/extract_note_dict_helper.py --apply
      - name: Compile and compare behavior
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/notes.py \
            tools/extract_note_dict_helper.py \
            tools/test_note_dict_helper_extraction.py
          python tools/test_note_dict_helper_extraction.py
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/notes.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract note dictionary helper from current main"
          git push origin HEAD:agent/extract-note-dict-helper-current
