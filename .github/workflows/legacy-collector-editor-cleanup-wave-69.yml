name: Legacy Collector Editor Cleanup Wave 69

# Permanent read-only exact-head validation for Wave 69.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py"
      - "spina_app/collector_dialog_presentation.py"
      - "spina_app/collector_tab_presentation.py"
      - "tools/test_collector_dialog_presentation_wave_43.py"
      - "tools/test_collector_editor_widget_smoke_wave_69.py"
      - "tools/test_collectors_editor_wave_26.py"
      - "tools/test_legacy_collector_editor_cleanup_wave_69.py"
      - "architecture-map.json"
      - "docs/architecture/**"
      - ".github/workflows/legacy-collector-editor-cleanup-wave-69.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-collector-editor-cleanup-wave-69-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-69'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Compile application, modules, and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\collector_dialog_presentation.py
          python -m py_compile spina_app\collector_tab_presentation.py
          python -m py_compile tools\test_collector_dialog_presentation_wave_43.py
          python -m py_compile tools\test_collector_editor_widget_smoke_wave_69.py
          python -m py_compile tools\test_collectors_editor_wave_26.py
          python -m py_compile tools\test_legacy_collector_editor_cleanup_wave_69.py
          python -m compileall -q spina_app

      - name: Run Wave 69 redundancy-cleanup regression
        shell: cmd
        run: python -m tools.test_legacy_collector_editor_cleanup_wave_69

      - name: Run modern collector dialog exact regression
        shell: cmd
        run: python -m tools.test_collector_dialog_presentation_wave_43

      - name: Run modern collector dialog real Tkinter regression
        shell: cmd
        run: python -m tools.test_collector_editor_widget_smoke_wave_69

      - name: Run protected collectors editor regression
        shell: cmd
        run: python -m tools.test_collectors_editor_wave_26

      - name: Validate permanent architecture map
        uses: ./.github/actions/architecture-map-check

      - name: Run repository audits
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-69-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-69-quality.json

      - name: Upload Wave 69 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-collector-editor-cleanup-wave-69-reports
          path: artifacts/wave-69-*.json
          if-no-files-found: warn
