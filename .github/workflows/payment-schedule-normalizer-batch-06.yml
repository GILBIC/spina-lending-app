name: Payment schedule normalizer batch 06

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile app, module, and tests
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/utilities/dates.py \
            tools/extract_pure_helper_batch.py \
            tools/test_payment_schedule_normalizer_batch_06.py

      - name: Verify exact extracted state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/payment_schedule_normalizer_batch_06_manifest.json

      - name: Verify preserved normalizer behavior
        run: |
          PYTHONPATH=. python tools/test_payment_schedule_normalizer_batch_06.py \
            --manifest tools/fixtures/payment_schedule_normalizer_batch_06_manifest.json \
            --fixture tools/fixtures/payment_schedule_normalizer_batch_06_behavior.json
