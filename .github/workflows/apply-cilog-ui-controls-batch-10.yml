name: Apply CILog UI controls batch 10

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/cilog-ui-controls-batch-10'
    runs-on: ubuntu-latest
    steps:
      - name: Check out extraction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guarded extraction inputs
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_controls.py \
            tools/extract_pure_helper_batch.py \
            tools/test_cilog_ui_controls_batch_10.py

      - name: Verify exact original source state
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cilog_ui_controls_batch_10_manifest.json

      - name: Capture original behavior
        run: |
          PYTHONPATH=. python tools/test_cilog_ui_controls_batch_10.py \
            --manifest tools/fixtures/cilog_ui_controls_batch_10_manifest.json \
            --fixture tools/fixtures/cilog_ui_controls_batch_10_behavior.json \
            --write-fixture

      - name: Apply guarded extraction
        run: |
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cilog_ui_controls_batch_10_manifest.json \
            --apply

      - name: Verify extracted behavior and compilation
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            spina_app/theme_palettes.py \
            spina_app/ui_controls.py \
            tools/extract_pure_helper_batch.py \
            tools/test_cilog_ui_controls_batch_10.py
          python tools/extract_pure_helper_batch.py \
            --manifest tools/fixtures/cilog_ui_controls_batch_10_manifest.json
          PYTHONPATH=. python tools/test_cilog_ui_controls_batch_10.py \
            --manifest tools/fixtures/cilog_ui_controls_batch_10_manifest.json \
            --fixture tools/fixtures/cilog_ui_controls_batch_10_behavior.json

      - name: Run focused audits
        run: |
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json redundancy-report.json
          python tools/spina_quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json quality-report.json

      - name: Commit verified extraction and remove write workflow
        run: |
          rm .github/workflows/apply-cilog-ui-controls-batch-10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Client Information Log UI controls"
          git push origin HEAD:${{ github.head_ref }}
