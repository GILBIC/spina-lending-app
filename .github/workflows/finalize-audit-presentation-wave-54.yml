name: Finalize Audit presentation Wave 54

on:
  push:
    branches:
      - agent/high-volume-wave-54
    paths:
      - ".github/workflows/finalize-audit-presentation-wave-54.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-audit-presentation-wave-54.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-audit-presentation-wave-54-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-54'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 54 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-54
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - name: Remove temporary Wave 54 planning and extraction files
        shell: cmd
        run: |
          if exist tools\plan_high_volume_wave_54.py del /q tools\plan_high_volume_wave_54.py
          if exist tools\extract_audit_presentation_wave_54.py del /q tools\extract_audit_presentation_wave_54.py
          if exist docs\wave-54-candidate-report.md del /q docs\wave-54-candidate-report.md
          if exist artifacts\wave-54-candidates.json del /q artifacts\wave-54-candidates.json
          if exist .github\workflows\plan-high-volume-wave-54.yml del /q .github\workflows\plan-high-volume-wave-54.yml
          if exist .github\workflows\extract-audit-presentation-wave-54.yml del /q .github\workflows\extract-audit-presentation-wave-54.yml
          if exist .github\workflows\finalize-audit-presentation-wave-54.yml del /q .github\workflows\finalize-audit-presentation-wave-54.yml

      - name: Compile and run final focused tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\audit_presentation.py
          python -m py_compile tools\test_audit_presentation_wave_54.py
          python -m py_compile tools\test_audit_widget_smoke_wave_54.py
          python -m tools.test_audit_presentation_wave_54
          python -m tools.test_audit_widget_smoke_wave_54
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Refresh and validate clean architecture map
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Commit clean Wave 54 branch
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Finalize Audit presentation Wave 54"
          git push origin HEAD:agent/high-volume-wave-54
