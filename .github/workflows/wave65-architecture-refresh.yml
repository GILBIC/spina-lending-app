name: Wave 65 Architecture Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/wave65-architecture-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave65-architecture-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-65'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out exact Wave 65 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Regenerate maps from cleaned source tree
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Commit refreshed maps
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh cleaned Wave 65 architecture maps"
          git push origin HEAD:agent/high-volume-wave-65
