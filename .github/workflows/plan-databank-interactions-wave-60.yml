name: Plan Data Bank interactions Wave 60

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-60'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Check out Wave 60 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Analyze Data Bank interaction boundary
        shell: cmd
        run: python tools\plan_databank_interactions_wave60_tmp.py
      - name: Upload Wave 60 candidate report
        uses: actions/upload-artifact@v4
        with:
          name: databank-interactions-wave-60-candidates
          path: artifacts/wave-60-databank-interactions.json
