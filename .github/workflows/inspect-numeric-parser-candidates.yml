name: Inspect numeric parser candidates

on:
  push:
    branches:
      - agent/extract-numeric-parsers

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate candidate report
        run: python tools/inspect_numeric_parser_candidates.py

      - name: Commit report when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/numeric_parser_inspection.json
          if git diff --cached --quiet; then
            echo "Inspection report unchanged."
            exit 0
          fi
          git commit -m "Inspect numeric parser candidates"
          git push origin HEAD:${GITHUB_REF_NAME}
