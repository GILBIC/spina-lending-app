name: Dump Delete Day Wave 62

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/dump-delete-day-wave-62.yml"
      - "tools/dump_delete_day_wave62_tmp.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dump-delete-day-wave-62-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dump:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-62'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Check out Wave 62 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Dump exact Delete Day source
        shell: cmd
        run: python tools\dump_delete_day_wave62_tmp.py
      - name: Commit source dump
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs\wave-62-delete-day-source.tmp.txt
          git commit -m "Record exact Wave 62 Delete Day source"
          git push origin HEAD:agent/high-volume-wave-62
