name: 7x7 source-event accounting preview live migration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0064_add_7x7_source_event_accounting_preview.sql'
      - 'tools/apply_7x7_source_event_accounting_preview_migration.py'
      - 'tools/7x7-source-event-accounting-preview-live-migration.once'
      - '.github/workflows/7x7-source-event-accounting-preview-live-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'gilbic_backend/sql/0064_add_7x7_source_event_accounting_preview.sql'
      - 'tools/apply_7x7_source_event_accounting_preview_migration.py'
      - 'tools/7x7-source-event-accounting-preview-live-migration.once'
      - '.github/workflows/7x7-source-event-accounting-preview-live-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-by-seven-source-preview-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-seven-by-seven-source-preview-live-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Python runtime
        shell: cmd
        run: |
          python --version || exit /b 1
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version" || exit /b 1

      - name: Create isolated verifier environment
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-7x7-source-preview-live-venv"
          if exist "%VENV%" rmdir /s /q "%VENV%"
          python -m venv "%VENV%" || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check --upgrade pip || exit /b 1
          "%VENV%\Scripts\python.exe" -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4" || exit /b 1

      - name: Compile protected live verifier
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-7x7-source-preview-live-venv"
          "%VENV%\Scripts\python.exe" -m py_compile tools\apply_7x7_source_event_accounting_preview_migration.py || exit /b 1

      - name: Verify PR is read-only and posting-disabled
        if: github.event_name == 'pull_request'
        shell: cmd
        run: |
          python -c "from pathlib import Path; s=Path('gilbic_backend/sql/0064_add_7x7_source_event_accounting_preview.sql').read_text(encoding='utf-8'); u=s.upper(); assert s.strip().startswith('BEGIN;') and s.strip().endswith('COMMIT;'); assert 'INSERT INTO LENDING.' not in u; assert 'UPDATE LENDING.' not in u; assert 'DELETE FROM LENDING.' not in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_ENTRIES' not in u; assert 'INSERT INTO ACCOUNTING.JOURNAL_LINES' not in u; assert 'FALSE AS OPERATIONAL_ALLOCATION_SUBSTITUTED_FOR_ACCOUNTING' in u; assert 'NULL::NUMERIC(18,2) AS AUTHORITATIVE_CURRENT_GROSS_CARRYING_AMOUNT' in u; assert 'FALSE AS JOURNAL_DRAFT_ENABLED' in u; assert 'FALSE AS JOURNAL_LINES_ENABLED' in u; assert 'FALSE AS AUTOMATIC_SOURCE_POSTING' in u" || exit /b 1

      - name: Install and verify 7x7 source-event preview controls on live database
        if: github.event_name != 'pull_request'
        shell: cmd
        run: |
          set "VENV=%RUNNER_TEMP%\spina-7x7-source-preview-live-venv"
          "%VENV%\Scripts\python.exe" tools\apply_7x7_source_event_accounting_preview_migration.py --env-file "C:\GitHub\spina-lending-app-clean\.env" --env-file "C:\SPINA_ONLINE\spina_backend\.env" --database-url-env GILBIC_DATABASE_URL || exit /b 1

      - name: Require a clean committed tree
        shell: cmd
        run: |
          git diff --check || exit /b 1
          git diff --exit-code || exit /b 1
          git diff --cached --exit-code || exit /b 1
