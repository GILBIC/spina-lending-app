name: Inject critical-path logging

on:
  push:
    branches: [diagnostics/critical-path-logging]
    paths:
      - 'docs/trigger-critical-path-logging.txt'
      - '.github/workflows/inject-critical-path-logging.yml'
      - 'tools/inject_critical_path_logging.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject critical-path logging
        run: python tools/inject_critical_path_logging.py

      - name: Compile and audit
        run: |
          python -m py_compile \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            tools/redundancy_audit.py \
            tools/spina_quality_audit.py \
            tools/spina_startup_diagnostics.py \
            tools/add_optional_performance_logs.py \
            tools/inject_critical_path_logging.py
          python tools/redundancy_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json redundancy-report.json
          python tools/spina_quality_audit.py \
            OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py \
            --json quality-report.json

      - name: Remove temporary trigger and reports
        run: |
          rm -f docs/trigger-critical-path-logging.txt
          rm -f redundancy-report.json quality-report.json

      - name: Commit generated source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py docs/code-issue-review.md docs/trigger-critical-path-logging.txt redundancy-report.json quality-report.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'Inject critical-path runtime logging'
            git push
          fi
