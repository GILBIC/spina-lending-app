name: Repair Data Bank import Wave 53

on:
  push:
    branches:
      - agent/high-volume-wave-53
    paths:
      - "tools/fix_databank_import_control_wave_53.py"
      - ".github/workflows/repair-databank-import-wave-53.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/fix_databank_import_control_wave_53.py"
      - ".github/workflows/repair-databank-import-wave-53.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-databank-import-wave-53-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-53'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact Wave 53 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          show-progress: false

      - name: Apply guarded import-control repair
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m py_compile tools\fix_databank_import_control_wave_53.py
          python tools\fix_databank_import_control_wave_53.py > artifacts\wave-53-import-repair-diagnostic.txt 2>&1
          set REPAIR_RC=%ERRORLEVEL%
          type artifacts\wave-53-import-repair-diagnostic.txt
          exit /b %REPAIR_RC%

      - name: Commit repaired Data Bank presentation
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          del tools\fix_databank_import_control_wave_53.py
          del .github\workflows\repair-databank-import-wave-53.yml
          git add spina_app\databank_presentation.py tools\test_databank_presentation_wave_49.py tools\test_databank_widget_smoke_wave_49.py .github\workflows\import-log-presentation-wave-53.yml tools .github\workflows
          git commit -m "Restore Data Bank import control"
          python tools\generate_architecture_map.py
          git add architecture-map.json docs\architecture
          git commit -m "Refresh architecture map after import repair"
          git push origin HEAD:refs/heads/agent/high-volume-wave-53

      - name: Compile repaired application and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_presentation.py
          python -m py_compile spina_app\import_log_presentation.py
          python -m py_compile tools\test_databank_presentation_wave_49.py
          python -m py_compile tools\test_databank_widget_smoke_wave_49.py
          python -m py_compile tools\test_import_log_presentation_wave_53.py
          python -m py_compile tools\test_import_log_widget_smoke_wave_53.py

      - name: Verify restored Data Bank Import Excel control
        shell: cmd
        run: |
          python tools\test_databank_presentation_wave_49.py
          python tools\test_databank_widget_smoke_wave_49.py

      - name: Verify Wave 53 Import Log extraction
        shell: cmd
        run: |
          python -m tools.test_import_log_presentation_wave_53
          python -m tools.test_import_log_widget_smoke_wave_53

      - name: Run protected Data Bank and navigation regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Validate architecture map and audits
        shell: cmd
        run: |
          python -m tools.test_architecture_map
          if not exist artifacts mkdir artifacts
          python tools\redundancy_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-53-import-repair-redundancy.json
          python tools\spina_quality_audit.py OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py --json artifacts\wave-53-import-repair-quality.json

      - name: Upload repair reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-53-databank-import-repair
          path: artifacts/wave-53-import-repair-*
          if-no-files-found: warn
