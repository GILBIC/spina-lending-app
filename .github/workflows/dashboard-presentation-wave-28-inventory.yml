name: Dashboard presentation Wave 28 inventory

on:
  pull_request:
  workflow_dispatch:

jobs:
  inventory:
    if: github.head_ref == 'agent/dashboard-presentation-wave-28' || github.ref == 'refs/heads/agent/dashboard-presentation-wave-28'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out Wave 28 branch
        uses: actions/checkout@v4

      - name: Verify Python
        shell: cmd
        run: |
          python --version
          python -m py_compile tools\inventory_dashboard_presentation_wave_28.py

      - name: Inventory mapped Dashboard batch
        shell: cmd
        run: |
          if not exist artifacts mkdir artifacts
          python -m tools.inventory_dashboard_presentation_wave_28 > artifacts\dashboard-presentation-wave-28-inventory.log 2>&1
          set CODE=%ERRORLEVEL%
          type artifacts\dashboard-presentation-wave-28-inventory.log
          exit /b %CODE%

      - name: Upload Dashboard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-presentation-wave-28-inventory
          path: |
            artifacts/dashboard-presentation-wave-28-inventory.json
            artifacts/dashboard-presentation-wave-28-inventory.md
            artifacts/dashboard-presentation-wave-28-inventory.log
          if-no-files-found: error
