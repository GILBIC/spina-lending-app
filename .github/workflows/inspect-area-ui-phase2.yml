name: Inspect hierarchical Area UI Phase 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hierarchical-area-ui-phase-2-inspect
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact Area UI blocks
        run: python tools/inspect_area_ui_phase2.py
      - name: Commit focused report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/fixtures/area_ui_phase2_inspection.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Phase 2 Area UI blocks"
          git push origin HEAD:agent/hierarchical-area-ui-phase-2-inspect
