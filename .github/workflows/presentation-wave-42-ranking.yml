name: Rank presentation candidates Wave 42
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  rank:
    if: github.head_ref == 'agent/presentation-wave-42'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rank remaining presentation candidates
        shell: cmd
        run: python .github/scripts/rank_presentation_wave_42.py
      - name: Commit ranking report when changed
        shell: cmd
        run: |
          git config user.name "SPINA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add wave-42-candidates.md
          git diff --cached --quiet || git commit -m "Rank Wave 42 presentation candidates"
      - name: Configure runner GitHub authentication
        shell: cmd
        run: gh auth setup-git
      - name: Push ranking report
        shell: cmd
        run: git push origin HEAD:refs/heads/${{ github.head_ref }}
