name: Finalize System Data presentation Wave 55

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-system-data-presentation-wave-55.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-system-data-presentation-wave-55
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-55'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Check out Wave 55 branch
        uses: actions/checkout@v4
        with:
          ref: agent/high-volume-wave-55
          fetch-depth: 0
          show-progress: false

      - name: Compile and run focused System Data tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\system_data_presentation.py
          python -m py_compile tools\test_system_data_presentation_wave_55.py
          python -m py_compile tools\test_system_data_widget_smoke_wave_55.py
          python -m compileall -q spina_app
          python -m tools.test_system_data_presentation_wave_55
          python -m tools.test_system_data_widget_smoke_wave_55

      - name: Run protected navigation and theme regressions
        shell: cmd
        run: |
          python -m tools.test_navigation_and_databank_shell_wave_29
          python -m tools.test_theme_presentation_wave_35
          python -m tools.test_side_navigation_presentation_wave_48
          python -m tools.test_side_navigation_widget_smoke_wave_48

      - name: Refresh and validate architecture map
        shell: cmd
        run: |
          python -m py_compile tools\generate_architecture_map.py
          python -m py_compile tools\test_architecture_map.py
          python -m tools.generate_architecture_map
          python -m tools.test_architecture_map

      - name: Remove finalizer and commit clean Wave 55 branch
        shell: cmd
        run: |
          del .github\workflows\finalize-system-data-presentation-wave-55.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit /b 0
          git commit -m "Finalize System Data presentation Wave 55"
          git push origin HEAD:agent/high-volume-wave-55
