name: Wave 66 Data Bank Close Records Extractor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_wave66_databank_close_records_extraction.py"
      - ".github/workflows/wave66-databank-close-records-extractor.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wave66-databank-close-records-extractor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-66'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Check out exact Wave 66 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Apply guarded 224-line extraction
        shell: cmd
        run: |
          python -m py_compile tools\apply_wave66_databank_close_records_extraction.py
          python tools\apply_wave66_databank_close_records_extraction.py

      - name: Compile extracted application and tests
        shell: cmd
        run: |
          python -m py_compile OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          python -m py_compile spina_app\databank_close_records_presentation.py
          python -m py_compile tools\test_databank_close_records_presentation_wave_66.py
          python -m py_compile tools\test_databank_close_records_widget_smoke_wave_66.py

      - name: Run Wave 66 focused regressions
        shell: cmd
        run: |
          python -m tools.test_databank_close_records_presentation_wave_66
          python -m tools.test_databank_close_records_widget_smoke_wave_66

      - name: Commit extracted source and permanent tests
        shell: cmd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OFFICIAL_SPINA_APP_PostgreSQL_TEST_v33_stability_performance_fixed.py
          git add spina_app\databank_close_records_presentation.py
          git add tools\test_databank_close_records_presentation_wave_66.py
          git add tools\test_databank_close_records_widget_smoke_wave_66.py
          git diff --cached --quiet || git commit -m "Extract Data Bank close-records presentation Wave 66"

      - name: Regenerate architecture maps
        shell: cmd
        run: |
          python -m tools.generate_architecture_map
          git add architecture-map.json docs\architecture
          git diff --cached --quiet || git commit -m "Refresh Wave 66 architecture maps"

      - name: Push Wave 66 extraction
        shell: cmd
        run: git push origin HEAD:agent/high-volume-wave-66
