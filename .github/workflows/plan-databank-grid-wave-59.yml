name: Plan Data Bank grid Wave 59

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tools/plan_databank_grid_wave59_tmp.py"
      - ".github/workflows/plan-databank-grid-wave-59.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-databank-grid-wave-59-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/high-volume-wave-59'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Compile Data Bank grid analyzer
        shell: cmd
        run: python -m py_compile tools\plan_databank_grid_wave59_tmp.py
      - name: Analyze Data Bank grid boundary
        shell: cmd
        run: python tools\plan_databank_grid_wave59_tmp.py
      - name: Upload Data Bank grid report and sources
        uses: actions/upload-artifact@v4
        with:
          name: databank-grid-wave-59-candidates
          path: |
            artifacts/wave-59-databank-grid-candidates.json
            artifacts/wave-59-databank-grid-sources/*.py
          if-no-files-found: error
