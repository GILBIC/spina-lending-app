publish_to: "none"
version: 0.5.0+7

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  file_saver: ^0.4.0
  http: ^1.6.0
  image_picker: ^1.2.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_sqlcipher: ^3.4.0
  url_launcher: ^6.3.2
  file_selector: 1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
