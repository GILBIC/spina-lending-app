<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c72c73" />
    <meta name="description" content="Spina Lending Company secure sign-in portal." />
    <title>Spina Lending Company</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/spina-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div id="app-root">
      <section id="auth-view" class="auth-page">
        <div class="auth-backdrop" aria-hidden="true"></div>
        <header class="auth-brand">
          <img src="/assets/spina-icon.svg" alt="" width="52" height="52" />
          <div>
            <h1>Spina Lending Company</h1>
          </div>
        </header>

        <div class="auth-grid">
          <article class="auth-card auth-sign-in">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Welcome back</p>
                <h2>Sign in</h2>
              </div>
            </div>
            <p class="auth-help">Use the username provided by your office.</p>
            <form id="login-form" class="form-stack" novalidate>
              <label>
                Username
                <input name="username" autocomplete="username" required maxlength="80" placeholder="Enter your Spina username" />
              </label>
              <label>
                Password
                <input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Enter your password" />
              </label>
              <p id="login-feedback" class="form-feedback" role="alert" tabindex="-1" hidden></p>
              <button class="button button-primary" type="submit">Sign in</button>
            </form>
          </article>
        </div>
      </section>

      <section id="authenticated-app" class="authenticated-app" hidden>
        <a class="skip-link" href="#role-content">Skip to workspace</a>
        <header class="topbar">
          <div class="brand-lockup">
            <img src="/assets/spina-icon.svg" alt="" width="40" height="40" />
            <div>
              <strong>Spina</strong>
              <span id="environment-label">Company</span>
            </div>
          </div>
          <div class="topbar-context">
            <span id="connection-status" class="status-chip" role="status">Checking connection</span>
            <span id="signed-in-role" class="role-chip"></span>
          </div>
          <div class="topbar-actions">
            <button id="refresh-workspace" class="button button-quiet" type="button">Refresh</button>
            <details id="account-menu" class="account-menu">
              <summary>Account</summary>
              <div class="account-menu-panel">
                <strong id="signed-in-name" class="signed-in-name"></strong>
                <label id="workspace-choice-label" hidden>Switch workspace <select id="workspace-choice" aria-label="Choose authorized workspace"></select></label>
                <button id="logout-button" class="button button-outline" type="button">Sign out</button>
              </div>
            </details>
          </div>
        </header>

        <div class="app-layout">
          <aside id="workspace-sidebar" class="sidebar">
            <div class="sidebar-title">
              <p class="eyebrow">Workspace</p>
              <h2 id="workspace-title">Spina</h2>
            </div>
            <button id="navigation-toggle" class="navigation-toggle" type="button" aria-controls="role-navigation" aria-expanded="false"><span>Go to</span><strong id="current-screen">Today</strong><span aria-hidden="true">⌄</span></button>
            <nav id="role-navigation" aria-label="Role workspace navigation"></nav>
            <div class="sidebar-note">
              <span>Need the latest records?</span>
              <strong>Use Refresh when online.</strong>
            </div>
          </aside>
          <main id="role-content" class="role-content" tabindex="-1"></main>
        </div>
      </section>

      <div id="status-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>

    <noscript>Spina Lending Company requires JavaScript for secure authenticated access.</noscript>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
